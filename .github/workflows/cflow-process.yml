name: CFlowProcess contract

on:
  pull_request:
    paths:
      - "cflow-process/**"
      - ".github/workflows/cflow-process.yml"
      - "cmake/ci/restore-versioned-native-sdk.*"
      - "CMakeLists.txt"

permissions:
  contents: read
  packages: read

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SALTS_SDK_VERSION: "1.8.2"
  RE2C_BINARY_VERSION: "4.6.3"

jobs:
  linux:
    if: github.event_name != 'pull_request' || github.head_ref != 'refactor/4.1-ownership-convergence'
    name: Linux C11 contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          test -n "${VCPKG_ROOT:-}"
          test -n "${QIGAO_VCPKG_TOOLCHAIN_FILE:-}"
          test -n "${VCPKG_BINARY_SOURCES:-}"
          test -f "$GITHUB_WORKSPACE/vcpkg.json"

      - name: Restore published Salts 1.8.2 and re2c 4.6.3
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-versioned-native-sdk.sh linux-x64 linux-x64

      - name: Restore SaltsUtils third-party profile from repository manifest
        shell: bash
        run: |
          set -euxo pipefail
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$GITHUB_WORKSPACE" \
            --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed" \
            --triplet=x64-linux \
            --only-binarycaching

      - name: Configure default SaltsUtils graph
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/cflow-process -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DSALTS_UTILS_ENABLE_CAPTURE=OFF \
            -DSALTS_UTILS_ENABLE_CFLOW_USB=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_EXAMPLES=OFF

      - name: Build and run CFlowProcess contract
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/cflow-process --target cflow_process_test --parallel 2
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build/cflow-process \
            -R '^cflow_process_test$' \
            --no-tests=error --output-on-failure
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

  windows:
    if: github.event_name != 'pull_request' || github.head_ref != 'refactor/4.1-ownership-convergence'
    name: Windows C11 contract
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare native toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install nasm ninja -y --no-progress
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) { throw "Visual Studio x64 C++ toolchain not found" }
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_ROOT)) { throw "VCPKG_ROOT is unavailable" }
          if ([string]::IsNullOrWhiteSpace($env:QIGAO_VCPKG_TOOLCHAIN_FILE)) { throw "QIGAO_VCPKG_TOOLCHAIN_FILE is unavailable" }
          $manifest = Join-Path $env:GITHUB_WORKSPACE "vcpkg.json"
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw "repository SaltsUtils manifest is unavailable" }
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV

      - name: Restore published Salts 1.8.2 and re2c 4.6.3
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-versioned-native-sdk.ps1 -SaltsRid windows-x64 -Re2cRid windows-x64

      - name: Restore SaltsUtils third-party profile from repository manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            "--x-manifest-root=$env:GITHUB_WORKSPACE" `
            "--x-install-root=$env:GITHUB_WORKSPACE\vcpkg_installed" `
            "--triplet=x64-windows" `
            --only-binarycaching
          if ($LASTEXITCODE -ne 0) { throw "SaltsUtils repository manifest cache-only restore failed" }

      - name: Configure default SaltsUtils graph
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          set "PATH=%SALTS_ROOT%\bin;%GITHUB_WORKSPACE%\vcpkg_installed\x64-windows\bin;%PATH%"
          cmake -S . -B build\cflow-process -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_TOOLCHAIN_FILE%" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%\vcpkg_installed" -DVCPKG_MANIFEST_INSTALL=OFF -DSALTS_UTILS_ENABLE_CAPTURE=OFF -DSALTS_UTILS_ENABLE_CFLOW_USB=OFF -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF
          if errorlevel 1 exit /b 1

      - name: Build and run CFlowProcess contract
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          set "PATH=%SALTS_ROOT%\bin;%GITHUB_WORKSPACE%\vcpkg_installed\x64-windows\bin;%PATH%"
          cmake --build build\cflow-process --target cflow_process_test --parallel 2
          if errorlevel 1 exit /b 1
          ctest --test-dir build\cflow-process -R "^cflow_process_test$" --no-tests=error --output-on-failure
          if errorlevel 1 exit /b 1

      - name: Verify exact head and clean tracked source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw "workflow source changed" }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=no))) {
            throw "workflow modified tracked source"
          }
