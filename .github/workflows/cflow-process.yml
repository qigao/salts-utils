name: CFlowProcess contract

on:
  pull_request:
    paths:
      - "cflow-process/**"
      - ".github/workflows/cflow-process.yml"
      - "cmake/ci/restore-versioned-native-sdk.*"
      - "CMakeLists.txt"

permissions:
  contents: read
  packages: read

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SALTS_SDK_VERSION: "1.7.10"
  RE2C_BINARY_VERSION: "4.6.3"

jobs:
  linux:
    name: Linux C11 contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          test -n "${VCPKG_ROOT:-}"
          test -n "${QIGAO_VCPKG_TOOLCHAIN_FILE:-}"
      - name: Restore published Salts 1.7.10 and re2c 4.6.3
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-versioned-native-sdk.sh linux-x64 linux-x64
      - name: Restore focused vcpkg closure
        shell: bash
        run: |
          set -euxo pipefail
          "$VCPKG_ROOT/vcpkg" install             --x-manifest-root="$GITHUB_WORKSPACE/cmake/ci/vcpkg/plugin-databind"             --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed"             --triplet=x64-linux             --only-binarycaching
      - name: Build and run CFlowProcess contract
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/cflow-process -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE"             -DVCPKG_TARGET_TRIPLET=x64-linux             -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"             -DVCPKG_MANIFEST_INSTALL=OFF             -DSALTS_UTILS_ENABLE_CAPTURE=OFF             -DSALTS_UTILS_QUALIFY_PLUGIN_DATABIND=ON             -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build build/cflow-process --target cflow_process_test --parallel 2
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build/cflow-process -R '^cflow_process_test$'             --no-tests=error --output-on-failure
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

  windows:
    name: Windows C11 contract
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare native toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install nasm ninja -y --no-progress
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) { throw "Visual Studio x64 C++ toolchain not found" }
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
      - name: Restore published Salts 1.7.10 and re2c 4.6.3
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-versioned-native-sdk.ps1 -SaltsRid windows-x64 -Re2cRid windows-x64
      - name: Build and run CFlowProcess contract
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          set "VCPKG_ROOT=%VCPKG_ROOT%"
          "%VCPKG_ROOT%\vcpkg.exe" install --x-manifest-root="%GITHUB_WORKSPACE%\cmake\ci\vcpkg\plugin-databind" --x-install-root="%GITHUB_WORKSPACE%\vcpkg_installed" --triplet=x64-windows --only-binarycaching
          if errorlevel 1 exit /b 1
          set "PATH=%SALTS_ROOT%\bin;%GITHUB_WORKSPACE%\vcpkg_installed\x64-windows\bin;%PATH%"
          cmake -S . -B build\cflow-process -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_TOOLCHAIN_FILE%" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%\vcpkg_installed" -DVCPKG_MANIFEST_INSTALL=OFF -DSALTS_UTILS_ENABLE_CAPTURE=OFF -DSALTS_UTILS_QUALIFY_PLUGIN_DATABIND=ON -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF
          if errorlevel 1 exit /b 1
          cmake --build build\cflow-process --target cflow_process_test --parallel 2
          if errorlevel 1 exit /b 1
          ctest --test-dir build\cflow-process -R "^cflow_process_test$" --no-tests=error --output-on-failure
          if errorlevel 1 exit /b 1
          if not "%GITHUB_SHA%"=="" echo exact source checked by checkout
