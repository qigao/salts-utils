name: Jinja CMeta benchmark

on:
  pull_request:
    branches: [master]
    paths:
      - 'jinja/**'
      - 'cmake/**'
      - 'presets/**'
      - 'CMake*.txt'
      - 'CMake*.cmake'
      - 'CMake*Presets.json'
      - 'vcpkg.json'
      - '.github/workflows/jinja-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jinja-benchmark-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Linux Release benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SALTS_SHA: 2804c2eb809fed4cb89f917f0a8cd00f482abb64
      VCPKG_SHA: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
      SALTS_PROJECT_ROOT: ${{ github.workspace }}/.ci-cache/salts-project
      SALTS_PACKAGE: ${{ github.workspace }}/.ci-cache/salts-project/external/pkgs/salts/release
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/jinja-benchmark"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD | tee "$RUNNER_TEMP/jinja-benchmark/head.txt"
          git diff --exit-code

      - name: Checkout pinned Salts
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: ${{ env.SALTS_SHA }}
          path: salts
          persist-credentials: false

      - name: Verify pinned Salts source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C salts rev-parse HEAD)" = "$SALTS_SHA"

      - name: Restore installed Salts release package
        id: salts-package-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SALTS_PACKAGE }}
          key: salts-pkg-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ env.SALTS_SHA }}-vcpkg-${{ env.VCPKG_SHA }}

      - name: Checkout vcpkg at manifest baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_SHA }}
          path: vcpkg
          fetch-depth: 0
          persist-credentials: false

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: jinja-benchmark-vcpkg-x64-linux-b1b19307-v1

      - name: Prepare toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm curl xz-utils
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          sudo mkdir -p /opt/salts
          sudo ln -sfn "$GITHUB_WORKSPACE/vcpkg" /opt/vcpkg

      - name: Install pinned re2c 4.6 and Unicode data
        shell: bash
        run: bash cmake/ci/install-re2c.sh

      - name: Build standalone host Lemon
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S tools/lemon -B build/host-lemon -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host-lemon --target lemon -j2

      - name: Build and install pinned Salts release
        if: steps.salts-package-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: salts
        env:
          PROJECT_ROOT: ${{ env.SALTS_PROJECT_ROOT }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          cmake --preset linux-release-user
          cmake --build build/linux-gcc-release --target install -j2

      - name: Validate installed Salts release package
        shell: bash
        run: |
          set -euxo pipefail
          test -d "$SALTS_PACKAGE/include"
          test -d "$SALTS_PACKAGE/lib"
          test -n "$(find "$SALTS_PACKAGE/lib" -maxdepth 1 -type f -print -quit)"
          sudo ln -sfn "$SALTS_PACKAGE" /opt/salts/release

      - name: Save installed Salts release package
        if: steps.salts-package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SALTS_PACKAGE }}
          key: ${{ steps.salts-package-cache.outputs.cache-primary-key }}

      - name: Configure Jinja benchmark release build
        shell: bash
        run: |
          set -euxo pipefail
          cmake --preset linux-release-user \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="$GITHUB_WORKSPACE/build/host-lemon/lemon" \
            2>&1 | tee "$RUNNER_TEMP/jinja-benchmark/configure.log"

      - name: Build benchmark target
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-release --target benchmark_jinja_cmeta -j2 \
            2>&1 | tee "$RUNNER_TEMP/jinja-benchmark/build.log"

      - name: Run benchmark
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-release --no-tests=error \
            -R '^benchmark_jinja_cmeta$' -V \
            2>&1 | tee "$RUNNER_TEMP/jinja-benchmark/benchmark.log"

      - name: Verify unchanged tracked sources
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jinja-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: ${{ runner.temp }}/jinja-benchmark/
