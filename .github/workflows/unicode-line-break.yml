name: Unicode line-break conformance

on:
  pull_request:
    branches: [master]
    paths:
      - "unicode/**"
      - "cmake/**"
      - "CMake*.txt"
      - "CMake*Presets.json"
      - ".github/workflows/unicode-line-break.yml"
  push:
    branches: [master]
    paths:
      - "unicode/**"
      - "cmake/**"
      - "CMake*.txt"
      - "CMake*Presets.json"
      - ".github/workflows/unicode-line-break.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: salts-utils-unicode-line-break-${{ github.ref_name }}
  cancel-in-progress: true

env:
  VCPKG_SHA: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01

jobs:
  line-break-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact SaltsUtils head
        uses: actions/checkout@v4

      - name: Checkout vcpkg at manifest baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
          path: vcpkg
          fetch-depth: 0
          persist-credentials: false

      - name: Restore vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: unicode-line-break-vcpkg-x64-linux-b1b19307-v1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Go for BoringSSL
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Prepare versioned SDK toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          sudo ln -sfn "$GITHUB_WORKSPACE/vcpkg" /opt/vcpkg

      - name: Restore Salts 1.2.0 and re2c 4.6.3
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-versioned-native-sdk.sh linux-x64 linux-x64

      - name: Expose versioned Salts SDK
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$SALTS_ROOT/lib/cmake/Salts/SaltsConfig.cmake"
          sudo mkdir -p /opt/salts
          sudo ln -sfn "$SALTS_ROOT" /opt/salts/debug

      - name: Build standalone host Lemon
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S tools/lemon -B build/host-lemon -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host-lemon --target lemon -j2

      - name: Configure exact SaltsUtils head
        shell: bash
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="${GITHUB_WORKSPACE}/build/host-lemon/lemon"

      - name: Verify deterministic Unicode 17 line-break table generation
        shell: bash
        run: |
          set -euxo pipefail
          python3 unicode/tools/generate_line_break_data.py \
            --line-break unicode/data/17.0.0/LineBreak.txt \
            --unicode-data unicode/data/17.0.0/UnicodeData.txt \
            --east-asian-width unicode/data/17.0.0/EastAsianWidth.txt \
            --emoji-data unicode/data/17.0.0/emoji-data.txt \
            --output "${RUNNER_TEMP}/unicode_line_break_data.h"
          cmp "${RUNNER_TEMP}/unicode_line_break_data.h" unicode/src/unicode_line_break_data.h

      - name: Build focused line-break tests
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug \
            --target test_salts_unicode_line_break test_salts_unicode_line_break_conformance -j2

      - name: Run Unicode 17 line-break tests
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug \
            -R '^test_salts_unicode_line_break(_conformance)?$' --output-on-failure

      - name: Install exact SaltsUtils head
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug --target install -j2

      - name: Verify C and C++ install-tree Unicode consumers
        shell: bash
        env:
          SALTS_ROOT: /opt/salts/debug
        run: |
          set -euxo pipefail
          consumer="${RUNNER_TEMP}/unicode-line-break-consumer"
          mkdir -p "${consumer}"

          cat > "${consumer}/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.27)
          project(SaltsUnicodeInstallConsumer LANGUAGES C CXX)
          find_package(SaltsUtils CONFIG REQUIRED)
          add_executable(unicode_consumer_c main.c)
          add_executable(unicode_consumer_cpp main.cpp)
          target_link_libraries(unicode_consumer_c PRIVATE Salts::Unicode)
          target_link_libraries(unicode_consumer_cpp PRIVATE Salts::Unicode)
          EOF

          cat > "${consumer}/main.c" <<'EOF'
          #include <salts_unicode.h>
          int main(void) {
            salts_unicode_line_break value = SALTS_UNICODE_LINE_BREAK_XX;
            return salts_unicode_line_break_class(0x2010u, &value) == SALTS_UNICODE_OK &&
                           value == SALTS_UNICODE_LINE_BREAK_HH
                       ? 0
                       : 1;
          }
          EOF

          cat > "${consumer}/main.cpp" <<'EOF'
          #include <salts_unicode.h>
          int main() {
            salts_unicode_line_break value = SALTS_UNICODE_LINE_BREAK_XX;
            return salts_unicode_line_break_class(0x2060u, &value) == SALTS_UNICODE_OK &&
                           value == SALTS_UNICODE_LINE_BREAK_WJ
                       ? 0
                       : 1;
          }
          EOF

          cmake -S "${consumer}" -B "${consumer}/build" -G Ninja             -DCMAKE_PREFIX_PATH="/opt/salts-utils/debug;${GITHUB_WORKSPACE}/vcpkg_installed/x64-linux/debug"
          cmake --build "${consumer}/build" -j2
          "${consumer}/build/unicode_consumer_c"
          "${consumer}/build/unicode_consumer_cpp"

      - name: Verify exact head
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
