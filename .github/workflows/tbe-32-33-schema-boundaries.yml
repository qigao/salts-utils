name: TBE schema boundaries

on:
  push:
    branches: [master, fix/tbe-32-33-schema-boundaries]
    paths:
      - 'tbe/schema/**'
      - 'tbe/tbe_compiler/**'
      - 'tools/lemon/**'
      - 'cmake/**'
      - 'presets/**'
      - 'CMake*.txt'
      - 'CMake*.cmake'
      - 'CMake*Presets.json'
      - 'vcpkg.json'
      - '.github/workflows/tbe-32-33-schema-boundaries.yml'
  pull_request:
    branches: [master]
    paths:
      - 'tbe/schema/**'
      - 'tbe/tbe_compiler/**'
      - 'tools/lemon/**'
      - 'cmake/**'
      - 'presets/**'
      - 'CMake*.txt'
      - 'CMake*.cmake'
      - 'CMake*Presets.json'
      - 'vcpkg.json'
      - '.github/workflows/tbe-32-33-schema-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tbe-schema-boundaries-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  schema-boundaries:
    name: Exact-head ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=2:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      SALTS_SHA: 2804c2eb809fed4cb89f917f0a8cd00f482abb64
      VCPKG_SHA: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
      SALTS_PROJECT_ROOT: ${{ runner.temp }}/salts-project
      SALTS_PACKAGE: ${{ runner.temp }}/salts-project/external/pkgs/salts/debug
    steps:
      - name: Checkout the exact committed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record and verify source identity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/tbe-schema-evidence"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD | tee "$RUNNER_TEMP/tbe-schema-evidence/head.txt"
          git diff --exit-code

      - name: Checkout pinned Salts
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: ${{ env.SALTS_SHA }}
          path: salts
          persist-credentials: false

      - name: Record native parser dependency revision
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C salts rev-parse HEAD)" = "$SALTS_SHA"
          git -C salts rev-parse HEAD | tee "$RUNNER_TEMP/tbe-schema-evidence/salts-head.txt"

      - name: Restore installed Salts debug package
        id: salts-package-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SALTS_PACKAGE }}
          key: salts-pkg-v1-${{ runner.os }}-${{ runner.arch }}-debug-${{ env.SALTS_SHA }}-vcpkg-${{ env.VCPKG_SHA }}

      - name: Checkout vcpkg at the manifest baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_SHA }}
          path: vcpkg
          fetch-depth: 0
          persist-credentials: false

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: tbe-schema-vcpkg-x64-linux-b1b19307-v1

      - name: Prepare toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm curl xz-utils
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          sudo mkdir -p /opt/salts
          sudo ln -sfn "$GITHUB_WORKSPACE/vcpkg" /opt/vcpkg

      - name: Install pinned re2c 4.6 and Unicode data
        shell: bash
        run: bash cmake/ci/install-re2c.sh

      - name: Build the standalone host parser generator
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S tools/lemon -B build/host-lemon -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host-lemon --target lemon -j2

      - name: Build and install pinned Salts debug profile
        if: steps.salts-package-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: salts
        env:
          PROJECT_ROOT: ${{ env.SALTS_PROJECT_ROOT }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user
          cmake --build build/linux-gcc-debug --target install -j2

      - name: Validate installed Salts debug package
        shell: bash
        run: |
          set -euxo pipefail
          test -d "$SALTS_PACKAGE/include"
          test -d "$SALTS_PACKAGE/lib"
          test -n "$(find "$SALTS_PACKAGE/lib" -maxdepth 1 -type f -print -quit)"
          sudo ln -sfn "$SALTS_PACKAGE" /opt/salts/debug

      - name: Save installed Salts debug package
        if: steps.salts-package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SALTS_PACKAGE }}
          key: ${{ steps.salts-package-cache.outputs.cache-primary-key }}

      - name: Configure developer preset with both sanitizers
        shell: bash
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user -DENABLE_SANITIZER_UNDEFINED=ON \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="$GITHUB_WORKSPACE/build/host-lemon/lemon" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            2>&1 | tee "$RUNNER_TEMP/tbe-schema-evidence/configure.log"
          python3 - <<'PY'
          import json
          from pathlib import Path
          commands = json.loads(Path('build/linux-gcc-debug/compile_commands.json').read_text())
          required = {'schema_parser_dsl.c', 'schema_enum.c', 'test_schema_enum_conformance.c',
                      'test_schema_boundaries.c', 'test_schema_boundary.c'}
          found = set()
          for entry in commands:
              name = Path(entry['file']).name
              if name in required:
                  command = entry.get('command', ' '.join(entry.get('arguments', [])))
                  assert '-fsanitize=address' in command, command
                  assert '-fsanitize=undefined' in command, command
                  found.add(name)
          assert found == required, (found, required)
          PY

      - name: Verify host lemon dependency graph
        shell: bash
        run: |
          set -euxo pipefail
          ninja -C build/linux-gcc-debug -t commands test_schema_boundaries \
            | tee "$RUNNER_TEMP/tbe-schema-evidence/parser-commands.log"
          grep -F "$GITHUB_WORKSPACE/build/host-lemon/lemon -T" \
            "$RUNNER_TEMP/tbe-schema-evidence/parser-commands.log"
          if grep -F "$GITHUB_WORKSPACE/build/linux-gcc-debug/bin/lemon -T" \
              "$RUNNER_TEMP/tbe-schema-evidence/parser-commands.log"; then
            echo "sanitized target lemon is still wired into schema generation" >&2
            exit 1
          fi

      - name: Build focused boundary tests
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug --target test_schema_boundaries \
            test_tbe_compiler_schema_boundary test_schema_enum_conformance -j2 \
            2>&1 | tee "$RUNNER_TEMP/tbe-schema-evidence/focused-build.log"

      - name: Run focused schema boundary tests
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug --no-tests=error \
            -R '^(test_schema_boundaries|test_tbe_compiler_schema_boundary|test_schema_enum_conformance)$' \
            --output-on-failure --output-junit "$RUNNER_TEMP/tbe-schema-evidence/focused.xml" \
            2>&1 | tee "$RUNNER_TEMP/tbe-schema-evidence/focused.log"

      - name: Build complete TBE suite
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug --target tbe/all -j2 \
            2>&1 | tee "$RUNNER_TEMP/tbe-schema-evidence/tbe-build.log"

      - name: Run complete TBE suite
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug/tbe --no-tests=error --output-on-failure \
            --output-junit "$RUNNER_TEMP/tbe-schema-evidence/tbe.xml" \
            2>&1 | tee "$RUNNER_TEMP/tbe-schema-evidence/tbe.log"

      - name: Verify committed source was not modified
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code

      - name: Upload exact-head verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tbe-schema-boundaries-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/tbe-schema-evidence/
            build/linux-gcc-debug/compile_commands.json
