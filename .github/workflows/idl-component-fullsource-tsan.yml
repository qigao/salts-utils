name: Generated FR2 + strict ServiceHost complete first-party TSan (review only)
'on':
  pull_request:
    paths:
      - ".github/workflows/idl-component-fullsource-tsan.yml"
      - "databind/compiler/component_provider_candidate.*"
      - "databind/compiler/tests/plugin/**"
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: generated-fr2-fullsource-tsan-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  linux:
    name: Exact-source Salts CMeta + SaltsUtils FR2 + strict ServiceHost TSan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_SU: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_SALTS: 297daa4f69aa7bfcc7cc64f245d9be107fd8bfbe
      EXPECTED_HOST: 23032bfe124df327317ce9b4d132054e99b2c0cb
      QIGAO_SDK_RID: linux-x64
      QIGAO_TARGET_TRIPLET: x64-linux
      QIGAO_HOST_TRIPLET: x64-linux
      CCACHE_DIR: ${{ github.workspace }}/build/fr2-source-tsan/ccache
      CCACHE_COMPILERCHECK: content
      SALTS_UTILS_COMPILER_CACHE_NAMESPACE: su-idlc-fr2-fullsource-tsan-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SU }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: 297daa4f69aa7bfcc7cc64f245d9be107fd8bfbe
          path: build/fr2-source-tsan/salts
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: 23032bfe124df327317ce9b4d132054e99b2c0cb
          path: build/fr2-source-tsan/strict-host
          persist-credentials: false
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@fafb1efe5ac2440bfd7a08e493988d0459d89e51
        with:
          mode: read
      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@fafb1efe5ac2440bfd7a08e493988d0459d89e51
      - uses: ./.github/actions/setup-build-host
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Assert source hashes, CMeta/ServiceHost ABI and POSIX once
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SU"
          test "$(git -C build/fr2-source-tsan/salts rev-parse HEAD)" = "$EXPECTED_SALTS"
          test "$(git -C build/fr2-source-tsan/strict-host rev-parse HEAD)" = "$EXPECTED_HOST"
          test "$(git -C build/fr2-source-tsan/salts rev-parse HEAD:cmeta/include/cmeta/interface.h)" = abf327f987e218a9e0fcbde20533bc14bad47636
          test "$(git -C build/fr2-source-tsan/strict-host rev-parse HEAD:component-runtime/src/service_host.c)" = e9d31e8b4e65472a343172d0157f1a28cea05cbd
          grep -qF 'pthread_once(&guard->native, callback)' build/fr2-source-tsan/salts/platform/src/thread_posix.c
          for abi in component/include/salts/component_abi.h \
              component-plugin/include/salts/component_plugin_abi.h \
              plugin/include/salts/plugin.h \
              cmeta/include/cmeta/object_interface.h \
              cmeta/include/cmeta/object.h \
              cmeta/include/cmeta/component.h \
              cmeta/include/cmeta/abi.h; do
            cmp -s "build/fr2-source-tsan/salts/$abi" \
              "build/fr2-source-tsan/strict-host/$abi" ||
              { echo "Strict source ABI mismatch: $abi" >&2; exit 1; }
          done
          printf 'salts=%s\nsaltsutils=%s\nstrict_host=%s\ntsan=first-party-source\npublish=false\n' \
            "$EXPECTED_SALTS" "$EXPECTED_SU" "$EXPECTED_HOST" |
            tee build/fr2-source-tsan/provenance.txt
      - name: Build and install TSan-instrumented canonical Salts CMeta/Plugin
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/fr2-fullsource-tsan/salts"
          cmake --preset linux-tsan-ci -S "$GITHUB_WORKSPACE/build/fr2-source-tsan/salts" \
            -B build/fr2-source-tsan/build-salts -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$prefix" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZER_THREAD=ON -DENABLE_SANITIZER_ADDRESS=OFF \
            -DSALTS_ENABLE_COMPONENT_RUNTIME_CANDIDATE=OFF
          cmake --build build/fr2-source-tsan/build-salts --parallel 2
          cmake --install build/fr2-source-tsan/build-salts
          test -f "$prefix/include/salts/component_plugin_abi.h"
          grep -q ComponentPluginABI "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
      - name: Build original generated FR2 Provider and strict ServiceHost with TSan
        shell: bash
        run: |
          set -euo pipefail
          export SALTS_ROOT="$RUNNER_TEMP/fr2-fullsource-tsan/salts"
          export PKG_ROOT="$RUNNER_TEMP/fr2-fullsource-tsan/salts-utils"
          export VCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$SALTS_ROOT/bin:${LD_LIBRARY_PATH:-}"
          cmake --preset ci-linux-release-user -B build/fr2-source-tsan/build-utils \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$SALTS_ROOT;$VCPKG_INSTALLED_DIR/x64-linux" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DDATABIND_ENABLE_COMPONENT_PROVIDER_CANDIDATE_DSO=ON \
            -DDATABIND_ENABLE_COMPONENT_PROVIDER_STRICT_SERVICEHOST=ON \
            -DDATABIND_SALTS_STRICT_SERVICEHOST_SOURCE_DIR="$GITHUB_WORKSPACE/build/fr2-source-tsan/strict-host" \
            -DENABLE_SANITIZER_THREAD=ON -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=thread -g -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -fno-omit-frame-pointer" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build/fr2-source-tsan/build-utils --parallel 2 \
            --target databind_component_candidate_provider \
                     databind_component_candidate_multi_provider \
                     test_databind_component_candidate_dso_c11 \
                     test_databind_component_candidate_multi_dso_c11 \
                     test_databind_component_candidate_header_cpp \
                     test_databind_component_candidate_multi_header_cpp \
                     test_databind_component_candidate_strict_servicehost_c11
      - name: Prove complete first-party TSan compile-unit closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee build/fr2-source-tsan/instrumentation.txt
          import json
          from pathlib import Path
          base=Path("build/fr2-source-tsan")
          required={
            "Salts":("build-salts", [
              "platform/src/thread_posix.c",
              "component-plugin/src/component_plugin.c",
              "cmeta/src/type_identity.c"]),
            "SaltsUtils":("build-utils", [
              "databind/compiler/component_provider_candidate.c",
              "databind/runtime/data_bind_binding_plan.c",
              "databind/compiler/tests/plugin/test_component_multi_servicehost_strict.c",
              "component-runtime/src/service_host.c",
              "component-runtime/src/service_host_runtime.c",
              "component-runtime/src/configurator.c"])
          }
          for label, (name, suffixes) in required.items():
            commands=json.loads((base/name/"compile_commands.json").read_text())
            missing=[c["file"] for c in commands
                     if "-fsanitize=thread" not in (
                         c.get("command") or " ".join(c.get("arguments", [])))]
            print(f"{label}: first_party_commands={len(commands)} missing_tsan={len(missing)}")
            if not commands or missing:
              raise SystemExit(f"{label}: uninstrumented units: {missing[:5]}")
            for suffix in suffixes:
              count=sum(c["file"].endswith(suffix) for c in commands)
              print(f"{label}: {suffix}={count}")
              if count<1 or ("/component-runtime/" in suffix and count!=1):
                raise SystemExit(f"{label}: missing/duplicate required source: {suffix}={count}")
          PY
          binary=build/fr2-source-tsan/build-utils/bin/test_databind_component_candidate_strict_servicehost_c11
          test -x "$binary"
          ldd "$binary" | tee build/fr2-source-tsan/consumer-ldd.txt
          grep -q libtsan build/fr2-source-tsan/consumer-ldd.txt
      - name: Execute real generated FR2 DSO N+1 rollback without TSan suppression
        shell: bash
        run: |
          set -euo pipefail
          export SALTS_ROOT="$RUNNER_TEMP/fr2-fullsource-tsan/salts"
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$SALTS_ROOT/bin:${LD_LIBRARY_PATH:-}"
          export TSAN_OPTIONS="halt_on_error=1"
          timeout --signal=TERM --kill-after=15s 600s \
            ctest --test-dir build/fr2-source-tsan/build-utils \
            -R '^test_databind_component_candidate_' \
            --repeat until-fail:20 --no-tests=error \
            --output-on-failure --timeout 90
      - name: Preserve exact source and sanitizer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idlc-generated-fr2-tsan-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/fr2-source-tsan/provenance.txt
            build/fr2-source-tsan/instrumentation.txt
            build/fr2-source-tsan/consumer-ldd.txt
            build/fr2-source-tsan/build-utils/Testing/Temporary/LastTest.log
      - name: Require initiating source checkout unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SU"
          test -z "$(git status --porcelain --untracked-files=no)"
