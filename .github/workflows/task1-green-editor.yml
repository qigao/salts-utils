name: Task 1 green editor

on:
  push:
    branches:
      - automation/task1-green-edit

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/task1-green-edit
      - name: Apply focused Task 1 identity seam
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return text.replace(old, new, 1)

          c_path = Path("tbe/data_bind/data_bind.c")
          c = c_path.read_text()

          c = replace_once(
              c,
              "struct DataBindValue {\n  DataBindValueKind kind;",
              "typedef struct db_dynamic_graph {\n"
              "  size_t references;\n"
              "  cmeta_type_identity root_identity;\n"
              "  char *stable_id;\n"
              "} db_dynamic_graph_t;\n\n"
              "struct DataBindValue {\n"
              "  size_t references;\n"
              "  const cmeta_type_identity *type_identity;\n"
              "  db_dynamic_graph_t *owned_graph;\n"
              "  DataBindValueKind kind;",
              "DataBindValue metadata layout")

          marker = "static DataBindValue *dbv_new(DataBindValueKind kind) {"
          helper = r'''static db_dynamic_graph_t *db_dynamic_graph_retain(db_dynamic_graph_t *graph) {
  if (graph == NULL || graph->references == SIZE_MAX) return NULL;
  graph->references++;
  return graph;
}

static void db_dynamic_graph_release(db_dynamic_graph_t *graph) {
  if (graph == NULL || graph->references == 0u) return;
  graph->references--;
  if (graph->references != 0u) return;
  free(graph->stable_id);
  free(graph);
}

static db_dynamic_graph_t *db_dynamic_graph_create_root(
    const uint8_t schema_fingerprint[DATA_BIND_SCHEMA_FINGERPRINT_SIZE],
    const char *root_type) {
  static const char prefix[] = "salts-utils.databind.dynamic.v1:";
  static const char hex[] = "0123456789abcdef";
  db_dynamic_graph_t *graph;
  size_t prefix_len;
  size_t type_len;
  size_t stable_len;
  size_t i;
  char *cursor;

  if (schema_fingerprint == NULL || root_type == NULL || root_type[0] == '\0') return NULL;
  prefix_len = sizeof(prefix) - 1u;
  type_len = strlen(root_type);
  if (type_len > SIZE_MAX - prefix_len - DATA_BIND_SCHEMA_FINGERPRINT_SIZE * 2u - 2u)
    return NULL;
  stable_len = prefix_len + DATA_BIND_SCHEMA_FINGERPRINT_SIZE * 2u + 1u + type_len;

  graph = (db_dynamic_graph_t *)calloc(1u, sizeof(*graph));
  if (graph == NULL) return NULL;
  graph->stable_id = (char *)malloc(stable_len + 1u);
  if (graph->stable_id == NULL) {
    free(graph);
    return NULL;
  }

  cursor = graph->stable_id;
  memcpy(cursor, prefix, prefix_len);
  cursor += prefix_len;
  for (i = 0u; i < DATA_BIND_SCHEMA_FINGERPRINT_SIZE; ++i) {
    *cursor++ = hex[(schema_fingerprint[i] >> 4u) & 0x0fu];
    *cursor++ = hex[schema_fingerprint[i] & 0x0fu];
  }
  *cursor++ = ':';
  memcpy(cursor, root_type, type_len);
  cursor[type_len] = '\0';

  graph->references = 1u;
  graph->root_identity.form = CMETA_TYPE_ATOM;
  graph->root_identity.stable_atom_id = graph->stable_id;
  graph->root_identity.constructor = NULL;
  graph->root_identity.base = NULL;
  graph->root_identity.args = NULL;
  graph->root_identity.arity = 0u;
  return graph;
}

static int db_dynamic_attach_root(DataBind *codec, const char *root_type, DataBindValue *value) {
  db_dynamic_graph_t *graph;
  if (codec == NULL || value == NULL || value->owned_graph != NULL) return 0;
  graph = db_dynamic_graph_create_root(codec->schema_fingerprint, root_type);
  if (graph == NULL) return 0;
  value->owned_graph = graph;
  value->type_identity = &graph->root_identity;
  return 1;
}

'''
          c = replace_once(c, marker, helper + marker, "dynamic graph helper insertion")

          c = replace_once(
              c,
              "  if (value != NULL) value->kind = kind;\n  return value;\n}",
              "  if (value != NULL) {\n"
              "    value->references = 1u;\n"
              "    value->kind = kind;\n"
              "  }\n"
              "  return value;\n}",
              "dbv_new initialization")

          c = replace_once(
              c,
              "void data_bind_value_free(DataBindValue *value) {\n  size_t i;\n  if (value == NULL) return;",
              "void data_bind_value_free(DataBindValue *value) {\n"
              "  db_dynamic_graph_t *owned_graph;\n"
              "  size_t i;\n"
              "  if (value == NULL) return;\n"
              "  owned_graph = value->owned_graph;\n"
              "  value->owned_graph = NULL;\n"
              "  value->type_identity = NULL;",
              "value free prologue")

          c = replace_once(
              c,
              "\n  if (value_pool_is_enabled() && value_pool_put(value)) return;\n  free(value);\n}\n\nstatic DataBindValue *dbv_int(",
              "\n  db_dynamic_graph_release(owned_graph);\n"
              "  value->references = 0u;\n"
              "  if (value_pool_is_enabled() && value_pool_put(value)) return;\n"
              "  free(value);\n}\n\nstatic DataBindValue *dbv_int(",
              "value free epilogue")

          c = replace_once(
              c,
              "DataBindStatus data_bind_value_clone(const DataBindValue *value, DataBindValue **out_value) {\n"
              "  return dbv_clone_tree(value, 0u, out_value);\n"
              "}",
              "DataBindStatus data_bind_value_clone(const DataBindValue *value, DataBindValue **out_value) {\n"
              "  DataBindStatus status = dbv_clone_tree(value, 0u, out_value);\n"
              "  db_dynamic_graph_t *graph;\n"
              "  if (status != DATA_BIND_OK || value == NULL || out_value == NULL || *out_value == NULL ||\n"
              "      value->owned_graph == NULL)\n"
              "    return status;\n"
              "  graph = db_dynamic_graph_retain(value->owned_graph);\n"
              "  if (graph == NULL) {\n"
              "    data_bind_value_free(*out_value);\n"
              "    *out_value = NULL;\n"
              "    return DATA_BIND_ERR_LIMIT;\n"
              "  }\n"
              "  (*out_value)->owned_graph = graph;\n"
              "  (*out_value)->type_identity = &graph->root_identity;\n"
              "  return DATA_BIND_OK;\n"
              "}",
              "clone graph retain")

          c = replace_once(
              c,
              "DataBindValueKind data_bind_value_kind(const DataBindValue *value) {\n"
              "  return value != NULL ? value->kind : DATA_BIND_VALUE_NULL;\n"
              "}\n\n",
              "DataBindValueKind data_bind_value_kind(const DataBindValue *value) {\n"
              "  return value != NULL ? value->kind : DATA_BIND_VALUE_NULL;\n"
              "}\n\n"
              "const cmeta_type_identity *data_bind_value_type_identity(const DataBindValue *value) {\n"
              "  return value != NULL ? value->type_identity : NULL;\n"
              "}\n\n",
              "public identity query")

          # Rename the production JSON entry point, then wrap it with the root-owned
          # identity attach. Brace matching keeps this independent of the function body.
          signature = "DataBindStatus data_bind_parse_json(DataBind *codec, const char *type_name, const char *json,"
          start = c.find(signature)
          if start < 0:
              raise SystemExit("data_bind_parse_json definition not found")
          c = c[:start] + c[start:].replace(
              "DataBindStatus data_bind_parse_json(",
              "static DataBindStatus data_bind_parse_json_without_dynamic_identity(", 1)
          brace = c.find('{', start)
          if brace < 0:
              raise SystemExit("data_bind_parse_json body not found")
          depth = 0
          quote = None
          escape = False
          i = brace
          end = None
          while i < len(c):
              ch = c[i]
              if quote is not None:
                  if escape:
                      escape = False
                  elif ch == '\\':
                      escape = True
                  elif ch == quote:
                      quote = None
              else:
                  if ch in ('\"', "'"):
                      quote = ch
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              i += 1
          if end is None:
              raise SystemExit("data_bind_parse_json closing brace not found")

          wrapper = r'''

DataBindStatus data_bind_parse_json(DataBind *codec, const char *type_name, const char *json,
                                    size_t len, DataBindValue **out_value, DataBindError *error) {
  DataBindStatus status = data_bind_parse_json_without_dynamic_identity(
      codec, type_name, json, len, out_value, error);
  if (status != DATA_BIND_OK || out_value == NULL || *out_value == NULL) return status;
  if (!db_dynamic_attach_root(codec, type_name, *out_value)) {
    data_bind_value_free(*out_value);
    *out_value = NULL;
    return db_error_set(error, DATA_BIND_ERR_OOM, "json", -1, -1,
                        "Out of memory building dynamic CMeta identity");
  }
  return DATA_BIND_OK;
}
'''
          c = c[:end] + wrapper + c[end:]
          c_path.write_text(c)

          h_path = Path("tbe/data_bind/data_bind.h")
          h = h_path.read_text()
          h = replace_once(
              h,
              "DATA_BIND_API DataBindValueKind data_bind_value_kind(const DataBindValue *value);",
              "DATA_BIND_API DataBindValueKind data_bind_value_kind(const DataBindValue *value);\n\n"
              "/** Borrowed canonical CMeta semantic identity owned by the value root. */\n"
              "DATA_BIND_API const cmeta_type_identity *\n"
              "data_bind_value_type_identity(const DataBindValue *value);",
              "public header identity query")
          h_path.write_text(h)

          t_path = Path("tbe/data_bind/test_data_bind_cmeta.c")
          t = t_path.read_text()
          red_decl = "/* Test-only declaration for the RED checkpoint. Production does not provide\n * this public API yet, so the test binary must fail to link until Task 1 GREEN. */\nextern const cmeta_type_identity *\ndata_bind_value_type_identity(const DataBindValue *value);\n\n"
          t = replace_once(t, red_decl, "", "remove RED-only extern")
          t_path.write_text(t)
          PY
      - name: Check patch
        run: git diff --check
      - name: Commit edited sources
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tbe/data_bind/data_bind.c tbe/data_bind/data_bind.h tbe/data_bind/test_data_bind_cmeta.c
          git diff --cached --stat
          git commit -m "refactor(databind): add root dynamic identity seam"
          git push origin HEAD:automation/task1-green-edit
