name: Task 1 green editor

on:
  push:
    branches:
      - automation/task1-green-edit

permissions:
  contents: write

jobs:
  edit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/task1-green-edit
      - name: Apply focused Task 1 identity seam
        run: python3 .github/task1_green_editor.py
      - name: Check patch
        run: git diff --check
      - name: Commit edited sources
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tbe/data_bind/data_bind.c tbe/data_bind/data_bind.h tbe/data_bind/test_data_bind_cmeta.c
          git diff --cached --stat
          git commit -m "refactor(databind): add root dynamic identity seam"
          git push origin HEAD:automation/task1-green-edit
