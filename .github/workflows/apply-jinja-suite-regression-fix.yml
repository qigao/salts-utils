name: Apply guarded Jinja suite regression fix

on:
  push:
    branches: [fix/ci-re2c-4.6]
    paths: ['.github/workflows/apply-jinja-suite-regression-fix.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-re2c-4.6
          fetch-depth: 0
      - name: Apply exact Jinja regressions and remove this workflow
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git hash-object jinja/src/jinja_cmeta_provider.c)" = 629e365d380fda8b8c2133a5e117c04dccbf9c65
          test "$(git hash-object jinja/test/test_jinja_cmeta_predicates.c)" = 10b06f44168ad4e22d1f58505f9f9fc695b1c2a3
          test "$(git hash-object jinja/test/test_jinja_cmeta_templates.c)" = 11aaec61fc08fd53073d7f53a066ab47a47caad6
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, before, after, label):
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              return text.replace(before, after, 1)

          provider_path = Path('jinja/src/jinja_cmeta_provider.c')
          provider = provider_path.read_text()

          sort_start = provider.index('static JINJA_CMETA_STATUS jinja_sort_value(')
          sort_end = provider.index('\nstatic JINJA_CMETA_STATUS jinja_dictsort_value(', sort_start)
          sort_block = provider[sort_start:sort_end]
          sort_block = replace_once(sort_block,
              '  JINJA_CMETA_VALUE *parts, list;\n',
              '  JINJA_CMETA_VALUE *parts = NULL, list;\n', 'sort parts init')
          expected_status_returns = sort_block.count('if (status != JINJA_CMETA_OK) return status;')
          if expected_status_returns != 7:
              raise SystemExit(f'sort cleanup guards: expected 7 returns, found {expected_status_returns}')
          sort_block = sort_block.replace('if (status != JINJA_CMETA_OK) return status;',
                                          'if (status != JINJA_CMETA_OK) goto cleanup;')
          sort_block = replace_once(sort_block,
              '  if (list.collection_item_count == 0u) {\n    *result = list;\n    return JINJA_CMETA_OK;\n  }\n',
              '  if (list.collection_item_count == 0u) {\n    *result = list;\n    goto cleanup;\n  }\n', 'sort empty')
          sort_block = replace_once(sort_block,
              '  if (list.collection_item_count >\n      (provider->shared.values.limit - provider->shared.collection_value_count) / slots_per_item)\n    return JINJA_CMETA_ERR_CAPACITY;\n',
              '  if (list.collection_item_count >\n      (provider->shared.values.limit - provider->shared.collection_value_count) / slots_per_item) {\n    status = JINJA_CMETA_ERR_CAPACITY;\n    goto cleanup;\n  }\n', 'sort capacity')
          sort_block = replace_once(sort_block,
              '  *result = (JINJA_CMETA_VALUE){.kind = JINJA_CMETA_VALUE_LIST,\n      .collection_item_count = list.collection_item_count, .collection_values = sorted};\n  return JINJA_CMETA_OK;\n}\n',
              '  *result = (JINJA_CMETA_VALUE){.kind = JINJA_CMETA_VALUE_LIST,\n      .collection_item_count = list.collection_item_count, .collection_values = sorted};\ncleanup:\n  jinja_cmeta_memory_drop(parts);\n  return status;\n}\n', 'sort cleanup')
          provider = provider[:sort_start] + sort_block + provider[sort_end:]

          json_start = provider.index('static JINJA_CMETA_STATUS jinja_json_dict(')
          json_end = provider.index('\nstatic JINJA_CMETA_STATUS jinja_json_struct(', json_start)
          json_block = provider[json_start:json_end]
          json_block = replace_once(json_block,
              '  if (status != JINJA_CMETA_OK) return status;\n  if (used != count) return JINJA_CMETA_ERR_RENDER;\n',
              '  if (status != JINJA_CMETA_OK) goto cleanup;\n  if (used != count) {\n    status = JINJA_CMETA_ERR_RENDER;\n    goto cleanup;\n  }\n', 'json fill cleanup')
          json_block = replace_once(json_block,
              '    if (status != JINJA_CMETA_OK) return status;\n',
              '    if (status != JINJA_CMETA_OK) goto cleanup;\n', 'json sort cleanup')
          json_block = replace_once(json_block,
              '  if (status == JINJA_CMETA_OK) status = jinja_json_write(provider, "}", 1u);\n  return status;\n}\n',
              '  if (status == JINJA_CMETA_OK) status = jinja_json_write(provider, "}", 1u);\ncleanup:\n  jinja_cmeta_memory_drop(entries);\n  return status;\n}\n', 'json final cleanup')
          provider = provider[:json_start] + json_block + provider[json_end:]
          provider_path.write_text(provider)

          predicates_path = Path('jinja/test/test_jinja_cmeta_predicates.c')
          predicates = predicates_path.read_text()
          predicates = replace_once(predicates,
              '    check_equal(output, "False|True|False|False|False");\n',
              '    check_equal(output, "True|True|False|False|False");\n',
              'builtin filter query expectation')
          predicates_path.write_text(predicates)

          templates_path = Path('jinja/test/test_jinja_cmeta_templates.c')
          templates = templates_path.read_text()
          templates = replace_once(templates,
              '    check_null(templ);\n    check_equal(error.status, JINJA_CMETA_ERR_UNSUPPORTED);\n\n    error = (JINJA_CMETA_ERROR)JINJA_CMETA_ERROR_INIT;\n    templ = jinja_cmeta_compile(vstr_from_cstr("{{ user.name | safe | unknown_filter }}"), NULL, &error);\n',
              '    check_not_null(templ);\n    check_equal(error.status, JINJA_CMETA_OK);\n    jinja_cmeta_release(templ);\n\n    error = (JINJA_CMETA_ERROR)JINJA_CMETA_ERROR_INIT;\n    templ = jinja_cmeta_compile(vstr_from_cstr("{{ user.name | safe | unknown_filter }}"), NULL, &error);\n',
              'supported upper filter expectation')
          templates_path.write_text(templates)
          PY
          rm .github/workflows/apply-jinja-suite-regression-fix.yml
          git diff --check
          test "$(git hash-object jinja/test/test_jinja_cmeta_filters.c)" = 9950e93c146194e7a86b34b46420857d7991431d
          git status --short
          git config user.name 'Qi Gao'
          git config user.email 'qi.gao2012@gmail.com'
          git add jinja/src/jinja_cmeta_provider.c jinja/test/test_jinja_cmeta_predicates.c jinja/test/test_jinja_cmeta_templates.c .github/workflows/apply-jinja-suite-regression-fix.yml
          git commit -m 'fix(jinja): close remaining suite regressions'
          git push origin HEAD:fix/ci-re2c-4.6
