name: Run compiled SaltsUtils tests
on:
  workflow_call:
    inputs:
      tests:
        type: string
        required: true
permissions:
  contents: read
  packages: read
jobs:
  test:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.tests) }}
    env:
      QIGAO_SDK_RID: ${{ matrix.rid }}
      QIGAO_TARGET_TRIPLET: ${{ matrix.triplet }}
      QIGAO_HOST_TRIPLET: ${{ matrix.host_triplet }}
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 512M
      CCACHE_COMPILERCHECK: content
      SALTS_UTILS_COMPILER_CACHE_NAMESPACE: salts-utils-ccache-v1-${{ matrix.runner }}-${{ matrix.host }}-${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@fafb1efe5ac2440bfd7a08e493988d0459d89e51
        with:
          mode: read
      - uses: ./.github/actions/restore-native-build
        with:
          artifact: native-${{ matrix.id }}
          build-dir: ${{ matrix.build_dir }}
      - uses: ./.github/actions/setup-build-host
      - name: Run complete Unix CTest graph
        if: matrix.family != 'windows'
        shell: bash
        run: ctest --preset '${{ matrix.preset }}' --no-tests=error --output-on-failure --timeout 180 --parallel 2
      - name: Qualify relocated installed DataBind MethodPlan C11 consumer
        if: matrix.id == 'linux-release'
        shell: bash
        env:
          NATIVE_BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          set -euo pipefail
          # This test uses the exact archived native build; the library is
          # reinstalled into an isolated SDK prefix and consumed externally.
          prefix="$RUNNER_TEMP/databind-method-plan-installed-sdk"
          cmake --install "$NATIVE_BUILD_DIR" --prefix "$prefix"
          test -f "$prefix/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -f "$prefix/lib/libdata_bind.so"
          test -x "$prefix/bin/salts-idlc"
          export SALTS_UTILS_ROOT="$prefix"
          export VCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"
          export LD_LIBRARY_PATH="$prefix/lib:$SALTS_ROOT/lib:$VCPKG_INSTALLED_DIR/$QIGAO_TARGET_TRIPLET/lib:${LD_LIBRARY_PATH:-}"
          consumer="$GITHUB_WORKSPACE/databind/compiler/package_config/databind_target"
          build="$RUNNER_TEMP/databind-method-plan-installed-consumer"
          cmake --preset ci-native-release-user -S "$consumer" -B "$build" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DCMAKE_PREFIX_PATH="$VCPKG_INSTALLED_DIR/$QIGAO_TARGET_TRIPLET" \
            -DSaltsUtils_IDLC_EXECUTABLE="$prefix/bin/salts-idlc"
          cmake --build "$build" --target installed_service_consumer --parallel 2
          ctest --test-dir "$build" -R '^installed_service_consumer$' \
            --no-tests=error --output-on-failure --timeout 180
      - name: Run complete Windows CTest graph
        if: matrix.family == 'windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          ctest --preset "${{ matrix.preset }}" --no-tests=error --output-on-failure --timeout 180 --parallel 2
          if errorlevel 1 exit /b 1
      # No source scans: the opt-in IDL adapter must actually execute.
      - name: Qualify static Component IDL (Unix)
        if: ${{ github.head_ref == 'feature/component-idl-static-adapter' && matrix.family != 'windows' }}
        shell: bash
        run: |
          set -euo pipefail
          ctest --preset '${{ matrix.preset }}' --no-tests=error --output-on-failure --timeout 120 -R '^component_idl_candidate_'
      - name: Qualify static Component IDL (Windows)
        if: ${{ github.head_ref == 'feature/component-idl-static-adapter' && matrix.family == 'windows' }}
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          ctest --preset "${{ matrix.preset }}" --no-tests=error --output-on-failure --timeout 120 -R "^component_idl_candidate_"
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctest-${{ matrix.id }}
          path: ${{ matrix.build_dir }}/Testing/Temporary
          if-no-files-found: warn
