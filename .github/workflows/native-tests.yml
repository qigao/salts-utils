name: Run compiled SaltsUtils tests
on:
  workflow_call:
    inputs:
      tests:
        type: string
        required: true
permissions:
  contents: read
  packages: read
jobs:
  test:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.tests) }}
    env:
      QIGAO_SDK_RID: ${{ matrix.rid }}
      QIGAO_TARGET_TRIPLET: ${{ matrix.triplet }}
      QIGAO_HOST_TRIPLET: ${{ matrix.host_triplet }}
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 512M
      CCACHE_NODIRECT: 'true'
      SALTS_UTILS_COMPILER_CACHE_NAMESPACE: salts-utils-ccache-v1-${{ matrix.runner }}-${{ matrix.host }}-${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@fafb1efe5ac2440bfd7a08e493988d0459d89e51
        with:
          mode: read
      - uses: ./.github/actions/restore-native-build
        with:
          artifact: native-${{ matrix.id }}
          build-dir: ${{ matrix.build_dir }}
      - uses: ./.github/actions/setup-build-host
      - name: Run complete Unix CTest graph
        if: matrix.family != 'windows'
        shell: bash
        run: ctest --preset '${{ matrix.preset }}' --no-tests=error --output-on-failure --timeout 180 --parallel 2
      - name: Run complete Windows CTest graph
        if: matrix.family == 'windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          ctest --preset "${{ matrix.preset }}" --no-tests=error --output-on-failure --timeout 180 --parallel 2
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctest-${{ matrix.id }}
          path: ${{ matrix.build_dir }}/Testing/Temporary
          if-no-files-found: warn
      - name: Report ccache compiler statistics
        if: always()
        shell: pwsh
        run: |
          $ccache = Get-Command ccache -ErrorAction SilentlyContinue
          if ($ccache) { & $ccache.Source --show-stats }
