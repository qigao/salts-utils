name: Run compiled SaltsUtils tests
on:
  workflow_call:
    inputs:
      tests:
        type: string
        required: true
permissions:
  contents: read
  packages: read
  actions: read
jobs:
  test:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.tests) }}
    env:
      QIGAO_SDK_RID: ${{ matrix.rid }}
      QIGAO_TARGET_TRIPLET: ${{ matrix.triplet }}
      QIGAO_HOST_TRIPLET: ${{ matrix.host_triplet }}
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 512M
      CCACHE_COMPILERCHECK: content
      SALTS_UTILS_COMPILER_CACHE_NAMESPACE: salts-utils-ccache-v1-${{ matrix.runner }}-${{ matrix.host }}-${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Windows LLVM-MinGW runtime toolchain
        if: matrix.family == 'windows'
        uses: qigao/vcpkg-cache/.github/actions/setup-llvm-mingw@529019437597fa71f7d8dcc561d26fc7b0603ae6
        with:
          target: x64
          version: '20261020'
          build-type: toolchain-only
          obfuscator: 'false'
      - uses: ./.github/actions/setup-native-ci
        with:
          re2c: 'false'
      - uses: ./.github/actions/restore-native-build
        with:
          artifact: native-${{ matrix.id }}
          build-dir: ${{ matrix.build_dir }}
      - uses: ./.github/actions/setup-build-host
      # These Python libraries are independent test references, never runtime
      # parsers or fallback implementations.
      - name: Install Markdown parser strict reference oracles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          $target = Join-Path $env:RUNNER_TEMP 'salts-markdown-oracle-py'
          & $python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --target $target -r parser/markdown/tests/oracle-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $separator = [System.IO.Path]::PathSeparator
          $pythonPath = if ([string]::IsNullOrEmpty($env:PYTHONPATH)) { $target } else { "$target$separator$env:PYTHONPATH" }
          "PYTHONPATH=$pythonPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run complete Unix CTest graph
        if: matrix.family != 'windows'
        shell: bash
        run: ctest --preset '${{ matrix.preset }}' --no-tests=error --output-on-failure --timeout 180 --parallel 2
      - name: Run complete Windows CTest graph
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ctest --preset '${{ matrix.preset }}' --no-tests=error --output-on-failure --timeout 180 --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctest-${{ matrix.id }}
          path: ${{ matrix.build_dir }}/Testing/Temporary
          if-no-files-found: warn
