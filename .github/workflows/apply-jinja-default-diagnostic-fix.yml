name: Apply guarded Jinja diagnostic fix

on:
  push:
    branches: [fix/ci-re2c-4.6]
    paths: ['.github/workflows/apply-jinja-default-diagnostic-fix.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-re2c-4.6
          fetch-depth: 0
      - name: Apply exact source diagnostic patch and remove this workflow
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git hash-object jinja/src/jinja_cmeta.c)" = 49765850d56572d4d2179bd7b9c6dc56395aa585
          test "$(git hash-object jinja/src/jinja_cmeta_internal.h)" = 05eb17d8d925e2009e679d445f5856cebc36b7ff
          python3 - <<'PY'
          from pathlib import Path

          path = Path('jinja/src/jinja_cmeta.c')
          source = path.read_text()
          replacements = [
              (
                  'typedef struct JINJA_EXPRESSION_BUILDER {\n'
                  '  vstr newline_sequence;\n'
                  '  JINJA_CMETA_EXPRESSION_NODE nodes[JINJA_CMETA_MAX_COMPILED_EXPRESSIONS];\n',
                  'typedef struct JINJA_EXPRESSION_BUILDER {\n'
                  '  vstr newline_sequence;\n'
                  '  JINJA_CMETA_EXPRESSION_NODE nodes[JINJA_CMETA_MAX_COMPILED_EXPRESSIONS];\n'
                  '  size_t source_offsets[JINJA_CMETA_MAX_COMPILED_EXPRESSIONS];\n'
              ),
              (
                  '  builder->nodes[index] = (JINJA_CMETA_EXPRESSION_NODE){0};\n'
                  '  builder->nodes[index].kind = kind;\n',
                  '  builder->nodes[index] = (JINJA_CMETA_EXPRESSION_NODE){0};\n'
                  '  builder->nodes[index].kind = kind;\n'
                  '  builder->source_offsets[index] = 0u;\n'
              ),
              (
                  '  size_t offset = 0u;\n'
                  '  vstr name, input = vstr_from_buf(source.data + span.offset, span.length);\n',
                  '  const size_t first_expression = expressions->count;\n'
                  '  size_t offset = 0u;\n'
                  '  vstr name, input = vstr_from_buf(source.data + span.offset, span.length);\n'
              ),
              (
                  '  if (status == JINJA_CMETA_OK) *result = expressions->count - 1u;\n'
                  '  else jinja_cmeta_error_set(error, status, span.offset + offset, "unable to lower function expression");\n',
                  '  if (status == JINJA_CMETA_OK) {\n'
                  '    for (size_t i = first_expression; i < expressions->count; ++i)\n'
                  '      expressions->source_offsets[i] = span.offset;\n'
                  '    *result = expressions->count - 1u;\n'
                  '  } else {\n'
                  '    jinja_cmeta_error_set(error, status, span.offset + offset, "unable to lower function expression");\n'
                  '  }\n'
              ),
              (
                  'static JINJA_CMETA_STATUS jinja_validate_registered_extensions(\n'
                  '    const JINJA_CMETA_TEMPLATE *templ, const JINJA_CMETA_ENV *env, JINJA_CMETA_ERROR *error) {\n',
                  'static JINJA_CMETA_STATUS jinja_validate_registered_extensions(\n'
                  '    const JINJA_CMETA_TEMPLATE *templ, const JINJA_CMETA_ENV *env,\n'
                  '    const size_t source_offsets[JINJA_CMETA_MAX_COMPILED_EXPRESSIONS],\n'
                  '    JINJA_CMETA_ERROR *error) {\n'
              ),
              (
                  '      jinja_cmeta_error_set(error, JINJA_CMETA_ERR_UNSUPPORTED, 0u,\n'
                  '          "filter is not registered in the template environment");\n',
                  '      jinja_cmeta_error_set(error, JINJA_CMETA_ERR_UNSUPPORTED, source_offsets[i],\n'
                  '          "filter is not registered in the template environment");\n'
              ),
              (
                  '      jinja_cmeta_error_set(error, JINJA_CMETA_ERR_UNSUPPORTED, 0u,\n'
                  '          "test is not registered in the template environment");\n',
                  '      jinja_cmeta_error_set(error, JINJA_CMETA_ERR_UNSUPPORTED, source_offsets[i],\n'
                  '          "test is not registered in the template environment");\n'
              ),
              (
                  '  if (jinja_validate_registered_extensions(templ, env, error) != JINJA_CMETA_OK) {\n',
                  '  if (jinja_validate_registered_extensions(templ, env, expressions.source_offsets, error) != JINJA_CMETA_OK) {\n'
              ),
          ]
          for before, after in replacements:
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f'guard failed: expected one occurrence, found {count}: {before[:80]!r}')
              source = source.replace(before, after, 1)
          path.write_text(source)
          PY
          rm .github/workflows/apply-jinja-default-diagnostic-fix.yml
          git diff --check
          test "$(git hash-object jinja/src/jinja_cmeta_internal.h)" = 05eb17d8d925e2009e679d445f5856cebc36b7ff
          git status --short
          git config user.name 'Qi Gao'
          git config user.email 'qi.gao2012@gmail.com'
          git add jinja/src/jinja_cmeta.c .github/workflows/apply-jinja-default-diagnostic-fix.yml
          git commit -m 'fix(jinja): retain default-expression diagnostic source offset'
          git push origin HEAD:fix/ci-re2c-4.6
