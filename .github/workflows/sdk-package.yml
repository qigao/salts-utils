name: Prepare SaltsUtils release package
'on':
  workflow_call:
    inputs:
      version:
        type: string
        required: true
permissions:
  contents: read
  packages: read
  actions: read
jobs:
  pack:
    name: Pack SaltsUtils.Native
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Download qualified SDK artifacts with curl
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        python3 cmake/ci/github_files.py artifacts --pattern 'salts-utils-sdk-*' \
          --commit "$SOURCE_COMMIT" --destination package/sdk
    - name: Verify package payload
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::Package payload check failed at line $LINENO: $BASH_COMMAND"' ERR
        test -f package/sdk/linux-x64/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake
        test -f package/sdk/linux-x64/lib/cmake/SaltsUtils/IDL.cmake
        test -f package/sdk/linux-x64/include/data_bind_binding_plan.h
        test -f package/sdk/linux-x64/include/data_bind_cmeta_adapter_plan.h
        test -f package/sdk/linux-arm64/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake
        test -f package/sdk/linux-arm64/lib/cmake/SaltsUtils/IDL.cmake
        test -f package/sdk/linux-arm64/include/data_bind_binding_plan.h
        test -f package/sdk/linux-arm64/include/data_bind_projection_plan.h
        test -f package/sdk/linux-arm64/include/data_bind_native.h
        test -f package/sdk/linux-arm64/include/data_bind_native_binding.h
        test -f package/sdk/linux-arm64/include/data_bind_cmeta_adapter_plan.h
        test -f package/sdk/linux-arm64/include/data_bind_plugin_catalog.h
        test -f package/sdk/linux-arm64/include/data_bind_plugin_execution.h
        test -f package/sdk/linux-arm64/bin/salts-idlc
        test -f package/sdk/windows-x64/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake
        test -f package/sdk/windows-x64/lib/cmake/SaltsUtils/IDL.cmake
        test -f package/sdk/windows-x64/include/data_bind_binding_plan.h
        test -f package/sdk/windows-x64/include/data_bind_cmeta_adapter_plan.h
        test -f package/sdk/android-arm64/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake
        test -f package/sdk/android-arm64/include/data_bind_binding_plan.h
        test -f package/sdk/android-arm64/include/data_bind_cmeta_adapter_plan.h
        test "$(find package/sdk -maxdepth 2 -name salts-utils-sdk-manifest.txt | wc -l)" -eq 5
    - name: Create native package offline
      shell: bash
      env:
        PACKAGE_VERSION: ${{ inputs.version }}
        SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        nupkg="dist/SaltsUtils.Native.$PACKAGE_VERSION.nupkg"
        python3 cmake/ci/pack_native_sdk.py --root package --output "$nupkg" \
          --version "$PACKAGE_VERSION" --commit "$SOURCE_COMMIT"
        test -f "$nupkg"
        python3 - "$nupkg" <<'PY'
        import sys, zipfile
        package = sys.argv[1]
        required = (
            "sdk/linux-x64/bin/salts-idlc",
            "sdk/linux-arm64/bin/salts-idlc",
            "sdk/macos-arm64/bin/salts-idlc",
        )
        with zipfile.ZipFile(package) as archive:
            for name in required:
                info = archive.getinfo(name)
                mode = (info.external_attr >> 16) & 0o7777
                if mode & 0o111 != 0o111:
                    raise SystemExit(f"{name}: packaged mode is {oct(mode)}, expected executable")
        PY
        extracted="$RUNNER_TEMP/salts-utils-packed"
        rm -rf "$extracted"
        mkdir -p "$extracted"
        unzip -q "$nupkg" -d "$extracted"
        test -x "$extracted/sdk/linux-x64/bin/salts-idlc"
        test -x "$extracted/sdk/linux-arm64/bin/salts-idlc"
        test -x "$extracted/sdk/macos-arm64/bin/salts-idlc"
        unzip -p "$nupkg" '*.nuspec' > "$RUNNER_TEMP/salts-utils.nuspec"
        if grep -q '<dependencies' "$RUNNER_TEMP/salts-utils.nuspec"; then
          echo "SaltsUtils.Native must not publish dependency metadata" >&2
          cat "$RUNNER_TEMP/salts-utils.nuspec" >&2
          exit 1
        fi
        unzip -Z1 "$nupkg" | sort | tee "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/linux-x64/bin/salts-idlc" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/windows-x64/bin/salts-idlc.exe" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/linux-x64/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/linux-x64/lib/cmake/SaltsUtils/IDL.cmake" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/linux-x64/include/data_bind_binding_plan.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/linux-x64/include/data_bind_native.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/linux-x64/include/data_bind_native_binding.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/linux-x64/include/data_bind_cmeta_adapter_plan.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/linux-x64/include/data_bind_plugin_catalog.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/linux-arm64/bin/salts-idlc" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/linux-arm64/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/linux-arm64/lib/cmake/SaltsUtils/IDL.cmake" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/linux-arm64/include/data_bind_binding_plan.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/linux-arm64/include/data_bind_projection_plan.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/linux-arm64/include/data_bind_native.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/linux-arm64/include/data_bind_native_binding.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/linux-arm64/include/data_bind_cmeta_adapter_plan.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/linux-arm64/include/data_bind_plugin_catalog.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/linux-arm64/include/data_bind_plugin_execution.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/windows-x64/include/data_bind_binding_plan.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/windows-x64/include/data_bind_native.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/windows-x64/include/data_bind_cmeta_adapter_plan.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/windows-x64/include/data_bind_plugin_catalog.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/android-arm64/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/android-arm64/include/data_bind_binding_plan.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/android-arm64/include/data_bind_native.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/android-arm64/include/data_bind_cmeta_adapter_plan.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/android-arm64/include/data_bind_plugin_catalog.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        mac_rid=macos-arm64
        grep -Fx "sdk/$mac_rid/bin/salts-idlc" "$RUNNER_TEMP/salts-utils-nupkg.txt"
        grep -Fx "sdk/$mac_rid/include/data_bind_plugin_catalog.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
    - uses: actions/upload-artifact@v4
      with:
        name: salts-utils-native-nuget
        path: dist/*.nupkg
        if-no-files-found: error
        retention-days: 14
    timeout-minutes: 20
