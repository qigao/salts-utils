name: Unicode grapheme boundary conformance

on:
  push:
    branches:
      - feature/unicode-grapheme-boundaries
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: salts-utils-unicode-grapheme-${{ github.ref_name }}
  cancel-in-progress: true

env:
  VCPKG_SHA: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01

jobs:
  grapheme-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact SaltsUtils head
        uses: actions/checkout@v4

      - name: Checkout vcpkg at manifest baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
          path: vcpkg
          fetch-depth: 0
          persist-credentials: false

      - name: Restore vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: unicode-grapheme-vcpkg-x64-linux-b1b19307-v1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Go for BoringSSL
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Prepare versioned SDK toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          sudo ln -sfn "$GITHUB_WORKSPACE/vcpkg" /opt/vcpkg

      - name: Restore Salts 1.1.0 and re2c 4.6.3
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-versioned-native-sdk.sh linux-x64 linux-x64

      - name: Expose versioned Salts SDK
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$SALTS_ROOT/lib/cmake/Salts/SaltsConfig.cmake"
          sudo mkdir -p /opt/salts
          sudo ln -sfn "$SALTS_ROOT" /opt/salts/debug

      - name: Build standalone host Lemon
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S tools/lemon -B build/host-lemon -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host-lemon --target lemon -j2

      - name: Configure exact SaltsUtils head
        shell: bash
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="${GITHUB_WORKSPACE}/build/host-lemon/lemon"

      - name: Verify deterministic Unicode 17 table generation
        shell: bash
        run: |
          set -euxo pipefail
          python3 unicode/tools/generate_grapheme_data.py \
            --grapheme-break unicode/data/17.0.0/GraphemeBreakProperty.txt \
            --emoji-data unicode/data/17.0.0/emoji-data.txt \
            --derived-core unicode/data/17.0.0/DerivedCoreProperties.txt \
            --output "${RUNNER_TEMP}/unicode_grapheme_data.h"
          cmp "${RUNNER_TEMP}/unicode_grapheme_data.h" unicode/src/unicode_grapheme_data.h

      - name: Build focused grapheme tests
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug \
            --target test_salts_unicode_grapheme test_salts_unicode_grapheme_conformance -j2

      - name: Run Unicode 17 grapheme tests
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug \
            -R '^test_salts_unicode_grapheme(_conformance)?$' --output-on-failure

      - name: Verify exact head
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
