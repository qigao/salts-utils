name: Parser ownership migration verification
# Final exact-head verification after CTest leak fix and diagnostic cleanup.

on:
  push:
    branches:
      - migration/move-parser-capabilities
    paths:
      - .github/workflows/parser-migration-verification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SALTS_CUTOVER_SHA: 801202e58c2d86b35202414d4812e79a2fd25bae
      OLD_SALTS_SHA: 7ca4981854276854974696600791cf0b017fcfa4
      ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=2:halt_on_error=1
    steps:
      - name: Checkout exact SaltsUtils head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify static ownership cutover
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test ! -e parser/uri_parser
          ! grep -R -n --include='CMakeLists.txt' 'EXPORT SaltsTargets' parser
          ! grep -R -n --include='CMakeLists.txt' 'add_subdirectory(uri_parser)' parser
          ! grep -R -n --include='CMakeLists.txt' 'uri_parser/include' parser
          grep -Fx 'add_subdirectory(parser)' CMakeLists.txt
          grep -Fx 'add_subdirectory(tools/junit_to_html)' CMakeLists.txt
          test -f tools/junit_to_html/junit_to_html.c
          test -f tools/junit_to_html/test/junit_to_html_test.cmake
          grep -n 'Salts::CmdParser Salts::XmlParser' tools/junit_to_html/CMakeLists.txt
          grep -R -n 'Salts::UriParser' parser CMakeLists.txt cmake/SaltsUtilsConfig.cmake.in
          if grep -R -n --exclude='parser-migration-verification.yml' "$OLD_SALTS_SHA" .github/workflows; then
            echo "old pre-migration Salts SHA remains in production workflow wiring" >&2
            exit 1
          fi
          git diff --check

      - name: Checkout exact Salts cutover
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: 801202e58c2d86b35202414d4812e79a2fd25bae
          path: salts
          persist-credentials: false

      - name: Verify exact Salts source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C salts rev-parse HEAD)" = "$SALTS_CUTOVER_SHA"
          test -d salts/uri
          test ! -e salts/parser
          test ! -e salts/tinytest/junit_to_html
          test ! -e salts/tinytest/test/junit_to_html_test.cmake
          grep -Fx 'add_subdirectory(uri)' salts/CMakeLists.txt
          grep -n 'ALIAS Salts::UriParser' salts/uri/CMakeLists.txt
          grep -n 'EXPORT SaltsTargets' salts/uri/CMakeLists.txt
          if grep -R -n --include='CMakeLists.txt' -E 'Salts::(CmdParser|XmlParser|QueryVM|JsonParser)' salts \
             --exclude-dir=docs --exclude-dir=book; then
            echo 'Salts still consumes a moved parser target' >&2
            exit 1
          fi

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
          path: vcpkg
          fetch-depth: 0
          persist-credentials: false

      - name: Restore vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: parser-migration-vcpkg-ubuntu24-b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01-${{ env.SALTS_CUTOVER_SHA }}-v1
          restore-keys: |
            parser-migration-vcpkg-ubuntu24-b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01-

      - name: Prepare toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm curl xz-utils
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          sudo mkdir -p /opt/salts
          sudo ln -sfn "$GITHUB_WORKSPACE/vcpkg" /opt/vcpkg
          bash cmake/ci/install-re2c.sh

      - name: Build and install exact Salts cutover
        shell: bash
        working-directory: salts
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF
          cmake --build build/linux-gcc-debug --target install -j2

      - name: Verify installed Salts owns only UriParser parser capability
        shell: bash
        run: |
          set -euxo pipefail
          package="$RUNNER_TEMP/salts-project/external/pkgs/salts/debug"
          targets="$package/lib/cmake/Salts/SaltsTargets.cmake"
          test -f "$targets"
          grep -n 'UriParser' "$targets"
          for moved in QueryVM IniParser JsonParser JsonCSerdeAdapter XmlParser CsvParser TLVParser LtvParser ModbusParser SoaParser DotEnvParser CmdParser Toon TomlParser DateTimeParser CYaml CYamlJsonAdapter Selector; do
            if grep -n "Salts::${moved}" "$targets"; then
              echo "installed Salts still exports moved target Salts::${moved}" >&2
              exit 1
            fi
          done
          sudo ln -sfn "$package" /opt/salts/debug

      - name: Build standalone host Lemon
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S tools/lemon -B build/host-lemon -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host-lemon --target lemon -j2

      - name: Configure SaltsUtils against exact cutover
        shell: bash
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="$GITHUB_WORKSPACE/build/host-lemon/lemon"

      - name: Build full SaltsUtils graph
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build --preset linux-dev-user -j2

      - name: Run full SaltsUtils CTest graph
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug --no-tests=error --output-on-failure

      - name: Install SaltsUtils and verify moved exports
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug --target install -j2
          targets=/opt/salts-utils/debug/lib/cmake/SaltsUtils/SaltsUtilsTargets.cmake
          test -f "$targets"
          for moved in QueryVM IniParser JsonParser JsonCSerdeAdapter XmlParser CsvParser TLVParser LtvParser ModbusParser SoaParser DotEnvParser CmdParser Toon TomlParser DateTimeParser CYaml CYamlJsonAdapter Selector; do
            grep -n -E "^add_library\\(Salts::${moved}[[:space:]]" "$targets"
          done
          if grep -n -E '^add_library\(Salts::UriParser[[:space:]]' "$targets"; then
            echo 'SaltsUtils must consume, not export, Salts::UriParser' >&2
            exit 1
          fi

      - name: Verify exact head and clean tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain --untracked-files=no)"
