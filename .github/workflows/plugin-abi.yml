name: Plugin ABI contract

on:
  pull_request:
    branches: [master]
    paths:
      - "plugin/**"
      - "CMakeLists.txt"
      - "cmake/SaltsUtilsConfig.cmake.in"
      - ".github/workflows/plugin-abi.yml"
  push:
    branches: [master]
    paths:
      - "plugin/**"
      - "CMakeLists.txt"
      - "cmake/SaltsUtilsConfig.cmake.in"
      - ".github/workflows/plugin-abi.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: salts-utils-plugin-abi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SALTS_SDK_VERSION: "1.3.0"
  RE2C_BINARY_VERSION: "4.6.3"

jobs:
  linux:
    name: Linux C11/C++17 contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Prepare native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          if [ -n "${VCPKG_ROOT:-}" ] &&
             [ -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            true
          elif [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] &&
               [ -f "$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            vcpkg_bin="$(readlink -f "$(command -v vcpkg)")"
            echo "VCPKG_ROOT=$(dirname "$vcpkg_bin")" >> "$GITHUB_ENV"
          fi

      - name: Restore published Salts 1.3.0 and re2c 4.6.3
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-versioned-native-sdk.sh linux-x64 linux-x64

      - name: Configure focused test build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/plugin-abi -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"             -DVCPKG_TARGET_TRIPLET=x64-linux             -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"             -DBUILD_TESTS=ON             -DBUILD_BENCHMARKS=OFF             -DBUILD_EXAMPLES=OFF             -DSALTS_UTILS_ENABLE_CAPTURE=OFF             -DENABLE_SANITIZER_ADDRESS=OFF             -DENABLE_SANITIZER_UNDEFINED=OFF

      - name: Build Plugin contract tests
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/plugin-abi             --target salts_plugin_contract_test salts_plugin_header_cpp_test             --parallel 2

      - name: Run Plugin contract tests
        shell: bash
        run: |
          set -euxo pipefail
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build/plugin-abi             -R '^salts_plugin_(contract|header_cpp)_test$'             --no-tests=error --output-on-failure

      - name: Verify exact head and clean tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

  windows:
    name: Windows C11/C++17 contract
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) {
            throw "workflow is not running the exact PR head"
          }

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Prepare native toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install nasm ninja -y --no-progress
          $vcpkgRoot = $env:VCPKG_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          }
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            throw "VCPKG_ROOT is unavailable"
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio x64 C++ toolchain not found"
          }
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_BINARY_SOURCES) -or $env:VCPKG_BINARY_SOURCES -notmatch "nugetconfig") {
            throw "Windows shared vcpkg NuGet cache is unavailable"
          }
          if ($env:VCPKG_NUGET_REPOSITORY -ne "https://github.com/qigao/vcpkg-cache") {
            throw "unexpected Windows vcpkg cache repository: $env:VCPKG_NUGET_REPOSITORY"
          }
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV

      - name: Restore published Salts 1.3.0 and re2c 4.6.3
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-versioned-native-sdk.ps1 -SaltsRid windows-x64 -Re2cRid windows-x64

      - name: Configure, build and run Plugin contract tests
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "PATH=%SALTS_ROOT%\bin;%GITHUB_WORKSPACE%\vcpkg_installed\x64-windows\bin;%PATH%"
          cmake -S . -B build\plugin-abi -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%\vcpkg_installed" -DVCPKG_INSTALL_OPTIONS=--only-binarycaching -DVCPKG_MANIFEST_FEATURES=capture -DSALTS_UTILS_ENABLE_CAPTURE=ON -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_UNDEFINED=OFF
          if errorlevel 1 exit /b 1
          cmake --build build\plugin-abi --target salts_plugin_contract_test salts_plugin_header_cpp_test --parallel 2
          if errorlevel 1 exit /b 1
          ctest --test-dir build\plugin-abi -R "^salts_plugin_(contract|header_cpp)_test$" --no-tests=error --output-on-failure
          if errorlevel 1 exit /b 1

      - name: Verify exact head and clean tracked source
        if: always()
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) {
            throw "workflow source changed"
          }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=no))) {
            throw "workflow modified tracked source"
          }
