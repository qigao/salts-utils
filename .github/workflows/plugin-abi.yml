name: Plugin ABI contract

on:
  pull_request:
    branches: [master]
    paths:
      - "plugin/**"
      - "databind/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "cmake/SaltsUtilsConfig.cmake.in"
      - "cmake/ci/vcpkg/plugin-databind/**"
      - "cmake/ci/verify-vcpkg-cache-only.ps1"
      - "cmake/ci/restore-versioned-native-sdk.sh"
      - "cmake/ci/restore-versioned-native-sdk.ps1"
      - ".github/workflows/plugin-abi.yml"
  push:
    branches: [master]
    paths:
      - "plugin/**"
      - "databind/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "cmake/SaltsUtilsConfig.cmake.in"
      - "cmake/ci/vcpkg/plugin-databind/**"
      - "cmake/ci/verify-vcpkg-cache-only.ps1"
      - "cmake/ci/restore-versioned-native-sdk.sh"
      - "cmake/ci/restore-versioned-native-sdk.ps1"
      - ".github/workflows/plugin-abi.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: salts-utils-plugin-abi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SALTS_SDK_VERSION: "1.5.0"
  RE2C_BINARY_VERSION: "4.6.3"

jobs:
  linux:
    name: Linux C11/C++17 + BindingPlan sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Prepare native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          test -n "${VCPKG_ROOT:-}"
          test -n "${VCPKG_BINARY_SOURCES:-}"
          case "$VCPKG_BINARY_SOURCES" in
            *nugetconfig*) ;;
            *) echo "shared vcpkg NuGet cache is not configured" >&2; exit 1 ;;
          esac
          test "${VCPKG_NUGET_REPOSITORY:-}" = "https://github.com/qigao/vcpkg-cache"

      - name: Restore published Salts 1.5.0 and re2c 4.6.3
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-versioned-native-sdk.sh linux-x64 linux-x64

      - name: Restore focused Plugin/DataBind vcpkg closure
        shell: bash
        run: |
          set -euxo pipefail
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$GITHUB_WORKSPACE/cmake/ci/vcpkg/plugin-databind" \
            --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed" \
            --triplet=x64-linux \
            --only-binarycaching

      - name: Configure focused ABI and BindingPlan build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/plugin-abi -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DSALTS_UTILS_ENABLE_CAPTURE=OFF \
            -DSALTS_UTILS_QUALIFY_PLUGIN_DATABIND=ON \
            -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_UNDEFINED=OFF

      - name: Build focused contracts
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/plugin-abi \
            --target salts_plugin_contract_test salts_plugin_header_cpp_test \
                     salts_plugin_loader_test \
                     test_databind_projection_registry \
                     test_databind_service_native_lowering \
                     test_databind_service_native_public_cpp \
                     test_databind_plugin_generated_dso \
                     test_databind_plugin_projection_rejection \
                     test_data_bind_binding_plan test_data_bind_native_writer \
                     test_data_bind_cmeta_public_cpp \
            --parallel 2

      - name: Run focused contracts
        shell: bash
        run: |
          set -euxo pipefail
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build/plugin-abi \
            -R '^(salts_plugin_(contract|header_cpp|loader)_test|test_databind_projection_registry|test_databind_service_native_lowering|test_databind_service_native_public_cpp|test_databind_plugin_generated_dso|test_databind_plugin_projection_rejection|test_data_bind_(binding_plan|native_writer|cmeta_public_cpp))
            --no-tests=error --output-on-failure

      - name: Configure sanitized BindingPlan build
        shell: bash
        run: |
          set -euxo pipefail
          host_lemon="$GITHUB_WORKSPACE/build/plugin-abi/bin/lemon"
          test -x "$host_lemon"
          cmake -S . -B build/binding-plan-sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="$host_lemon" \
            -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DSALTS_UTILS_ENABLE_CAPTURE=OFF \
            -DSALTS_UTILS_QUALIFY_PLUGIN_DATABIND=ON \
            -DENABLE_SANITIZER_ADDRESS=ON -DENABLE_SANITIZER_UNDEFINED=ON

      - name: Run sanitized BindingPlan contract
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euxo pipefail
          cmake --build build/binding-plan-sanitized \
            --target test_data_bind_binding_plan test_data_bind_native_writer --parallel 2
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build/binding-plan-sanitized \
            -R '^test_data_bind_(binding_plan|native_writer)$' \
            --no-tests=error --output-on-failure

      - name: Verify exact head and clean tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

  windows:
    name: Windows C11/C++17 contract
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) {
            throw "workflow is not running the exact PR head"
          }

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Prepare native toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install nasm ninja -y --no-progress
          $vcpkgRoot = $env:VCPKG_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          }
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            throw "VCPKG_ROOT is unavailable"
          }
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_BINARY_SOURCES) -or $env:VCPKG_BINARY_SOURCES -notmatch "nugetconfig") {
            throw "Windows shared vcpkg NuGet cache is unavailable"
          }
          if ($env:VCPKG_NUGET_REPOSITORY -ne "https://github.com/qigao/vcpkg-cache") {
            throw "unexpected Windows vcpkg cache repository: $env:VCPKG_NUGET_REPOSITORY"
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio x64 C++ toolchain not found"
          }
          "QIGAO_VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV

      - name: Restore published Salts 1.5.0 and re2c 4.6.3
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-versioned-native-sdk.ps1 -SaltsRid windows-x64 -Re2cRid windows-x64

      - name: Configure, build and run focused contracts
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          if errorlevel 1 exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\cmake\ci\verify-vcpkg-cache-only.ps1" -ManifestRoot "%GITHUB_WORKSPACE%\cmake\ci\vcpkg\plugin-databind"
          if errorlevel 1 exit /b 1
          "%QIGAO_VCPKG_ROOT%\vcpkg.exe" install --x-manifest-root="%GITHUB_WORKSPACE%\cmake\ci\vcpkg\plugin-databind" --x-install-root="%GITHUB_WORKSPACE%\vcpkg_installed" --triplet=x64-windows --only-binarycaching
          if errorlevel 1 exit /b 1
          set "PATH=%SALTS_ROOT%\bin;%GITHUB_WORKSPACE%\vcpkg_installed\x64-windows\bin;%PATH%"
          cmake -S . -B build\plugin-abi -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%\vcpkg_installed" -DVCPKG_MANIFEST_INSTALL=OFF -DSALTS_UTILS_ENABLE_CAPTURE=OFF -DSALTS_UTILS_QUALIFY_PLUGIN_DATABIND=ON -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_UNDEFINED=OFF
          if errorlevel 1 exit /b 1
          cmake --build build\plugin-abi --target salts_plugin_contract_test salts_plugin_header_cpp_test salts_plugin_loader_test test_databind_projection_registry test_databind_service_native_lowering test_databind_service_native_public_cpp test_databind_plugin_generated_dso test_databind_plugin_projection_rejection test_data_bind_binding_plan test_data_bind_native_writer test_data_bind_cmeta_public_cpp --parallel 2
          if errorlevel 1 exit /b 1
          ctest --test-dir build\plugin-abi -R "^(salts_plugin_(contract|header_cpp|loader)_test|test_databind_projection_registry|test_databind_service_native_lowering|test_databind_service_native_public_cpp|test_databind_plugin_generated_dso|test_databind_plugin_projection_rejection|test_data_bind_(binding_plan|native_writer|cmeta_public_cpp))$" --no-tests=error --output-on-failure
          if errorlevel 1 exit /b 1

      - name: Verify exact head and clean tracked source
        if: always()
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) {
            throw "workflow source changed"
          }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=no))) {
            throw "workflow modified tracked source"
          }
 \
            --no-tests=error --output-on-failure

      - name: Configure sanitized BindingPlan build
        shell: bash
        run: |
          set -euxo pipefail
          host_lemon="$GITHUB_WORKSPACE/build/plugin-abi/bin/lemon"
          test -x "$host_lemon"
          cmake -S . -B build/binding-plan-sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="$host_lemon" \
            -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DSALTS_UTILS_ENABLE_CAPTURE=OFF \
            -DSALTS_UTILS_QUALIFY_PLUGIN_DATABIND=ON \
            -DENABLE_SANITIZER_ADDRESS=ON -DENABLE_SANITIZER_UNDEFINED=ON

      - name: Run sanitized BindingPlan contract
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euxo pipefail
          cmake --build build/binding-plan-sanitized \
            --target test_data_bind_binding_plan test_data_bind_native_writer --parallel 2
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build/binding-plan-sanitized \
            -R '^test_data_bind_(binding_plan|native_writer)$' \
            --no-tests=error --output-on-failure

      - name: Verify exact head and clean tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

  windows:
    name: Windows C11/C++17 contract
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact source
