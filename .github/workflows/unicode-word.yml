name: Unicode word boundary conformance

on:
  pull_request:
    branches: [master]
    paths:
      - "unicode/**"
      - "cmake/**"
      - "CMake*.txt"
      - "CMake*Presets.json"
      - ".github/workflows/unicode-word.yml"
  push:
    branches: [master]
    paths:
      - "unicode/**"
      - "cmake/**"
      - "CMake*.txt"
      - "CMake*Presets.json"
      - ".github/workflows/unicode-word.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: salts-utils-unicode-word-${{ github.ref_name }}
  cancel-in-progress: true

env:
jobs:
  word-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact SaltsUtils head
        uses: actions/checkout@v4

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Checkout vcpkg at manifest baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
          path: vcpkg
          fetch-depth: 0
          persist-credentials: false


      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Go for BoringSSL
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Prepare versioned SDK toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          sudo ln -sfn "$VCPKG_ROOT" /opt/vcpkg

      - name: Restore Salts 1.2.0 and re2c 4.6.3
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-versioned-native-sdk.sh linux-x64 linux-x64

      - name: Expose versioned Salts SDK
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$SALTS_ROOT/lib/cmake/Salts/SaltsConfig.cmake"
          sudo mkdir -p /opt/salts
          sudo ln -sfn "$SALTS_ROOT" /opt/salts/debug

      - name: Build standalone host Lemon
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S tools/lemon -B build/host-lemon -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host-lemon --target lemon -j2

      - name: Configure exact SaltsUtils head
        shell: bash
        env:
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="${GITHUB_WORKSPACE}/build/host-lemon/lemon"

      - name: Verify deterministic Unicode 17 word table generation
        shell: bash
        run: |
          set -euxo pipefail
          python3 unicode/tools/generate_word_data.py \
            --word-break unicode/data/17.0.0/WordBreakProperty.txt \
            --emoji-data unicode/data/17.0.0/emoji-data.txt \
            --output "${RUNNER_TEMP}/unicode_word_data.h"
          cmp "${RUNNER_TEMP}/unicode_word_data.h" unicode/src/unicode_word_data.h

      - name: Build focused word-boundary tests
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug \
            --target test_salts_unicode_word test_salts_unicode_word_conformance -j2

      - name: Run Unicode 17 word-boundary tests
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug \
            -R '^test_salts_unicode_word(_conformance)?$' --output-on-failure

      - name: Verify exact head
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
