name: SaltsUtils native SDK release

on:
  pull_request:
    paths:
      - ".github/workflows/native-sdk-release.yml"
      - "cmake/ci/restore-native-sdk.sh"
      - "cmake/ci/restore-native-sdk.ps1"
      - "packaging/nuget/**"
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "crypto/**"
      - "cmake/SaltsUtilsConfig.cmake.in"
      - "databind/CMakeLists.txt"
      - "databind/producer/**"
      - "databind/idl/**"
      - "databind/formats/binary/**"
      - "databind/schema/**"
      - "databind/runtime/**"
      - "capture/**"
      - "parser/xml_parser/**"
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - ".github/workflows/native-sdk-release.yml"
      - "cmake/ci/restore-native-sdk.sh"
      - "cmake/ci/restore-native-sdk.ps1"
      - "packaging/nuget/**"
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "crypto/**"
      - "cmake/SaltsUtilsConfig.cmake.in"
      - "databind/CMakeLists.txt"
      - "databind/producer/**"
      - "databind/idl/**"
      - "databind/formats/binary/**"
      - "databind/schema/**"
      - "databind/runtime/**"
      - "capture/**"
      - "parser/xml_parser/**"

permissions:
  contents: read
  packages: read

concurrency:
  group: salts-utils-native-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      source_commit: ${{ steps.version.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{print $2; exit}' CMakeLists.txt)"
          test -n "$version"
          tag="v$version"
          source_commit="$(git rev-parse HEAD)"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME:-}" != "$tag" ]; then
              echo "release tag ${GITHUB_REF_NAME:-<unset>} does not match project version $tag" >&2
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            :
          else
            test "${GITHUB_REF_NAME:-}" = "master"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

  xml-parser:
    name: XML parser sanitizer contract
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare focused native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config
          test -n "${VCPKG_ROOT:-}"
          test -n "${VCPKG_BINARY_SOURCES:-}"

      - name: Restore latest published Salts SDK
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-native-sdk.sh linux-x64 linux-x64

      - name: Configure focused XML sanitizer build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/xml-sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DSALTS_UTILS_QUALIFY_XML=ON \
            -DSALTS_UTILS_ENABLE_CAPTURE=OFF \
            -DSALTS_UTILS_ENABLE_CFLOW_USB=OFF \
            -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZER_ADDRESS=ON \
            -DENABLE_SANITIZER_UNDEFINED=ON
          cmake --build build/xml-sanitize --target xml_parser_test xml_sax_parser_test --parallel 2

      - name: Run XML parser ASan UBSan and leak contract
        shell: bash
        run: |
          set -euxo pipefail
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ctest --test-dir build/xml-sanitize --no-tests=error -R 'xml_parser_test|xml_sax_parser_test' --output-on-failure
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain --untracked-files=no)"

  binding-plan:
    name: DataBind BindingPlan contract
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare focused native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm libpipewire-0.3-dev libx11-dev libxext-dev
          test -n "${VCPKG_ROOT:-}"
          test -n "${VCPKG_BINARY_SOURCES:-}"
          case "$VCPKG_BINARY_SOURCES" in
            *nugetconfig*) ;;
            *) echo "shared vcpkg NuGet cache is not configured" >&2; exit 1 ;;
          esac
          test "${VCPKG_NUGET_REPOSITORY:-}" = "https://github.com/qigao/vcpkg-cache"

      - name: Restore latest published native SDKs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-native-sdk.sh linux-x64 linux-x64

      - name: Configure focused BindingPlan test build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/binding-plan -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DSALTS_UTILS_ENABLE_CAPTURE=OFF \
            -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_UNDEFINED=OFF
          cmake --build build/binding-plan \
            --target test_data_bind_binding_plan test_data_bind_object_message_plan \
                     test_data_bind_projection_plan test_data_bind_record_exact \
                     test_data_bind_binary_reader test_data_bind_opaque_plan \
                     test_databind_binary_reader_codegen test_databind_binary_layout_ir \
                     test_databind_binary_var_data_transport test_databind_opaque_transport \
                     test_databind_opaque_service test_databind_method_plan_binary_admission \
                     test_databind_flowmq_plan_projection \
                     test_data_bind_service_native_error \
                     test_data_bind_native_reader test_data_bind_native_reader_cpp \
                     test_data_bind_native_writer test_data_bind_native_container \
                     test_data_bind_yaml_provider test_data_bind_xml_provider \
                     test_data_bind_cmeta_public_cpp \
                     test_databind_generated_owned_buffers \
                     test_databind_generated_sequence_public_cpp \
                     test_tbe_compiler_cmeta_fields \
                     test_data_bind_cmeta_adapter_plan \
                     test_databind_projection_frontend \
                     test_databind_service_native_lowering \
                     test_databind_native_service_public_artifact \
                     test_databind_native_service_public_artifact_cpp \
                     test_databind_message_native_artifact \
                     test_databind_plugin_projection_rejection \
            --parallel 2

      - name: Run canonical BindingPlan runtime contract
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/binding-plan --no-tests=error \
            -R '^(test_data_bind_binding_plan|test_data_bind_object_message_plan|test_data_bind_projection_plan|test_data_bind_record_exact|test_data_bind_binary_reader|test_data_bind_opaque_plan|test_databind_binary_reader_codegen|test_databind_binary_layout_ir|test_databind_binary_var_data_transport|test_databind_opaque_transport|test_databind_opaque_service|test_databind_method_plan_binary_admission|test_databind_flowmq_plan_projection|test_data_bind_service_native_error|test_data_bind_native_reader|test_data_bind_native_reader_cpp|test_data_bind_native_writer|test_data_bind_yaml_provider|test_data_bind_xml_provider|test_data_bind_cmeta_public_cpp|test_databind_generated_owned_buffers|test_databind_generated_sequence_public_cpp|test_tbe_compiler_cmeta_fields|test_data_bind_cmeta_adapter_plan|test_databind_projection_frontend|test_databind_service_native_lowering|test_databind_native_service_public_artifact|test_databind_native_service_public_artifact_cpp|test_databind_message_native_artifact|test_databind_plugin_projection_rejection|test_tbe_cmeta_cli_gates)$' \
            --output-on-failure
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Run generated sequence ASan and UBSan contract
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/binding-plan-sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DSALTS_UTILS_ENABLE_CAPTURE=OFF \
            -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZER_ADDRESS=ON \
            -DENABLE_SANITIZER_UNDEFINED=ON
          cmake --build build/binding-plan-sanitize \
            --target test_data_bind_binary_reader test_data_bind_opaque_plan \
                     test_data_bind_yaml_provider test_data_bind_xml_provider \
                     test_data_bind_service_native_error \
                     test_databind_message_native_artifact \
                     test_databind_generated_owned_buffers \
                     test_databind_generated_sequence_public_cpp \
            --parallel 2
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
          ctest --test-dir build/binding-plan-sanitize --no-tests=error \
            -R '^(test_data_bind_binary_reader|test_data_bind_opaque_plan|test_data_bind_yaml_provider|test_data_bind_xml_provider|test_data_bind_service_native_error|test_databind_message_native_artifact|test_databind_generated_owned_buffers|test_databind_generated_sequence_public_cpp)$' \
            --output-on-failure
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

  jinja-cmeta:
    name: Jinja CMeta/CSTL contract
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare focused native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          test -n "${VCPKG_ROOT:-}"
          test -n "${VCPKG_BINARY_SOURCES:-}"
          case "$VCPKG_BINARY_SOURCES" in
            *nugetconfig*) ;;
            *) echo "shared vcpkg NuGet cache is not configured" >&2; exit 1 ;;
          esac
          test "${VCPKG_NUGET_REPOSITORY:-}" = "https://github.com/qigao/vcpkg-cache"

      - name: Restore latest published native SDKs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-native-sdk.sh linux-x64 linux-x64

      - name: Configure focused Jinja CMeta build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/jinja-cmeta -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DSALTS_UTILS_ENABLE_CAPTURE=OFF \
            -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_UNDEFINED=OFF
          cmake --build build/jinja-cmeta \
            --target test_jinja_cmeta_cstl_collections \
                     test_jinja_cmeta_iterators \
                     test_jinja_cmeta_attributes \
                     test_jinja_cmeta_budgets \
                     test_jinja_cmeta_identity \
                     test_jinja_cmeta_templates \
                     test_jinja_cmeta_header_cpp \
                     test_jinja_runtime_header_cpp \
            --parallel 2

      - name: Run canonical Jinja CMeta/CSTL contract
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/jinja-cmeta --no-tests=error \
            -R '^(test_jinja_cmeta_(cstl_collections|iterators|attributes|budgets|identity|templates|header_cpp))$' \
            --output-on-failure
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain --untracked-files=no)"

  linux:
    name: Linux x64 SDK
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare native toolchain
        id: env
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm libpipewire-0.3-dev libx11-dev libxext-dev
          test -n "${VCPKG_ROOT:-}"
          test -x "$VCPKG_ROOT/vcpkg"
          test -n "${QIGAO_VCPKG_TOOLCHAIN_FILE:-}"
          test -f "$QIGAO_VCPKG_TOOLCHAIN_FILE"

      - name: Restore latest published native SDKs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-native-sdk.sh linux-x64 linux-x64 1
      - name: Configure and install SaltsUtils
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/linux-x64"
          cmake -S . -B build/native-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DVCPKG_MANIFEST_FEATURES=capture \
            -DSALTS_UTILS_ENABLE_CAPTURE=ON \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/native-sdk --parallel 2
          cmake --install build/native-sdk
          test -f "$prefix/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -f "$prefix/include/data_bind_binding_plan.h"
          test -f "$prefix/include/data_bind_projection_plan.h"
          test -f "$prefix/include/data_bind_native_binding.h"
          grep -q "DataBindNativeExecution" "$prefix/include/data_bind_native_binding.h"
          grep -q "DataBindMessageNativeArtifact" "$prefix/include/data_bind_native_binding.h"
          test -f "$prefix/include/data_bind_native.h"
          grep -q "DataBindNativePlan" "$prefix/include/data_bind_native.h"
          test -f "$prefix/include/data_bind_cmeta_adapter_plan.h"
          test -f "$prefix/include/data_bind_plugin_catalog.h"
          test -f "$prefix/include/data_bind_plugin_execution.h"
          cat > build/native-execution-installed.c <<'EOF'
          #include <data_bind_native_binding.h>
          _Static_assert(DATA_BIND_NATIVE_EXECUTION_ABI_VERSION == 1u,
                         "unexpected DataBind native execution ABI");
          int main(void) {
            DataBindNativeExecution execution = DATA_BIND_NATIVE_EXECUTION_INIT;
            return execution.size == sizeof(DataBindNativeExecution) &&
                           execution.abi_version == DATA_BIND_NATIVE_EXECUTION_ABI_VERSION
                       ? 0
                       : 1;
          }
          EOF
          cc -std=c11 -Wall -Wextra -Werror \
            -I"$prefix/include" -I"$SALTS_ROOT/include" \
            build/native-execution-installed.c \
            -o build/native-execution-installed
          ./build/native-execution-installed

          mkdir -p build/native-plan-installed
          cat > build/native-plan-installed/main.c <<'EOF'
          #include <data_bind_native.h>
          _Static_assert(DATA_BIND_NATIVE_PLAN_ABI_VERSION == 1u,
                         "unexpected DataBind native plan ABI");
          int main(void) {
            return data_bind_native_plan_data((DataBindNativePlan *)0) == 0
                       ? 0
                       : 1;
          }
          EOF
          cat > build/native-plan-installed/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(native_plan_installed C)
          find_package(Salts CONFIG REQUIRED)
          find_package(SaltsUtils CONFIG REQUIRED)
          add_executable(native_plan_installed main.c)
          target_link_libraries(native_plan_installed PRIVATE Salts::DataBindCore)
          EOF
          cmake -S build/native-plan-installed \
            -B build/native-plan-installed-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$prefix;$SALTS_ROOT"
          cmake --build build/native-plan-installed-build --parallel 2
          build/native-plan-installed-build/native_plan_installed

          cmake -S databind/runtime/package_config/plugin_execution \
            -B build/databind-plugin-execution-installed -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$prefix;$SALTS_ROOT"
          cmake --build build/databind-plugin-execution-installed --parallel 2
          build/databind-plugin-execution-installed/databind_plugin_execution_c
          build/databind-plugin-execution-installed/databind_plugin_execution_cpp

          cmake -S databind/producer/package_config \
            -B build/databind-producer-installed -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DCMAKE_PREFIX_PATH="$prefix;$SALTS_ROOT"
          cmake --build build/databind-producer-installed \
            --target databind_generated_plan_consumer --parallel 2
          build/databind-producer-installed/databind_generated_plan_consumer

          cmake -S databind/idl/compiler/package_config/databind_target \
            -B build/databind-target-installed -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build/databind-target-installed \
            --target installed_image --parallel 2

          cmake -S databind/idl/compiler/package_config/wasm_execution \
            -B build/databind-wasm-execution-installed -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DSALTS_UTILS_ROOT="$prefix" \
            -DCMAKE_PREFIX_PATH="$prefix;$SALTS_ROOT;$TURBOWASM_ROOT"
          cmake --build build/databind-wasm-execution-installed \
            --target wasm_execution_consumer --parallel 2
          LD_LIBRARY_PATH="$prefix/lib:$SALTS_ROOT/lib:$TURBOWASM_ROOT/lib:${LD_LIBRARY_PATH:-}" \
            build/databind-wasm-execution-installed/wasm_execution_consumer

          cat > "$prefix/salts-utils-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=$GITHUB_SHA
          os=linux
          arch=x64
          profile=release
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: salts-utils-sdk-linux-x64
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  macos:
    name: macOS SDK
    needs: metadata
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare native toolchain
        id: env
        shell: bash
        run: |
          set -euo pipefail
          brew install nasm ninja
          test -n "${VCPKG_ROOT:-}"
          test -x "$VCPKG_ROOT/vcpkg"
          test -n "${QIGAO_VCPKG_TOOLCHAIN_FILE:-}"
          test -f "$QIGAO_VCPKG_TOOLCHAIN_FILE"
          case "$RUNNER_ARCH" in
            X64) rid=macos-x64; triplet=x64-osx ;;
            ARM64) rid=macos-arm64; triplet=arm64-osx ;;
            *) echo "unsupported RUNNER_ARCH=$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          echo "rid=$rid" >> "$GITHUB_OUTPUT"
          echo "triplet=$triplet" >> "$GITHUB_OUTPUT"

      - name: Restore latest published native SDKs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-native-sdk.sh "${{ steps.env.outputs.rid }}" "${{ steps.env.outputs.rid }}" 1
      - name: Configure and install SaltsUtils
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/${{ steps.env.outputs.rid }}"
          cmake -S . -B build/native-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET="${{ steps.env.outputs.triplet }}" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DSALTS_UTILS_ENABLE_CAPTURE=ON \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/native-sdk --parallel 2
          cmake --install build/native-sdk
          test -f "$prefix/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -f "$prefix/include/data_bind_binding_plan.h"
          test -f "$prefix/include/data_bind_projection_plan.h"
          test -f "$prefix/include/data_bind_cmeta_adapter_plan.h"
          test -f "$prefix/include/data_bind_plugin_catalog.h"
          test -f "$prefix/include/data_bind_plugin_execution.h"
          test -f "$prefix/include/salts_capture.h"
          test -f "$prefix/include/salts_playback.h"
          test -f "$prefix/lib/libsalts_capture.dylib"
          test -f "$prefix/lib/libsalts_playback.dylib"

          cmake -S databind/producer/package_config \
            -B build/databind-producer-installed -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET="${{ steps.env.outputs.triplet }}" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DCMAKE_PREFIX_PATH="$prefix;$SALTS_ROOT"
          cmake --build build/databind-producer-installed \
            --target databind_generated_plan_consumer --parallel 2
          build/databind-producer-installed/databind_generated_plan_consumer

          cmake -S databind/runtime/package_config/plugin_execution \
            -B build/databind-plugin-execution-installed -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$prefix;$SALTS_ROOT"
          cmake --build build/databind-plugin-execution-installed --parallel 2
          build/databind-plugin-execution-installed/databind_plugin_execution_c
          build/databind-plugin-execution-installed/databind_plugin_execution_cpp

          cmake -S databind/idl/compiler/package_config/databind_public \
            -B build/databind-public-installed -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET="${{ steps.env.outputs.triplet }}" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build/databind-public-installed \
            --target databind_public_consumer --parallel 2

          cmake -S databind/idl/compiler/package_config/wasm_execution \
            -B build/databind-wasm-execution-installed -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET="${{ steps.env.outputs.triplet }}" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DSALTS_UTILS_ROOT="$prefix" \
            -DCMAKE_PREFIX_PATH="$prefix;$SALTS_ROOT;$TURBOWASM_ROOT"
          cmake --build build/databind-wasm-execution-installed \
            --target wasm_execution_consumer --parallel 2
          DYLD_LIBRARY_PATH="$prefix/lib:$SALTS_ROOT/lib:$TURBOWASM_ROOT/lib:${DYLD_LIBRARY_PATH:-}" \
            build/databind-wasm-execution-installed/wasm_execution_consumer

          cat > "$prefix/salts-utils-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=$GITHUB_SHA
          os=macos
          arch=$RUNNER_ARCH
          profile=release
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: salts-utils-sdk-macos
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  windows:
    name: Windows x64 SDK
    needs: metadata
    runs-on: windows-2025
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4

      - name: Restore SaltsUtils compiler object cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: salts-utils-ccache-windows-msvc-v1-${{ github.sha }}
          restore-keys: |
            salts-utils-ccache-windows-msvc-v1-

      - name: Install ccache
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install ccache -y --no-progress
          $ccache = Get-Command ccache.exe -ErrorAction SilentlyContinue
          if ($null -eq $ccache) { throw "Chocolatey ccache executable is unavailable" }
          & $ccache.Source --version
          if ($LASTEXITCODE -ne 0) { throw "ccache executable probe failed" }

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"


      - name: Prepare native toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install nasm ninja -y --no-progress
          $ninjaCommand = Get-Command ninja.exe -ErrorAction SilentlyContinue
          $ninjaPath = if ($null -ne $ninjaCommand) {
            $ninjaCommand.Source
          } else {
            $candidateRoot = Join-Path $env:ChocolateyInstall "lib\ninja"
            $candidate = Get-ChildItem -LiteralPath $candidateRoot -Recurse -Filter ninja.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($null -ne $candidate) { $candidate.FullName } else { $null }
          }
          if ([string]::IsNullOrWhiteSpace($ninjaPath) -or
              -not (Test-Path -LiteralPath $ninjaPath -PathType Leaf)) {
            throw "Chocolatey Ninja executable is unavailable"
          }
          & $ninjaPath --version
          if ($LASTEXITCODE -ne 0) { throw "Ninja executable probe failed" }
          "NINJA_EXE=$ninjaPath" >> $env:GITHUB_ENV
          $vcpkgRoot = $env:VCPKG_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            throw "canonical VCPKG_ROOT is unavailable"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $vcpkgRoot "vcpkg.exe") -PathType Leaf)) {
            throw "canonical vcpkg executable is unavailable"
          }
          if ([string]::IsNullOrWhiteSpace($env:QIGAO_VCPKG_TOOLCHAIN_FILE) -or
              -not (Test-Path -LiteralPath $env:QIGAO_VCPKG_TOOLCHAIN_FILE -PathType Leaf)) {
            throw "canonical qigao vcpkg toolchain is unavailable"
          }
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_BINARY_SOURCES) -or $env:VCPKG_BINARY_SOURCES -notmatch "nugetconfig") {
            throw "Windows shared vcpkg NuGet cache is unavailable"
          }
          if ($env:VCPKG_NUGET_REPOSITORY -ne "https://github.com/qigao/vcpkg-cache") {
            throw "unexpected Windows vcpkg cache repository: $env:VCPKG_NUGET_REPOSITORY"
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio x64 C++ toolchain not found"
          }
          "QIGAO_VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV

      - name: Restore latest published native SDKs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdk.ps1 -SaltsRid windows-x64 -Re2cRid windows-x64 -WithTurboWasm

      - name: Configure, build and install SaltsUtils SDK
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          if errorlevel 1 exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\cmake\ci\verify-vcpkg-cache-only.ps1" -Capture
          if errorlevel 1 exit /b 1
          set "PATH=%GITHUB_WORKSPACE%\build\native-sdk\bin;%SALTS_ROOT%\bin;%GITHUB_WORKSPACE%\vcpkg_installed\%QIGAO_VCPKG_WINDOWS_TRIPLET%\bin;%PATH%"
          cmake -S . -B build\native-sdk -G Ninja -DCMAKE_MAKE_PROGRAM="%NINJA_EXE%" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_TOOLCHAIN_FILE%" -DVCPKG_TARGET_TRIPLET="%QIGAO_VCPKG_WINDOWS_TRIPLET%" -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%\vcpkg_installed" -DVCPKG_INSTALL_OPTIONS=--only-binarycaching -DVCPKG_MANIFEST_FEATURES=capture -DSALTS_UTILS_ENABLE_CAPTURE=ON -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\stage\sdk\windows-x64"
          if errorlevel 1 exit /b 1
          cmake --build build\native-sdk --parallel
          if errorlevel 1 exit /b 1
          cmake --install build\native-sdk
          if errorlevel 1 exit /b 1

      - name: Verify installed DataBind and salts_idl_target consumers
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          if errorlevel 1 exit /b 1
          cmake -S databind\idl\compiler\package_config\databind_target -B build\databind-target-installed -G Ninja -DCMAKE_MAKE_PROGRAM="%NINJA_EXE%" -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_TOOLCHAIN_FILE%" -DVCPKG_TARGET_TRIPLET="%QIGAO_VCPKG_WINDOWS_TRIPLET%" -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%\vcpkg_installed" -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%\stage\sdk\windows-x64"
          if errorlevel 1 exit /b 1
          cmake --build build\databind-target-installed --target installed_image --parallel 2
          if errorlevel 1 exit /b 1
          set "PATH=%GITHUB_WORKSPACE%\stage\sdk\windows-x64\bin;%SALTS_ROOT%\bin;%PATH%"
          cmake -S databind\producer\package_config -B build\databind-producer-installed -G Ninja -DCMAKE_MAKE_PROGRAM="%NINJA_EXE%" -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_TOOLCHAIN_FILE%" -DVCPKG_TARGET_TRIPLET="%QIGAO_VCPKG_WINDOWS_TRIPLET%" -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%\vcpkg_installed" -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%\stage\sdk\windows-x64;%SALTS_ROOT%"
          if errorlevel 1 exit /b 1
          cmake --build build\databind-producer-installed --target databind_generated_plan_consumer --parallel 2
          if errorlevel 1 exit /b 1
          build\databind-producer-installed\databind_generated_plan_consumer.exe
          if errorlevel 1 exit /b 1
          cmake -S databind\runtime\package_config\plugin_execution -B build\databind-plugin-execution-installed -G Ninja -DCMAKE_MAKE_PROGRAM="%NINJA_EXE%" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%\stage\sdk\windows-x64;%SALTS_ROOT%"
          if errorlevel 1 exit /b 1
          cmake --build build\databind-plugin-execution-installed --parallel 2
          if errorlevel 1 exit /b 1
          build\databind-plugin-execution-installed\databind_plugin_execution_c.exe
          if errorlevel 1 exit /b 1
          build\databind-plugin-execution-installed\databind_plugin_execution_cpp.exe
          if errorlevel 1 exit /b 1
          cmake -S databind\idl\compiler\package_config\wasm_execution -B build\databind-wasm-execution-installed -G Ninja -DCMAKE_MAKE_PROGRAM="%NINJA_EXE%" -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_TOOLCHAIN_FILE%" -DVCPKG_TARGET_TRIPLET="%QIGAO_VCPKG_WINDOWS_TRIPLET%" -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%\vcpkg_installed" -DSALTS_UTILS_ROOT="%GITHUB_WORKSPACE%\stage\sdk\windows-x64" -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%\stage\sdk\windows-x64;%SALTS_ROOT%;%TURBOWASM_ROOT%"
          if errorlevel 1 exit /b 1
          cmake --build build\databind-wasm-execution-installed --target wasm_execution_consumer --parallel 2
          if errorlevel 1 exit /b 1
          set "PATH=%GITHUB_WORKSPACE%\stage\sdk\windows-x64\bin;%SALTS_ROOT%\bin;%TURBOWASM_ROOT%\bin;%TURBOWASM_ROOT%\lib;%PATH%"
          build\databind-wasm-execution-installed\wasm_execution_consumer.exe
          if errorlevel 1 exit /b 1

      - name: Report and verify compiler cache statistics
        shell: pwsh
        run: |
          ccache --show-stats
          if ($LASTEXITCODE -ne 0) { throw "ccache stats failed" }
          $stats = ccache --print-stats --format json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "ccache machine-readable stats failed" }
          $hits = [int64]$stats.direct_cache_hit + [int64]$stats.preprocessed_cache_hit
          $misses = [int64]$stats.cache_miss
          $cacheable = $hits + $misses
          Write-Host "ccache cacheable=$cacheable hits=$hits misses=$misses"
          if ($cacheable -le 0) {
            throw "ccache did not observe any cacheable SaltsUtils compiler calls"
          }

      - name: Verify Windows SDK
        shell: pwsh
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE "stage\sdk\windows-x64"
          $config = Join-Path $prefix "lib\cmake\SaltsUtils\SaltsUtilsConfig.cmake"
          $bindingPlanHeader = Join-Path $prefix "include\data_bind_binding_plan.h"
          $producerHeader = Join-Path $prefix "include\data_bind_cmeta_adapter_plan.h"
          $pluginCatalogHeader = Join-Path $prefix "include\data_bind_plugin_catalog.h"
          $pluginExecutionHeader = Join-Path $prefix "include\data_bind_plugin_execution.h"
          if (-not (Test-Path -LiteralPath $config -PathType Leaf)) { throw "missing $config" }
          if (-not (Test-Path -LiteralPath $bindingPlanHeader -PathType Leaf)) { throw "missing $bindingPlanHeader" }
          if (-not (Test-Path -LiteralPath $producerHeader -PathType Leaf)) { throw "missing $producerHeader" }
          if (-not (Test-Path -LiteralPath $pluginCatalogHeader -PathType Leaf)) { throw "missing $pluginCatalogHeader" }
          if (-not (Test-Path -LiteralPath $pluginExecutionHeader -PathType Leaf)) { throw "missing $pluginExecutionHeader" }
          $manifest = @(
            "version=${{ needs.metadata.outputs.version }}"
            "commit=$env:GITHUB_SHA"
            "os=windows"
            "arch=x64"
            "profile=release"
          )
          $manifest | Set-Content -LiteralPath (Join-Path $prefix "salts-utils-sdk-manifest.txt")

      - uses: actions/upload-artifact@v4
        with:
          name: salts-utils-sdk-windows-x64
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  android:
    name: Android arm64-v8a SDK
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          test -n "${VCPKG_ROOT:-}"
          test -x "$VCPKG_ROOT/vcpkg"
          test -n "${QIGAO_VCPKG_TOOLCHAIN_FILE:-}"
          test -f "$QIGAO_VCPKG_TOOLCHAIN_FILE"
          test -n "${ANDROID_NDK_HOME:-}"

      - name: Restore latest published native SDKs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-native-sdk.sh android-arm64-v8a linux-x64 1
      - name: Build host Lemon
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S tools/lemon -B build/host-lemon -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host-lemon --target lemon --parallel 2
      - name: Build current host salts-idlc
        shell: bash
        run: |
          set -euxo pipefail
          SALTS_ROOT="$SALTS_HOST_ROOT" cmake -S . -B build/host-idlc -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed-host" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DSALTS_UTILS_ENABLE_CAPTURE=OFF \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF
          SALTS_ROOT="$SALTS_HOST_ROOT" cmake --build build/host-idlc \
            --target salts_idlc --parallel 2
          host_idlc="$(find "$GITHUB_WORKSPACE/build/host-idlc" -type f -name salts-idlc -perm -111 -print -quit)"
          test -n "$host_idlc"
          echo "SALTS_UTILS_HOST_IDLC=$host_idlc" >> "$GITHUB_ENV"

      - name: Configure and install Android SaltsUtils
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/android-arm64-v8a"
          cmake -S . -B build/android-native-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_shared \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="$GITHUB_WORKSPACE/build/host-lemon/lemon" \
            -DVCPKG_MANIFEST_FEATURES=capture \
            -DSALTS_UTILS_ENABLE_CAPTURE=ON \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/android-native-sdk --parallel 2
          cmake --install build/android-native-sdk
          test -f "$prefix/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -f "$prefix/include/data_bind_binding_plan.h"
          test -f "$prefix/include/data_bind_projection_plan.h"
          test -f "$prefix/include/data_bind_cmeta_adapter_plan.h"
          test -f "$prefix/include/data_bind_plugin_catalog.h"
          test -f "$prefix/include/data_bind_plugin_execution.h"

          cmake -S databind/runtime/package_config/plugin_execution \
            -B build/databind-plugin-execution-android -G Ninja \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DSaltsUtils_DIR="$prefix/lib/cmake/SaltsUtils" \
            -DSalts_DIR="$SALTS_ROOT/lib/cmake/Salts"
          cmake --build build/databind-plugin-execution-android --parallel 2

          cmake -S databind/producer/package_config \
            -B build/databind-producer-android -G Ninja \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DSaltsUtils_DIR="$prefix/lib/cmake/SaltsUtils" \
            -DSalts_DIR="$SALTS_ROOT/lib/cmake/Salts"
          cmake --build build/databind-producer-android \
            --target databind_producer_generate --parallel 2

          cmake -S databind/idl/compiler/package_config/databind_public \
            -B build/databind-public-android -G Ninja \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DSaltsUtils_DIR="$prefix/lib/cmake/SaltsUtils" \
            -DSalts_DIR="$SALTS_ROOT/lib/cmake/Salts"
          cmake --build build/databind-public-android \
            --target databind_public_consumer --parallel 2

          cmake -S databind/idl/compiler/package_config/wasm_execution \
            -B build/databind-wasm-execution-android -G Ninja \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DPython3_EXECUTABLE="$(command -v python3)" \
            -DSALTS_UTILS_ROOT="$prefix" \
            -DSaltsUtils_IDLC_EXECUTABLE="$SALTS_UTILS_HOST_IDLC" \
            -DSaltsUtils_IDLC_HOST_SALTS_ROOT="$SALTS_HOST_ROOT" \
            -DCMAKE_PREFIX_PATH="$prefix;$SALTS_ROOT;$TURBOWASM_ROOT"
          cmake --build build/databind-wasm-execution-android \
            --target wasm_execution_consumer --parallel 2

          cat > "$prefix/salts-utils-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=$GITHUB_SHA
          os=android
          abi=arm64-v8a
          api=android-26
          profile=release
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: salts-utils-sdk-android-arm64-v8a
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9


  ios:
    name: iOS SDK / ${{ matrix.name }}
    needs: metadata
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: device arm64, triplet: arm64-ios, rid: ios-arm64, sysroot: iphoneos}
          - {name: simulator arm64, triplet: arm64-ios-simulator, rid: ios-simulator-arm64, sysroot: iphonesimulator}
    env:
      X_VCPKG_NUGET_ID_PREFIX: vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare iOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          brew install ninja nasm
          test -n "${VCPKG_ROOT:-}"
          test -x "$VCPKG_ROOT/vcpkg"
          test -n "${QIGAO_VCPKG_TOOLCHAIN_FILE:-}"
          test -f "$QIGAO_VCPKG_TOOLCHAIN_FILE"

      - name: Restore latest published Salts SDK and host re2c
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-native-sdk.sh "${{ matrix.rid }}" macos-arm64

      - name: Build host Lemon
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S tools/lemon -B "build/host-lemon-${{ matrix.rid }}" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "build/host-lemon-${{ matrix.rid }}" --target lemon --parallel 2

      - name: Restore minimal host idlc dependencies
        shell: bash
        run: |
          set -euxo pipefail
          manifest="$RUNNER_TEMP/salts-utils-host-idlc-${{ matrix.rid }}"
          install_root="$GITHUB_WORKSPACE/vcpkg_installed-host-${{ matrix.rid }}"
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json", encoding="utf-8"))["builtin-baseline"])')"
          rm -rf "$manifest" "$install_root"
          mkdir -p "$manifest"
          cat > "$manifest/vcpkg.json" <<EOF
          {
            "name": "salts-utils-host-idlc",
            "version-string": "1",
            "dependencies": ["simde"],
            "builtin-baseline": "$baseline"
          }
          EOF
          # Generic macOS host packages use the central host namespace;
          # the vcpkg-cache_* prefix is reserved here for iOS target triplets.
          X_VCPKG_NUGET_ID_PREFIX="" "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$manifest" \
            --x-install-root="$install_root" \
            --triplet arm64-osx \
            --only-binarycaching
          test -f "$install_root/arm64-osx/include/simde/x86/sse2.h"
          echo "SALTS_UTILS_HOST_VCPKG_INSTALLED=$install_root" >> "$GITHUB_ENV"

      - name: Build current host salts-idlc
        shell: bash
        run: |
          set -euxo pipefail
          host_build="$GITHUB_WORKSPACE/build/host-idlc-${{ matrix.rid }}"
          host_lemon="$GITHUB_WORKSPACE/build/host-lemon-${{ matrix.rid }}/lemon"
          SALTS_ROOT="$SALTS_HOST_ROOT" cmake -S . -B "$host_build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_TARGET_TRIPLET=arm64-osx \
            -DVCPKG_INSTALLED_DIR="$SALTS_UTILS_HOST_VCPKG_INSTALLED" \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="$host_lemon" \
            -DSALTS_UTILS_ENABLE_CAPTURE=OFF \
            -DSALTS_UTILS_QUALIFY_DATABIND=ON \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF
          SALTS_ROOT="$SALTS_HOST_ROOT" cmake --build "$host_build" \
            --target salts_idlc --parallel 2
          host_idlc="$(find "$host_build" -type f -name salts-idlc -perm -111 -print -quit)"
          test -n "$host_idlc"
          echo "SALTS_UTILS_HOST_IDLC=$host_idlc" >> "$GITHUB_ENV"

      - name: Configure and install iOS SaltsUtils
        shell: bash
        run: |
          set -euxo pipefail
          build="$GITHUB_WORKSPACE/build/${{ matrix.rid }}"
          prefix="$GITHUB_WORKSPACE/stage/sdk/${{ matrix.rid }}"
          cmake -S . -B "$build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${{ matrix.sysroot }}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed-${{ matrix.triplet }}" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="$GITHUB_WORKSPACE/build/host-lemon-${{ matrix.rid }}/lemon" \
            -DSALTS_UTILS_BUILD_IDLC=OFF \
            -DVCPKG_MANIFEST_FEATURES=capture \
            -DSALTS_UTILS_ENABLE_CAPTURE=ON \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build "$build" --parallel 2
          cmake --install "$build"

          test -f "$prefix/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -f "$prefix/lib/cmake/SaltsUtils/IDL.cmake"
          test -f "$prefix/include/data_bind_binding_plan.h"
          test -f "$prefix/include/data_bind_projection_plan.h"
          test -f "$prefix/include/data_bind_cmeta_adapter_plan.h"
          test -f "$prefix/include/data_bind_plugin_catalog.h"
          test -f "$prefix/include/data_bind_plugin_execution.h"
          test -f "$prefix/include/salts_capture.h"
          test -f "$prefix/include/salts_playback.h"
          test ! -e "$prefix/bin/salts-idlc"
          test -n "$(find "$prefix/lib" -maxdepth 1 -type f -name 'libsalts_capture.*' -print -quit)"
          test -n "$(find "$prefix/lib" -maxdepth 1 -type f -name 'libsalts_playback.*' -print -quit)"

          cmake -S databind/runtime/package_config/plugin_execution \
            -B "build/databind-plugin-execution-${{ matrix.rid }}" -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${{ matrix.sysroot }}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed-${{ matrix.triplet }}" \
            -DSaltsUtils_DIR="$prefix/lib/cmake/SaltsUtils" \
            -DSalts_DIR="$SALTS_ROOT/lib/cmake/Salts"
          cmake --build "build/databind-plugin-execution-${{ matrix.rid }}" --parallel 2

          cmake -S databind/producer/package_config \
            -B "build/databind-producer-${{ matrix.rid }}" -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${{ matrix.sysroot }}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed-${{ matrix.triplet }}" \
            -DSaltsUtils_DIR="$prefix/lib/cmake/SaltsUtils" \
            -DSalts_DIR="$SALTS_ROOT/lib/cmake/Salts" \
            -DSaltsUtils_IDLC_EXECUTABLE="$SALTS_UTILS_HOST_IDLC" \
            -DSaltsUtils_IDLC_HOST_SALTS_ROOT="$SALTS_HOST_ROOT"
          cmake --build "build/databind-producer-${{ matrix.rid }}" \
            --target databind_producer_generate --parallel 2

          cmake -S databind/idl/compiler/package_config/databind_public \
            -B "build/databind-public-${{ matrix.rid }}" -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${{ matrix.sysroot }}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed-${{ matrix.triplet }}" \
            -DSaltsUtils_DIR="$prefix/lib/cmake/SaltsUtils" \
            -DSalts_DIR="$SALTS_ROOT/lib/cmake/Salts" \
            -DSaltsUtils_IDLC_EXECUTABLE="$SALTS_UTILS_HOST_IDLC" \
            -DSaltsUtils_IDLC_HOST_SALTS_ROOT="$SALTS_HOST_ROOT"
          cmake --build "build/databind-public-${{ matrix.rid }}" \
            --target databind_public_consumer --parallel 2

          cat > "$prefix/salts-utils-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=$GITHUB_SHA
          os=ios
          rid=${{ matrix.rid }}
          triplet=${{ matrix.triplet }}
          profile=release
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: salts-utils-sdk-${{ matrix.rid }}
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  pack:
    name: Pack SaltsUtils.Native
    needs: [metadata, linux, macos, windows, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: salts-utils-sdk-*
          path: package/sdk
          merge-multiple: true
      - name: Verify package payload
        shell: bash
        run: |
          set -euo pipefail
          test -f package/sdk/linux-x64/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake
          test -f package/sdk/linux-x64/lib/cmake/SaltsUtils/IDL.cmake
          test -f package/sdk/linux-x64/include/data_bind_binding_plan.h
          test -f package/sdk/linux-x64/include/data_bind_cmeta_adapter_plan.h
          test -f package/sdk/linux-x64/include/salts_capture.h
          test -f package/sdk/linux-x64/include/salts_playback.h
          test -f package/sdk/windows-x64/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake
          test -f package/sdk/windows-x64/lib/cmake/SaltsUtils/IDL.cmake
          test -f package/sdk/windows-x64/include/data_bind_binding_plan.h
          test -f package/sdk/windows-x64/include/data_bind_cmeta_adapter_plan.h
          test -f package/sdk/windows-x64/include/salts_capture.h
          test -f package/sdk/windows-x64/include/salts_playback.h
          test -f package/sdk/android-arm64-v8a/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake
          test -f package/sdk/android-arm64-v8a/include/data_bind_binding_plan.h
          test -f package/sdk/android-arm64-v8a/include/data_bind_cmeta_adapter_plan.h
          test -f package/sdk/android-arm64-v8a/include/salts_capture.h
          test -f package/sdk/android-arm64-v8a/include/salts_playback.h
          for rid in ios-arm64 ios-simulator-arm64; do
            test -f "package/sdk/$rid/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
            test -f "package/sdk/$rid/lib/cmake/SaltsUtils/IDL.cmake"
            test -f "package/sdk/$rid/include/data_bind_binding_plan.h"
            test -f "package/sdk/$rid/include/data_bind_cmeta_adapter_plan.h"
            test -f "package/sdk/$rid/include/salts_capture.h"
            test -f "package/sdk/$rid/include/salts_playback.h"
            test ! -e "package/sdk/$rid/bin/salts-idlc"
            test -n "$(find "package/sdk/$rid/lib" -maxdepth 1 -type f -name 'libsalts_capture.*' -print -quit)"
            test -n "$(find "package/sdk/$rid/lib" -maxdepth 1 -type f -name 'libsalts_playback.*' -print -quit)"
          done
          test "$(find package/sdk -maxdepth 2 -name salts-utils-sdk-manifest.txt | wc -l)" -eq 6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Configure GitHub Packages source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/nuget.config"
          printf '<?xml version="1.0" encoding="utf-8"?><configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json --name github --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text --configfile "$config"
          echo "NUGET_CONFIG=$config" >> "$GITHUB_ENV"
      - name: Create NuGet package
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore packaging/nuget/SaltsUtils.Native.csproj --configfile "$NUGET_CONFIG" --packages "$RUNNER_TEMP/pack-nuget"
          dotnet pack packaging/nuget/SaltsUtils.Native.csproj --no-restore --configuration Release --output dist -p:PackageVersion=${{ needs.metadata.outputs.version }} -p:PackageRoot="$GITHUB_WORKSPACE/package" -p:RestorePackagesPath="$RUNNER_TEMP/pack-nuget"
          nupkg="dist/SaltsUtils.Native.${{ needs.metadata.outputs.version }}.nupkg"
          test -f "$nupkg"
          unzip -p "$nupkg" '*.nuspec' > "$RUNNER_TEMP/salts-utils.nuspec"
          if grep -q '<dependencies' "$RUNNER_TEMP/salts-utils.nuspec"; then
            echo "SaltsUtils.Native must not publish dependency metadata" >&2
            cat "$RUNNER_TEMP/salts-utils.nuspec" >&2
            exit 1
          fi
          unzip -Z1 "$nupkg" | sort | tee "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/linux-x64/bin/salts-idlc" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/windows-x64/bin/salts-idlc.exe" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/linux-x64/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/linux-x64/lib/cmake/SaltsUtils/IDL.cmake" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/linux-x64/include/data_bind_binding_plan.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/linux-x64/include/data_bind_native.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/linux-x64/include/data_bind_native_binding.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/linux-x64/include/data_bind_cmeta_adapter_plan.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/linux-x64/include/data_bind_plugin_catalog.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/linux-x64/include/salts_capture.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/linux-x64/include/salts_playback.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/windows-x64/include/data_bind_binding_plan.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/windows-x64/include/data_bind_native.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/windows-x64/include/data_bind_cmeta_adapter_plan.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/windows-x64/include/data_bind_plugin_catalog.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/windows-x64/include/salts_capture.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/windows-x64/include/salts_playback.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/android-arm64-v8a/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/android-arm64-v8a/include/data_bind_binding_plan.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/android-arm64-v8a/include/data_bind_native.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/android-arm64-v8a/include/data_bind_cmeta_adapter_plan.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/android-arm64-v8a/include/data_bind_plugin_catalog.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/android-arm64-v8a/include/salts_capture.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/android-arm64-v8a/include/salts_playback.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          for rid in ios-arm64 ios-simulator-arm64; do
            grep -Fx "sdk/$rid/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake" "$RUNNER_TEMP/salts-utils-nupkg.txt"
            grep -Fx "sdk/$rid/lib/cmake/SaltsUtils/IDL.cmake" "$RUNNER_TEMP/salts-utils-nupkg.txt"
            grep -Fx "sdk/$rid/include/data_bind_binding_plan.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
            grep -Fx "sdk/$rid/include/data_bind_native.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
            grep -Fx "sdk/$rid/include/data_bind_cmeta_adapter_plan.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
            grep -Fx "sdk/$rid/include/data_bind_plugin_catalog.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
            grep -Fx "sdk/$rid/include/salts_capture.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
            grep -Fx "sdk/$rid/include/salts_playback.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
            if grep -Fxq "sdk/$rid/bin/salts-idlc" "$RUNNER_TEMP/salts-utils-nupkg.txt"; then
              echo "target iOS RID must not package host salts-idlc: $rid" >&2
              exit 1
            fi
          done
          if grep -Fxq "sdk/macos-arm64/bin/salts-idlc" "$RUNNER_TEMP/salts-utils-nupkg.txt"; then
            mac_rid=macos-arm64
          else
            mac_rid=macos-x64
          fi
          grep -Fx "sdk/$mac_rid/include/data_bind_plugin_catalog.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/$mac_rid/include/salts_capture.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/$mac_rid/include/salts_playback.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/$mac_rid/lib/libsalts_capture.dylib" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/$mac_rid/lib/libsalts_playback.dylib" "$RUNNER_TEMP/salts-utils-nupkg.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: salts-utils-native-nuget
          path: dist/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish package and GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [metadata, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: salts-utils-native-nuget
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet nuget add source --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text --name github https://nuget.pkg.github.com/qigao/index.json
          dotnet nuget push "dist/SaltsUtils.Native.${{ needs.metadata.outputs.version }}.nupkg" --api-key "$GITHUB_TOKEN" --source github --skip-duplicate
      - name: Create GitHub Release from version tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" dist/*.nupkg --repo "$GITHUB_REPOSITORY" --verify-tag --title "SaltsUtils $VERSION" --generate-notes
