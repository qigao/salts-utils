name: SaltsUtils native SDK release

on:
  pull_request:
    branches: [master]
    paths:
      - "CMakeLists.txt"
      - "databind/**"
      - "plugin/**"
      - "plugin-cflow/**"
      - "jinja/**"
      - "docs/architecture/jinja-cmeta.md"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "cmake/ci/restore-versioned-native-sdk.*"
      - "cmake/ci/verify-vcpkg-cache-only.ps1"
      - "packaging/nuget/**"
      - ".github/workflows/native-sdk-release.yml"
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "CMakeLists.txt"
      - "databind/**"
      - "plugin/**"
      - "plugin-cflow/**"
      - "jinja/**"
      - "docs/architecture/jinja-cmeta.md"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "cmake/ci/restore-versioned-native-sdk.*"
      - "cmake/ci/verify-vcpkg-cache-only.ps1"
      - "packaging/nuget/**"
      - ".github/workflows/native-sdk-release.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: salts-utils-native-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SALTS_SDK_VERSION: "1.7.1"
  RE2C_BINARY_VERSION: "4.6.3"

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{print $2; exit}' CMakeLists.txt)"
          test -n "$version"
          tag="v$version"
          release=false
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME:-}" != "$tag" ]; then
              echo "release tag ${GITHUB_REF_NAME:-<unset>} does not match project version $tag" >&2
              exit 1
            fi
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  binding-plan:
    name: DataBind BindingPlan contract
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare focused native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          test -n "${VCPKG_ROOT:-}"
          test -n "${VCPKG_BINARY_SOURCES:-}"
          case "$VCPKG_BINARY_SOURCES" in
            *nugetconfig*) ;;
            *) echo "shared vcpkg NuGet cache is not configured" >&2; exit 1 ;;
          esac
          test "${VCPKG_NUGET_REPOSITORY:-}" = "https://github.com/qigao/vcpkg-cache"

      - name: Restore published Salts 1.7.1 and re2c 4.6.3
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-versioned-native-sdk.sh linux-x64 linux-x64

      - name: Configure focused BindingPlan test build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/binding-plan -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DSALTS_UTILS_ENABLE_CAPTURE=OFF \
            -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_UNDEFINED=OFF
          cmake --build build/binding-plan \
            --target test_data_bind_binding_plan test_data_bind_projection_plan \
                     test_data_bind_native_writer test_data_bind_cmeta_public_cpp \
            --parallel 2

      - name: Run canonical BindingPlan runtime contract
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/binding-plan --no-tests=error \
            -R '^(test_data_bind_binding_plan|test_data_bind_projection_plan|test_data_bind_native_writer|test_data_bind_cmeta_public_cpp)$' \
            --output-on-failure
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$(git status --porcelain --untracked-files=no)"

  jinja-cmeta:
    name: Jinja CMeta/CSTL contract
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare focused native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          test -n "${VCPKG_ROOT:-}"
          test -n "${VCPKG_BINARY_SOURCES:-}"
          case "$VCPKG_BINARY_SOURCES" in
            *nugetconfig*) ;;
            *) echo "shared vcpkg NuGet cache is not configured" >&2; exit 1 ;;
          esac
          test "${VCPKG_NUGET_REPOSITORY:-}" = "https://github.com/qigao/vcpkg-cache"

      - name: Restore published Salts 1.7.1 and re2c 4.6.3
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-versioned-native-sdk.sh linux-x64 linux-x64

      - name: Configure focused Jinja CMeta build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/jinja-cmeta -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DSALTS_UTILS_ENABLE_CAPTURE=OFF \
            -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_UNDEFINED=OFF
          cmake --build build/jinja-cmeta \
            --target test_jinja_cmeta_cstl_collections \
                     test_jinja_cmeta_iterators \
                     test_jinja_cmeta_attributes \
                     test_jinja_cmeta_budgets \
                     test_jinja_cmeta_identity \
                     test_jinja_cmeta_templates \
                     test_jinja_cmeta_header_cpp \
                     test_jinja_runtime_header_cpp \
            --parallel 2

      - name: Run canonical Jinja CMeta/CSTL contract
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/jinja-cmeta --no-tests=error \
            -R '^(test_jinja_cmeta_(cstl_collections|iterators|attributes|budgets|identity|templates|header_cpp))$' \
            --output-on-failure
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$(git status --porcelain --untracked-files=no)"

  linux:
    name: Linux x64 SDK
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Prepare native toolchain
        id: env
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          if [ -n "${VCPKG_ROOT:-}" ] &&
             [ -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            true
          elif [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] &&
               [ -f "$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            vcpkg_bin="$(readlink -f "$(command -v vcpkg)")"
            echo "VCPKG_ROOT=$(dirname "$vcpkg_bin")" >> "$GITHUB_ENV"
          fi

      - name: Restore versioned Salts and re2c SDKs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-versioned-native-sdk.sh linux-x64 linux-x64
      - name: Configure and install SaltsUtils
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/linux-x64"
          cmake -S . -B build/native-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/native-sdk --parallel 2
          cmake --install build/native-sdk
          test -f "$prefix/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -f "$prefix/include/data_bind_binding_plan.h"
          test -f "$prefix/include/data_bind_projection_plan.h"

          cmake -S plugin/tests/package_config/plugin_abi \
            -B build/plugin-abi-installed -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build/plugin-abi-installed --parallel 2
          ./build/plugin-abi-installed/plugin_abi_installed_consumer

          cmake -S plugin-cflow/tests/package_config \
            -B build/plugin-cflow-installed -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build/plugin-cflow-installed --parallel 2
          ./build/plugin-cflow-installed/plugin_cflow_installed_consumer

          cmake -S databind/compiler/package_config/databind_target \
            -B build/databind-target-installed -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build/databind-target-installed \
            --target installed_image --parallel 2

          cat > "$prefix/salts-utils-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=$GITHUB_SHA
          salts=$SALTS_SDK_VERSION
          re2c=$RE2C_BINARY_VERSION
          os=linux
          arch=x64
          profile=release
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: salts-utils-sdk-linux-x64
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  macos:
    name: macOS SDK
    needs: metadata
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Prepare native toolchain
        id: env
        shell: bash
        run: |
          set -euo pipefail
          brew install nasm ninja
          if [ -n "${VCPKG_ROOT:-}" ] && [ -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            true
          elif [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] && [ -f "$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          elif [ -f "$(brew --prefix)/share/vcpkg/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "VCPKG_ROOT=$(brew --prefix)/share/vcpkg" >> "$GITHUB_ENV"
          else
            echo "vcpkg unavailable" >&2; exit 1
          fi
          case "$RUNNER_ARCH" in
            X64) rid=macos-x64; triplet=x64-osx ;;
            ARM64) rid=macos-arm64; triplet=arm64-osx ;;
            *) echo "unsupported RUNNER_ARCH=$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          echo "rid=$rid" >> "$GITHUB_OUTPUT"
          echo "triplet=$triplet" >> "$GITHUB_OUTPUT"

      - name: Restore versioned Salts and re2c SDKs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-versioned-native-sdk.sh "${{ steps.env.outputs.rid }}" "${{ steps.env.outputs.rid }}"
      - name: Configure and install SaltsUtils
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/${{ steps.env.outputs.rid }}"
          cmake -S . -B build/native-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ steps.env.outputs.triplet }}" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/native-sdk --parallel 2
          cmake --install build/native-sdk
          test -f "$prefix/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -f "$prefix/include/data_bind_binding_plan.h"
          test -f "$prefix/include/data_bind_projection_plan.h"

          cmake -S databind/compiler/package_config/databind_public \
            -B build/databind-public-installed -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ steps.env.outputs.triplet }}" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build/databind-public-installed \
            --target databind_public_consumer --parallel 2

          cat > "$prefix/salts-utils-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=$GITHUB_SHA
          salts=$SALTS_SDK_VERSION
          re2c=$RE2C_BINARY_VERSION
          os=macos
          arch=$RUNNER_ARCH
          profile=release
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: salts-utils-sdk-macos
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  windows:
    name: Windows x64 SDK
    needs: metadata
    runs-on: windows-2022
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4

      - name: Restore SaltsUtils compiler object cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: salts-utils-ccache-windows-msvc-v1-${{ github.sha }}
          restore-keys: |
            salts-utils-ccache-windows-msvc-v1-

      - name: Install ccache 4.14
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "ccache-4.14-windows-x86_64.zip"
          $root = Join-Path $env:RUNNER_TEMP "ccache-4.14"
          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v4.14/ccache-4.14-windows-x86_64.zip" -OutFile $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "2568347a697e103ca1b073981c704ad76fb2507d066c38dba038dd73399d968f") {
            throw "ccache archive digest mismatch: $hash"
          }
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP
          $exe = Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Recurse -Filter ccache.exe |
            Where-Object { $_.FullName -like "*ccache-4.14-windows-x86_64*" } |
            Select-Object -First 1
          if ($null -eq $exe) { throw "ccache.exe not found after extraction" }
          Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path $env:RUNNER_TEMP "ccache.exe") -Force
          $env:RUNNER_TEMP | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $env:RUNNER_TEMP "ccache.exe") --version

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Prepare native toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install nasm ninja -y --no-progress
          $vcpkgRoot = $env:VCPKG_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          }
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            throw "VCPKG_ROOT is unavailable"
          }
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_BINARY_SOURCES) -or $env:VCPKG_BINARY_SOURCES -notmatch "nugetconfig") {
            throw "Windows shared vcpkg NuGet cache is unavailable"
          }
          if ($env:VCPKG_NUGET_REPOSITORY -ne "https://github.com/qigao/vcpkg-cache") {
            throw "unexpected Windows vcpkg cache repository: $env:VCPKG_NUGET_REPOSITORY"
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio x64 C++ toolchain not found"
          }
          "QIGAO_VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV

      - name: Restore published Salts 1.7.1 and re2c 4.6.3
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-versioned-native-sdk.ps1 -SaltsRid windows-x64 -Re2cRid windows-x64

      - name: Configure, build and install SaltsUtils SDK
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          if errorlevel 1 exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\cmake\ci\verify-vcpkg-cache-only.ps1" -Capture
          if errorlevel 1 exit /b 1
          set "PATH=%GITHUB_WORKSPACE%\build\native-sdk\bin;%SALTS_ROOT%\bin;%GITHUB_WORKSPACE%\vcpkg_installed\x64-windows\bin;%PATH%"
          cmake -S . -B build\native-sdk -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%\vcpkg_installed" -DVCPKG_INSTALL_OPTIONS=--only-binarycaching -DVCPKG_MANIFEST_FEATURES=capture -DSALTS_UTILS_ENABLE_CAPTURE=ON -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\stage\sdk\windows-x64"
          if errorlevel 1 exit /b 1
          cmake --build build\native-sdk --parallel
          if errorlevel 1 exit /b 1
          cmake --install build\native-sdk
          if errorlevel 1 exit /b 1

      - name: Verify installed PluginABI and databind_target consumers
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          if errorlevel 1 exit /b 1
          cmake -S plugin\tests\package_config\plugin_abi -B build\plugin-abi-installed -G Ninja -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%\vcpkg_installed" -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%\stage\sdk\windows-x64"
          if errorlevel 1 exit /b 1
          cmake --build build\plugin-abi-installed --parallel 2
          if errorlevel 1 exit /b 1
          build\plugin-abi-installed\plugin_abi_installed_consumer.exe
          if errorlevel 1 exit /b 1

          cmake -S plugin-cflow\tests\package_config -B build\plugin-cflow-installed -G Ninja -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%\vcpkg_installed" -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%\stage\sdk\windows-x64"
          if errorlevel 1 exit /b 1
          cmake --build build\plugin-cflow-installed --parallel 2
          if errorlevel 1 exit /b 1
          build\plugin-cflow-installed\plugin_cflow_installed_consumer.exe
          if errorlevel 1 exit /b 1

          cmake -S databind\compiler\package_config\databind_target -B build\databind-target-installed -G Ninja -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%\vcpkg_installed" -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%\stage\sdk\windows-x64"
          if errorlevel 1 exit /b 1
          cmake --build build\databind-target-installed --target installed_image --parallel 2
          if errorlevel 1 exit /b 1

      - name: Report and verify compiler cache statistics
        shell: pwsh
        run: |
          ccache --show-stats
          if ($LASTEXITCODE -ne 0) { throw "ccache stats failed" }
          $stats = ccache --print-stats --format json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "ccache machine-readable stats failed" }
          $hits = [int64]$stats.direct_cache_hit + [int64]$stats.preprocessed_cache_hit
          $misses = [int64]$stats.cache_miss
          $cacheable = $hits + $misses
          Write-Host "ccache cacheable=$cacheable hits=$hits misses=$misses"
          if ($cacheable -le 0) {
            throw "ccache did not observe any cacheable SaltsUtils compiler calls"
          }

      - name: Verify Windows SDK
        shell: pwsh
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE "stage\sdk\windows-x64"
          $config = Join-Path $prefix "lib\cmake\SaltsUtils\SaltsUtilsConfig.cmake"
          $bindingPlanHeader = Join-Path $prefix "include\data_bind_binding_plan.h"
          if (-not (Test-Path -LiteralPath $config -PathType Leaf)) { throw "missing $config" }
          if (-not (Test-Path -LiteralPath $bindingPlanHeader -PathType Leaf)) { throw "missing $bindingPlanHeader" }
          $manifest = @(
            "version=${{ needs.metadata.outputs.version }}"
            "commit=$env:GITHUB_SHA"
            "salts=$env:SALTS_SDK_VERSION"
            "re2c=$env:RE2C_BINARY_VERSION"
            "os=windows"
            "arch=x64"
            "profile=release"
          )
          $manifest | Set-Content -LiteralPath (Join-Path $prefix "salts-utils-sdk-manifest.txt")

      - uses: actions/upload-artifact@v4
        with:
          name: salts-utils-sdk-windows-x64
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  android:
    name: Android arm64-v8a SDK
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Prepare Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          if [ -n "${VCPKG_ROOT:-}" ] &&
             [ -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            true
          elif [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] &&
               [ -f "$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            vcpkg_bin="$(readlink -f "$(command -v vcpkg)")"
            echo "VCPKG_ROOT=$(dirname "$vcpkg_bin")" >> "$GITHUB_ENV"
          fi
          test -n "${ANDROID_NDK_HOME:-}"

      - name: Restore versioned target Salts and host re2c SDKs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-versioned-native-sdk.sh android-arm64-v8a linux-x64
      - name: Build host Lemon
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S tools/lemon -B build/host-lemon -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host-lemon --target lemon --parallel 2
      - name: Configure and install Android SaltsUtils
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/android-arm64-v8a"
          cmake -S . -B build/android-native-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_shared \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="$GITHUB_WORKSPACE/build/host-lemon/lemon" \
            -DSALTS_UTILS_ENABLE_CAPTURE=OFF \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/android-native-sdk --parallel 2
          cmake --install build/android-native-sdk
          test -f "$prefix/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -f "$prefix/include/data_bind_binding_plan.h"
          test -f "$prefix/include/data_bind_projection_plan.h"

          cmake -S databind/compiler/package_config/databind_public \
            -B build/databind-public-android -G Ninja \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DSaltsUtils_DIR="$prefix/lib/cmake/SaltsUtils" \
            -DSalts_DIR="$SALTS_ROOT/lib/cmake/Salts"
          cmake --build build/databind-public-android \
            --target databind_public_consumer --parallel 2

          cat > "$prefix/salts-utils-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=$GITHUB_SHA
          salts=$SALTS_SDK_VERSION
          re2c=$RE2C_BINARY_VERSION
          os=android
          abi=arm64-v8a
          api=android-26
          profile=release
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: salts-utils-sdk-android-arm64-v8a
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  pack:
    name: Pack SaltsUtils.Native
    needs: [metadata, linux, macos, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: salts-utils-sdk-*
          path: package/sdk
          merge-multiple: true
      - name: Verify package payload
        shell: bash
        run: |
          set -euo pipefail
          test -f package/sdk/linux-x64/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake
          test -f package/sdk/linux-x64/lib/cmake/SaltsUtils/DataBind.cmake
          test -f package/sdk/linux-x64/include/data_bind_binding_plan.h
          test -f package/sdk/windows-x64/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake
          test -f package/sdk/windows-x64/lib/cmake/SaltsUtils/DataBind.cmake
          test -f package/sdk/windows-x64/include/data_bind_binding_plan.h
          test -f package/sdk/android-arm64-v8a/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake
          test -f package/sdk/android-arm64-v8a/include/data_bind_binding_plan.h
          test "$(find package/sdk -maxdepth 2 -name salts-utils-sdk-manifest.txt | wc -l)" -eq 4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Configure GitHub Packages source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/nuget.config"
          printf '<?xml version="1.0" encoding="utf-8"?><configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json --name github --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text --configfile "$config"
          echo "NUGET_CONFIG=$config" >> "$GITHUB_ENV"
      - name: Create NuGet package
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore packaging/nuget/SaltsUtils.Native.csproj --configfile "$NUGET_CONFIG" --packages "$RUNNER_TEMP/pack-nuget"
          dotnet pack packaging/nuget/SaltsUtils.Native.csproj --no-restore --configuration Release --output dist -p:PackageVersion=${{ needs.metadata.outputs.version }} -p:PackageRoot="$GITHUB_WORKSPACE/package" -p:RestorePackagesPath="$RUNNER_TEMP/pack-nuget"
          nupkg="dist/SaltsUtils.Native.${{ needs.metadata.outputs.version }}.nupkg"
          test -f "$nupkg"
          unzip -Z1 "$nupkg" | sort | tee "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/linux-x64/bin/databindc" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/windows-x64/bin/databindc.exe" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/linux-x64/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/linux-x64/lib/cmake/SaltsUtils/DataBind.cmake" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/linux-x64/include/data_bind_binding_plan.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/windows-x64/include/data_bind_binding_plan.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/android-arm64-v8a/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          grep -Fx "sdk/android-arm64-v8a/include/data_bind_binding_plan.h" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          if grep -Fxq "sdk/macos-arm64/bin/databindc" "$RUNNER_TEMP/salts-utils-nupkg.txt"; then
            :
          else
            grep -Fx "sdk/macos-x64/bin/databindc" "$RUNNER_TEMP/salts-utils-nupkg.txt"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: salts-utils-native-nuget
          path: dist/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish package and GitHub Release
    if: needs.metadata.outputs.release == 'true'
    needs: [metadata, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: salts-utils-native-nuget
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet nuget add source --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text --name github https://nuget.pkg.github.com/qigao/index.json
          dotnet nuget push "dist/SaltsUtils.Native.${{ needs.metadata.outputs.version }}.nupkg" --api-key "$GITHUB_TOKEN" --source github --skip-duplicate
      - name: Create GitHub Release from version tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "$TAG"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" dist/*.nupkg --repo "$GITHUB_REPOSITORY" --verify-tag --title "SaltsUtils $VERSION" --generate-notes
