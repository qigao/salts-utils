name: SaltsUtils CI
on:
  pull_request:
  push:
    branches:
      - master
      - 'release/salts-utils-4.3-*'
  workflow_dispatch:
    inputs:
      prepare_release:
        description: Validate six-RID SDK for Release, publication through Actions UI
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
concurrency:
  group: salts-utils-ci-${{ inputs.prepare_release && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.prepare_release }}
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      builds: ${{ steps.select.outputs.builds }}
      tests: ${{ steps.select.outputs.tests }}
      has_builds: ${{ steps.select.outputs.has_builds }}
      has_tests: ${{ steps.select.outputs.has_tests }}
      packaging_only: ${{ steps.select.outputs.packaging_only }}
      run_packaging_contract: ${{ steps.select.outputs.run_packaging_contract }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected checks
        id: select
        shell: pwsh
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PREPARE_RELEASE: ${{ inputs.prepare_release || false }}
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: ./cmake/ci/select-ci-scope.ps1 -EventName $env:CI_EVENT -BaseRef $env:CI_BASE -HeadRef $env:CI_HEAD -HeadBranch $env:CI_BRANCH -PrepareRelease ($env:PREPARE_RELEASE -eq 'true')
      - name: Test conservative CI scope selection
        shell: pwsh
        run: pwsh -NoProfile -File cmake/ci/test-select-ci-scope.ps1
      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'version-semver'
          $project = Get-Content CMakeLists.txt -Raw
          if ($project -notmatch '(?m)^\s*VERSION\s+([0-9][^\s)]*)' -or $Matches[1] -ne $version) {
            throw 'CMake and package versions differ'
          }
          if ($env:GITHUB_REF -match '^refs/heads/release/salts-utils-4\.3-[^/]+$') {
            $channel = (Get-Content cmake/ci/rc-channel.txt -Raw).Trim()
            if ($channel -notmatch '^rc\.[1-9][0-9]*$') { throw "Invalid RC channel: $channel" }
            $version = "$version-$channel"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Qualify nupkg permission rewrite
        shell: bash
        run: python3 packaging/nuget/test_preserve_nupkg_permissions.py
      - name: Qualify immutable release asset identity
        shell: bash
        run: bash .github/scripts/test-release-asset-identity.sh
      - name: Qualify curl GitHub Packages restore
        shell: bash
        run: python3 cmake/ci/github_packages_test.py
      - name: Verify private DataBind source and typed-error uniqueness contracts
        shell: bash
        run: python3 cmake/ci/verify_databind_release_source.py --self-test
  packaging_contract:
    needs: scope
    if: needs.scope.outputs.run_packaging_contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Qualify NuGet permission rewriting
        shell: bash
        run: python3 packaging/nuget/test_preserve_nupkg_permissions.py
      - name: Qualify final package structure, identity and extraction
        shell: bash
        run: python3 packaging/nuget/test_package_contract.py
      - name: Qualify immutable release asset identity guard
        shell: bash
        run: bash .github/scripts/test-release-asset-identity.sh
      - name: Qualify curl GitHub Packages restore
        shell: bash
        run: python3 cmake/ci/github_packages_test.py
  native:
    needs: scope
    if: needs.scope.outputs.has_builds == 'true'
    uses: ./.github/workflows/native-build.yml
    with:
      builds: ${{ needs.scope.outputs.builds }}
      version: ${{ needs.scope.outputs.version }}
    secrets: inherit
  tests:
    needs: [scope, native]
    if: needs.scope.outputs.has_tests == 'true'
    uses: ./.github/workflows/native-tests.yml
    with:
      tests: ${{ needs.scope.outputs.tests }}
  package:
    needs: [scope, native, tests]
    if: (github.event_name == 'workflow_dispatch' && inputs.prepare_release) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/salts-utils-4.3-'))
    uses: ./.github/workflows/sdk-package.yml
    with:
      version: ${{ needs.scope.outputs.version }}
    secrets: inherit
  result:
    name: CI result
    needs: [scope, native, tests, package, packaging_contract]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful selected checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SELECTED_RESULTS: ${{ join(needs.*.result, ',') }}
          HAS_BUILDS: ${{ needs.scope.outputs.has_builds }}
          BUILD_RESULT: ${{ needs.native.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          PREPARE_RELEASE: ${{ inputs.prepare_release || false }}
          RC_BRANCH_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/salts-utils-4.3-') }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PACKAGING_ONLY: ${{ needs.scope.outputs.packaging_only }}
          RUN_PACKAGING_CONTRACT: ${{ needs.scope.outputs.run_packaging_contract }}
          PACKAGING_CONTRACT_RESULT: ${{ needs.packaging_contract.result }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = success
          case ",$SELECTED_RESULTS," in *,failure,*|*,cancelled,*) exit 1 ;; esac
          if [ "$HAS_BUILDS" = true ]; then
            test "$BUILD_RESULT" = success
            test "$TEST_RESULT" = success
          fi
          if [ "$PREPARE_RELEASE" = true ] || [ "$RC_BRANCH_PUSH" = true ]; then test "$PACKAGE_RESULT" = success; fi
          if [ "$RUN_PACKAGING_CONTRACT" = true ]; then test "$PACKAGING_CONTRACT_RESULT" = success; fi
