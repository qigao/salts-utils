name: DataBind exact-source IDLC CSTL ASan gate (#639)

'on':
  pull_request:
    paths:
      - '.github/workflows/databind-source-idlc-asan-639.yml'
      - 'vendor/monocypher/**'
      - 'databind/runtime/data_bind_contract_fingerprint.c'
      - 'cmake/ci/probe_monocypher_odr.c'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: databind-source-idlc-asan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-cnet-plus-candidate-databind:
    if: >-
      github.repository == 'qigao/salts-utils' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.ref == 'test/source-idlc-asan-639-stacked-641' &&
        github.event.pull_request.head.repo.full_name == 'qigao/salts-utils') ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/test/source-idlc-asan-639-stacked-641'))
    name: Real source-built IDLC + CNet/DataBind DSOs with ASan/UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CC: gcc
      CXX: g++
      GRAPH_ROOT: /tmp/databind-source-idlc-asan-639
      PKG_ROOT: /tmp/databind-source-idlc-asan-639/prefix
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      CCACHE_DIR: ${{ github.workspace }}/.cache/databind-monocypher-asan
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout reviewed DataBind candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout original published Salts CNet source
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: v2.3.0-rc.15
          path: build/monocypher-source/salts
          persist-credentials: false
      - name: Checkout immutable published SaltsUtils 4.3.0-rc.10 source
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: v4.3.0-rc.10
          path: build/monocypher-source/salts-utils-release
          persist-credentials: false
      - name: Attest exact release source and apply four-file candidate overlay
        shell: bash
        run: |
          set -euo pipefail
          release="$GITHUB_WORKSPACE/build/monocypher-source/salts-utils-release"
          test "$(git -C "$release" rev-parse HEAD)" = '1410c9fd479f9faab31503523d8e31cc506b5b25'
          for path in vendor/monocypher/CMakeLists.txt \
              vendor/monocypher/databind_monocypher.c \
              vendor/monocypher/databind_monocypher_namespace.h \
              databind/runtime/data_bind_contract_fingerprint.c; do
            cp "$GITHUB_WORKSPACE/$path" "$release/$path"
          done
          test "$(git -C "$release" diff --name-only | wc -l)" -eq 2
          test "$(git -C "$release" ls-files --others --exclude-standard | wc -l)" -eq 2
          echo 'saltsutils_source_tag=v4.3.0-rc.10' >> "$GITHUB_STEP_SUMMARY"
          echo 'saltsutils_candidate_overlay=PR641 four-file namespace patch (NOT PUBLISHED)' >> "$GITHUB_STEP_SUMMARY"
          echo 'source_candidate_not_immutable_published_binary=true' >> "$GITHUB_STEP_SUMMARY"
          # The normal SaltsUtils master CI separately exercises the new patch
          # with its current 2.2 compatibility input. Do not add Unicode
          # compatibility/fallback branches to this exact 2.3 consumer gate.
      - name: Restore pinned shared vcpkg graph
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@0dc254695917bc180504d916240292e9096e9da5
        with:
          mode: read
      - name: Restore pinned re2c generator
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@0dc254695917bc180504d916240292e9096e9da5
      - name: Prepare Salts Linux build host
        uses: ./build/monocypher-source/salts/.github/actions/setup-build-host
      - name: Attest source identities and native host prerequisites
        shell: bash
        env:
          EXPECTED_UTILS: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build nasm pkg-config ccache binutils
          mkdir -p "$GRAPH_ROOT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_UTILS"
          test "$(git -C build/monocypher-source/salts rev-parse HEAD)" = '21bdb1145fbb2b39ee3fa644173ec037adba7b87'
          test "$(git -C build/monocypher-source/salts-utils-release rev-parse HEAD)" = '1410c9fd479f9faab31503523d8e31cc506b5b25'
          {
            echo "salts_cnet_exact_source=21bdb1145fbb2b39ee3fa644173ec037adba7b87"
            echo "saltsutils_candidate_patch_source=$EXPECTED_UTILS"
            echo "saltsutils_immutable_release_base=1410c9fd479f9faab31503523d8e31cc506b5b25"
            echo "saltsutils_overlay=vendor_namespace_4_files"
            echo 'saltsutils_binary_is_candidate_not_published=true'
            echo 'salts_cstl_linkage=static-hidden-test-only Salts #1167 / PR #1169'
            echo 'salts_cstl_original_release_linkage=NOT_QUALIFIED'
            echo 'published_native_runtime_binaries_used=false'
            echo 'sanitizers=address,undefined'
            echo 'odr_violation_suppression=none'
          } | tee "$GRAPH_ROOT/provenance.txt"
          {
            echo "SALTS_ROOT=$GRAPH_ROOT/prefix/salts"
            echo "LD_LIBRARY_PATH=$GRAPH_ROOT/prefix/salts/lib:$GRAPH_ROOT/build-utils/bin:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"

      # Salts #1167 / Draft PR #1169 independently qualified a hidden-static
      # test-only topology under unsuppressed ASan. This is NOT the published
      # rc.15 CSTL ownership topology and must never be counted as its pass.
      - name: Build exact Salts CNet / Plugin / CSTL native source with sanitizers
        shell: bash
        run: |
          set -euo pipefail
          flags='-fsanitize=address -fsanitize=undefined -g -fno-omit-frame-pointer'
          cmake --preset linux-dev-ci \
            -S "$GITHUB_WORKSPACE/build/monocypher-source/salts" \
            -B "$GRAPH_ROOT/build-salts" -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$SALTS_ROOT" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DCMAKE_PROJECT_Salts_INCLUDE="$GITHUB_WORKSPACE/cmake/ci/cstl-hidden-source-odr.cmake" \
            -DENABLE_SANITIZER_ADDRESS=ON -DENABLE_SANITIZER_UNDEFINED=ON \
            -DENABLE_SANITIZER_THREAD=OFF \
            -DCMAKE_C_FLAGS="$flags" -DCMAKE_CXX_FLAGS="$flags" \
            -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address -fsanitize=undefined' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address -fsanitize=undefined'
          cmake --build "$GRAPH_ROOT/build-salts" --parallel 2
          cmake --install "$GRAPH_ROOT/build-salts"
          test -f "$SALTS_ROOT/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$SALTS_ROOT/lib/libcnet.so"

      - name: Build changed DataBind and private Monocypher original sources
        shell: bash
        run: |
          set -euo pipefail
          flags='-fsanitize=address -fsanitize=undefined -g -fno-omit-frame-pointer'
          cmake --preset ci-linux-release-user \
            -S "$GITHUB_WORKSPACE/build/monocypher-source/salts-utils-release" \
            -B "$GRAPH_ROOT/build-utils" -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$GRAPH_ROOT/prefix/salts-utils" \
            -DCMAKE_PREFIX_PATH="$SALTS_ROOT" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZER_ADDRESS=ON -DENABLE_SANITIZER_UNDEFINED=ON \
            -DENABLE_SANITIZER_THREAD=OFF \
            -DCMAKE_C_FLAGS="$flags" -DCMAKE_CXX_FLAGS="$flags" \
            -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address -fsanitize=undefined' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address -fsanitize=undefined'
          cmake --build "$GRAPH_ROOT/build-utils" --target data_bind salts_idlc --parallel 2
          test -f "$GRAPH_ROOT/build-utils/bin/libdata_bind.so"

      - name: Audit real CNet/Monocypher/DataBind ASan compilation and exported symbols
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$GRAPH_ROOT/source-audit.json"
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["GRAPH_ROOT"])
          required = {
              "salts": ["cnet/src/cnet_module.c",
                        "vendor/monocypher/monocypher.c"],
              "utils": ["vendor/monocypher/databind_monocypher.c",
                        "databind/runtime/data_bind_contract_fingerprint.c",
                        "databind/runtime/data_bind_method_plan.c"],
          }
          report = {}
          for label, suffixes in required.items():
              build = root / ("build-salts" if label == "salts" else "build-utils")
              rows = json.loads((build / "compile_commands.json").read_text())
              for suffix in suffixes:
                  matches = [row for row in rows if row["file"].replace("\\", "/").endswith("/" + suffix)]
                  if len(matches) != 1:
                      raise SystemExit(f"{label}: missing required original source {suffix}")
                  cmd = matches[0].get("command") or " ".join(matches[0].get("arguments", []))
                  if "-fsanitize=address" not in cmd or "-fsanitize=undefined" not in cmd:
                      raise SystemExit(f"{label}: uninstrumented {suffix}")
              report[label] = {"required_compiled_sources": suffixes,
                               "configure_commands": len(rows)}
          print(json.dumps(report, indent=2))
          PY
          # Never let a private DataBind Monocypher symbol leak as a
          # public, unprefixed crypto_* definition from libdata_bind.
          nm -D --defined-only "$GRAPH_ROOT/build-utils/bin/libdata_bind.so" \
            | tee "$GRAPH_ROOT/databind-exported-symbols.txt"
          if awk '{print $3}' "$GRAPH_ROOT/databind-exported-symbols.txt" \
              | grep -Eq '^crypto_'; then
            echo 'Unprefixed Monocypher API leaked from DataBind DSO' >&2
            exit 1
          fi
          nm --defined-only "$GRAPH_ROOT/build-utils/lib/libdatabind_monocypher.a" \
            | tee "$GRAPH_ROOT/databind-private-vendor-symbols.txt"
          grep -Eq 'databind_private_crypto_argon2_no_extras' \
            "$GRAPH_ROOT/databind-private-vendor-symbols.txt"
          # Salts #1167 independently proved static-hidden CSTL is a viable
          # test-only ODR topology. Keep global ODR detection enabled and
          # require both real runtime DSOs to hide this duplicate descriptor.
          for so in "$SALTS_ROOT/lib/libsalts.so" \
                    "$GRAPH_ROOT/build-utils/bin/libdata_bind.so"; do
            if nm -D --defined-only "$so" | awk '{print $3}' \
                  | grep -qx 'stl_bplus_tree_container_desc'; then
              echo "Unsafe exported CSTL descriptor in $so" >&2
              exit 1
            fi
          done

      - name: Compile and run unsuppressed ASan/UBSan original dual-DSO consumer
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address -fsanitize=undefined \
            -g -fno-omit-frame-pointer \
            "$GITHUB_WORKSPACE/cmake/ci/probe_monocypher_odr.c" \
            -ldl -o "$GRAPH_ROOT/dual-dso-probe"
          # Check *both* loader orders in distinct processes. No ASan/UBSan
          # suppressions, no producer tag rewrites, no package substitution.
          ldd "$GRAPH_ROOT/build-utils/bin/libdata_bind.so" \
            | tee "$GRAPH_ROOT/data-bind-linked-libraries.txt"
          for order in cnet-first data-first; do
            "$GRAPH_ROOT/dual-dso-probe" \
              "$SALTS_ROOT/lib/libcnet.so" \
              "$GRAPH_ROOT/build-utils/bin/libdata_bind.so" "$order"
          done

      - name: Prove source-built IDLC source and final link both ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          test -x "$GRAPH_ROOT/build-utils/bin/salts-idlc"
          python3 - <<'PY' | tee "$GRAPH_ROOT/idlc-compile-link-audit.json"
          import json
          import os
          from pathlib import Path
          import re
          import shlex
          import subprocess
          root = Path(os.environ["GRAPH_ROOT"])
          build = root / "build-utils"
          rows = json.loads((build / "compile_commands.json").read_text())
          matches = [r for r in rows if
                     r.get("file", "").replace("\\", "/").endswith("/databind/compiler/main.c")]
          if len(matches) != 1:
              raise SystemExit("Source-built salts_idlc: expected exact compiler main.c")
          row = matches[0]
          command = row.get("command") or " ".join(row.get("arguments", []))
          if "-fsanitize=address" not in command or "-fsanitize=undefined" not in command:
              raise SystemExit("Source-built IDLC main.c was not ASan+UBSan instrumented")
          args = row.get("arguments") or shlex.split(command)
          if "-o" not in args:
              raise SystemExit("Source-built IDLC main.c compile has no output object")
          obj = Path(args[args.index("-o") + 1])
          if not obj.is_absolute():
              obj = Path(row.get("directory", str(build))) / obj
          if not obj.is_file():
              raise SystemExit("Source-built IDLC compiled object is missing")
          ninja = subprocess.run(
              ["ninja", "-C", str(build), "-t", "commands", "salts_idlc"],
              check=True, capture_output=True, text=True)
          links = [line for line in ninja.stdout.splitlines()
                   if re.search(r"-o (?:[^ ]*/)?bin/salts-idlc(?:\\s|$)", line)
                   and " -c " not in line]
          if len(links) != 1 or not all(
                  flag in links[0] for flag in ("-fsanitize=address", "-fsanitize=undefined")):
              raise SystemExit("Source-built salts-idlc final linker flags missing")
          print(json.dumps({
              "coverage": "EXACT_RELEASE_SOURCE_IDLC_ASAN_UBSAN_CANDIDATE_CSTL_HIDDEN",
              "compiler_source": row.get("file"),
              "compiled_object": str(obj),
              "source_instrumented": True,
              "executable_final_link_instrumented": True,
              "producer_source_tags_mutated": False,
              "production_CSTL_default_static_qualified": False
          }, indent=2))
          PY
          ldd "$GRAPH_ROOT/build-utils/bin/salts-idlc" \
            | tee "$GRAPH_ROOT/source-built-idlc-linked-libraries.txt"
          grep -F "$SALTS_ROOT/lib/libsalts.so" \
            "$GRAPH_ROOT/source-built-idlc-linked-libraries.txt"
          grep -F 'libasan.so' "$GRAPH_ROOT/source-built-idlc-linked-libraries.txt"
          grep -F 'libubsan.so' "$GRAPH_ROOT/source-built-idlc-linked-libraries.txt"

      - name: Generate real typed Service schema using unsuppressed source-built IDLC
        shell: bash
        run: |
          set -euo pipefail
          schema="$GITHUB_WORKSPACE/build/monocypher-source/salts-utils-release/databind/compiler/tests/native/test_service_native_lowering.schema"
          output="$GRAPH_ROOT/source-idlc-generated"
          mkdir -p "$output"
          test -s "$schema"
          for index in 1 2 3; do
            "$GRAPH_ROOT/build-utils/bin/salts-idlc" "$schema" --lang c \
              --output "$output/service_native_records.h" \
              --source-output "$output/service_native_records.c"
            test -s "$output/service_native_records.h"
            test -s "$output/service_native_records.c"
          done
          sha256sum "$schema" "$output/service_native_records.h" \
            "$output/service_native_records.c" \
            | tee "$GRAPH_ROOT/source-idlc-generated.sha256"
          echo 'source_idlc_binary=ASAN_UBSAN_FROM_EXACT_RELEASE_SRC_WITH_CSTL_HIDDEN_TEST_ONLY' >> "$GRAPH_ROOT/provenance.txt"

      - name: Preserve exact source/symbol/sanitizer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saltsutils-639-source-idlc-asan-odr
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/databind-source-idlc-asan-639/provenance.txt
            /tmp/databind-source-idlc-asan-639/source-audit.json
            /tmp/databind-source-idlc-asan-639/databind-exported-symbols.txt
            /tmp/databind-source-idlc-asan-639/databind-private-vendor-symbols.txt
            /tmp/databind-source-idlc-asan-639/data-bind-linked-libraries.txt
            /tmp/databind-source-idlc-asan-639/idlc-compile-link-audit.json
            /tmp/databind-source-idlc-asan-639/source-built-idlc-linked-libraries.txt
            /tmp/databind-source-idlc-asan-639/source-idlc-generated.sha256

      - name: Verify review branch remains unchanged
        if: always()
        shell: bash
        env:
          EXPECTED_UTILS: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_UTILS"
          test -z "$(git status --porcelain --untracked-files=no)"
