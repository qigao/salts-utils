name: databind direct salts phase1
on:
  push:
    branches: [fix/databind-direct-salts-parsers]
    paths:
      - '.github/workflows/databind-direct-salts-phase1.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/databind-direct-salts-parsers
          fetch-depth: 0
      - name: Finish datetime direct migration
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('tbe/data_bind/data_bind.c')
          s = source.read_text()
          s = s.replace('turbo_datetime_format_rfc822', 'datetime_format_rfc822')
          source.write_text(s)
          assert 'turbo_datetime' not in source.read_text()
          assert 'turbo_' not in Path('tbe/data_bind/tbe_typed.c').read_text()
          PY
          git diff --check
          git diff -- tbe/data_bind/data_bind.c
      - name: Commit phase 1 completion
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tbe/data_bind/data_bind.c
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'refactor: finish direct salts datetime migration'
          git push origin HEAD:fix/databind-direct-salts-parsers
