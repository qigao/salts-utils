name: databind direct salts phase1
on:
  push:
    branches: [fix/databind-direct-salts-parsers]
    paths:
      - '.github/workflows/databind-direct-salts-phase1.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/databind-direct-salts-parsers
          fetch-depth: 0
      - name: Migrate DataBind YAML to CYaml
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('tbe/data_bind/data_bind.c')
          s = source.read_text()
          if '#include "cyaml.h"' not in s:
              s = s.replace('#include "dsv_filter.h"\n', '#include "dsv_filter.h"\n#include "cyaml.h"\n#include "cyaml_json_adapter.h"\n')

          # Native CYaml SAX is shape-compatible with DataBind's validation-only handler.
          s = s.replace('turbo_yaml_sax_parser_t *yaml_sax;', 'cyaml_sax_parser_t *yaml_sax;')
          s = s.replace('static const turbo_yaml_sax_handler_t DATA_BIND_YAML_SAX_VALIDATE_HANDLER = {0};',
                        'static const cyaml_sax_handler_t DATA_BIND_YAML_SAX_VALIDATE_HANDLER = {0};')
          s = s.replace('turbo_yaml_sax_parser_feed', 'cyaml_sax_parser_feed')
          s = s.replace('turbo_yaml_sax_parser_finish', 'cyaml_sax_parser_finish')
          s = s.replace('turbo_yaml_sax_parser_destroy', 'cyaml_sax_parser_destroy')
          s = s.replace('turbo_yaml_sax_parser_create(&DATA_BIND_YAML_SAX_VALIDATE_HANDLER, parser)',
                        'cyaml_sax_parser_create(&DATA_BIND_YAML_SAX_VALIDATE_HANDLER, parser, NULL)')

          # cyaml_sax_parser_error returns a structured native error, so expose just its message
          # to the format-neutral DataBind stream error surface.
          err_anchor = '''static DataBindStatus data_bind_stream_sax_error(data_bind_stream_t *parser, DataBindError *error,\n                                                 const char *operation) {'''
          err_helper = '''static const char *data_bind_yaml_sax_error(const cyaml_sax_parser_t *parser) {\n  const cyaml_error_t *error = cyaml_sax_parser_error(parser);\n  return error != NULL && error->msg[0] != '\\0' ? error->msg : NULL;\n}\n\n''' + err_anchor
          if 'static const char *data_bind_yaml_sax_error' not in s:
              if err_anchor not in s:
                  raise SystemExit('stream error anchor missing')
              s = s.replace(err_anchor, err_helper, 1)
          s = s.replace('message = turbo_yaml_sax_parser_error(parser->yaml_sax);',
                        'message = data_bind_yaml_sax_error(parser->yaml_sax);')

          start = s.index('static DataBindStatus data_bind_parse_yaml_selected(')
          end = s.index('\nDataBindStatus data_bind_parse_yaml(', start)
          native = r'''static DataBindStatus data_bind_parse_yaml_selected(DataBind *codec, const char *type_name,
                                                    const char *yaml, size_t len,
                                                    const char *yamlpath, int bind_all,
                                                    const DataBindQueryLimits *query_limits,
                                                    DataBindQueryDiagnostic *query_diagnostic,
                                                    DataBindValue **out_value,
                                                    DataBindError *error) {
  cyaml_doc_t *doc = NULL;
  cyaml_path_result_t matches = {0};
  cyaml_node_t *root;
  DataBindValue *result = NULL;
  char error_path[256];
  size_t count = 0;
  size_t i;
  int has_matches = 0;

  if (out_value != NULL) *out_value = NULL;
  if (codec == NULL || codec->schema_root == NULL || type_name == NULL || yaml == NULL ||
      out_value == NULL) {
    return db_codec_error(codec, error, DATA_BIND_ERR_INVALID_ARG, "Invalid YAML bind arguments");
  }
  if (!bind_type_supported(codec->schema_root, type_name)) {
    db_error_format_path(error_path, sizeof(error_path), "yaml", yamlpath);
    return db_error_set(error, DATA_BIND_ERR_TYPE_NOT_FOUND, error_path, -1, -1,
                        "Type not found: %s", type_name);
  }
  doc = cyaml_parse(yaml, len, NULL, NULL);
  if (doc == NULL) {
    db_error_format_path(error_path, sizeof(error_path), "yaml", NULL);
    return db_error_set(error, DATA_BIND_ERR_PARSE, error_path, -1, -1, "YAML parse failed");
  }

  root = cyaml_root(doc);
  if (yamlpath != NULL && yamlpath[0] != '\0') {
    qvm_limits_t native_limits;
    qvm_diagnostic_t native_diagnostic;
    if (!data_bind_query_limits_to_qvm(query_limits, &native_limits, query_diagnostic)) {
      cyaml_free(doc);
      db_error_format_path(error_path, sizeof(error_path), "yaml", yamlpath);
      return db_error_set(error, DATA_BIND_ERR_INVALID_ARG, error_path, -1, -1,
                          "Invalid YPATH query limits");
    }
    data_bind_qvm_diagnostic_init(&native_diagnostic);
    matches = cyaml_path_query_ex(doc, NULL, yamlpath, &native_limits, &native_diagnostic);
    has_matches = 1;
    data_bind_query_diagnostic_from_qvm(query_diagnostic, &native_diagnostic,
                                        TURBO_QUERY_OK, NULL);
    if (matches.error != NULL) {
      size_t error_pos = matches.error_pos;
      char path_message[160];
      snprintf(path_message, sizeof(path_message), "%s", matches.error);
      cyaml_path_result_free(&matches);
      cyaml_free(doc);
      db_error_format_path(error_path, sizeof(error_path), "yaml", yamlpath);
      return db_error_set(error, data_bind_query_failure_status(query_diagnostic), error_path, -1,
                          error_pos <= INT_MAX ? (int)error_pos : -1, "YPATH parse failed: %s",
                          path_message);
    }
    count = matches.count;
  } else if (bind_all && root != NULL && root->type == CYAML_SEQ) {
    count = root->seq.count;
  } else if (root != NULL) {
    count = 1;
  }

  if (count == 0) {
    if (has_matches) cyaml_path_result_free(&matches);
    cyaml_free(doc);
    db_error_format_path(error_path, sizeof(error_path), "yaml", yamlpath);
    return db_error_set(error, DATA_BIND_ERR_TYPE_MISMATCH, error_path, -1, -1,
                        "YAML selection matched no values");
  }

  if (bind_all) {
    result = dbv_new(DATA_BIND_VALUE_LIST);
    if (result == NULL) {
      if (has_matches) cyaml_path_result_free(&matches);
      cyaml_free(doc);
      return db_error_set(error, DATA_BIND_ERR_OOM, "yaml", -1, -1,
                          "Out of memory creating YAML result list");
    }
  }

  for (i = 0; i < (bind_all ? count : 1); i++) {
    cyaml_node_t *node;
    json_value_t *json_value;
    DataBindValue *bound;
    if (has_matches) node = matches.nodes[i];
    else if (bind_all && root->type == CYAML_SEQ) node = root->seq.items[i];
    else node = root;

    json_value = json_value_from_cyaml_node(doc, node);
    if (json_value == NULL) {
      data_bind_value_free(result);
      if (has_matches) cyaml_path_result_free(&matches);
      cyaml_free(doc);
      db_error_format_path(error_path, sizeof(error_path), "yaml", yamlpath);
      return db_error_set(error, DATA_BIND_ERR_TYPE_MISMATCH, error_path, -1, -1,
                          "YAML value cannot be represented as JSON-compatible data");
    }
    bound = bind_json_typed_value(codec->schema_root, type_name, json_value);
    data_bind_json_freep(&json_value);
    if (bound == NULL) {
      data_bind_value_free(result);
      if (has_matches) cyaml_path_result_free(&matches);
      cyaml_free(doc);
      db_error_format_path(error_path, sizeof(error_path), "yaml", yamlpath);
      return db_error_set(error, DATA_BIND_ERR_TYPE_MISMATCH, error_path, -1, -1,
                          "YAML bind failed for type: %s", type_name);
    }
    if (!bind_all) {
      result = bound;
    } else if (!dbv_array_push(&result->data.array_val, bound)) {
      data_bind_value_free(bound);
      data_bind_value_free(result);
      if (has_matches) cyaml_path_result_free(&matches);
      cyaml_free(doc);
      return db_error_set(error, DATA_BIND_ERR_OOM, "yaml", -1, -1,
                          "Out of memory appending YAML result");
    }
  }

  if (has_matches) cyaml_path_result_free(&matches);
  cyaml_free(doc);
  *out_value = result;
  db_error_clear(error);
  return DATA_BIND_OK;
}
'''
          s = s[:start] + native + s[end:]
          source.write_text(s)
          assert 'turbo_yaml_' not in s
          assert 'turbo_parse_yaml' not in s
          assert 'turbo_free_yaml' not in s

          cmake = Path('tbe/data_bind/CMakeLists.txt')
          c = cmake.read_text()
          marker = '    Salts::CsvParser\n    Salts::JsonParser\n'
          replacement = '    Salts::CsvParser\n    Salts::CYaml\n    Salts::CYamlJsonAdapter\n    Salts::JsonParser\n'
          data_bind_section = c.split('target_link_libraries(\n  ${DATA_BIND_TARGET}',1)[1]
          if '    Salts::CYaml\n' not in data_bind_section:
              if marker not in c:
                  raise SystemExit('DataBind direct parser link marker missing')
              c = c.replace(marker, replacement, 1)
          cmake.write_text(c)
          PY
          git diff --check
          git diff -- tbe/data_bind/data_bind.c tbe/data_bind/CMakeLists.txt
      - name: Commit YAML direct migration
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tbe/data_bind/data_bind.c tbe/data_bind/CMakeLists.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'refactor: use salts CYaml directly'
          git push origin HEAD:fix/databind-direct-salts-parsers
