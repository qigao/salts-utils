name: Apply JSONPath VM builder leak fix

on:
  push:
    branches:
      - migration/move-parser-capabilities
    paths:
      - .github/workflows/parser-migration-apply-jsonpath-leak-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply exact minimal fix
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("parser/json_parser/src/jsonpath.c")
          text = path.read_text()
          old = """      program->expr_vm = builder.insns;
                program->expr_vm_count = (uint32_t)builder.count;
              }
            }
          """
          new = """      program->expr_vm = builder.insns;
                program->expr_vm_count = (uint32_t)builder.count;
              } else {
                free(builder.insns);
              }
            }
          """
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one finalize block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = "parser/json_parser/src/jsonpath.c"
          git diff -- parser/json_parser/src/jsonpath.c
          grep -A8 -B4 -n 'program->expr_vm = builder.insns' parser/json_parser/src/jsonpath.c

      - name: Commit minimal fix
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parser/json_parser/src/jsonpath.c
          git commit -m "fix: free unused JSONPath VM builder storage"
          git push origin HEAD:migration/move-parser-capabilities
