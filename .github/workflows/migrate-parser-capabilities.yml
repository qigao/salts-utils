name: One-shot parser capability migration

on:
  push:
    branches:
      - migration/move-parser-capabilities
    paths:
      - .github/workflows/migrate-parser-capabilities.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SaltsUtils migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/move-parser-capabilities
          path: dst
          fetch-depth: 0

      - name: Checkout pinned Salts parser source
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: 7ca4981854276854974696600791cf0b017fcfa4
          path: src
          fetch-depth: 1

      - name: Move parser ownership into SaltsUtils
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dst/parser
          cp -a src/parser dst/parser
          rm -rf dst/parser/uri_parser

          python3 - <<'PY'
          from pathlib import Path

          parser_root = Path('dst/parser')
          aggregate = parser_root / 'CMakeLists.txt'
          text = aggregate.read_text()
          text = text.replace('  uri_parser\n', '')
          text = text.replace('  uri_parser/include\n', '')
          aggregate.write_text(text)

          for cmake in parser_root.rglob('CMakeLists.txt'):
              text = cmake.read_text()
              text = text.replace('EXPORT SaltsTargets', 'EXPORT SaltsUtilsTargets')
              cmake.write_text(text)

          root = Path('dst/CMakeLists.txt')
          text = root.read_text()
          anchor = 'add_subdirectory(vendor)\n'
          if 'add_subdirectory(parser)\n' not in text:
              if anchor not in text:
                  raise SystemExit('missing vendor anchor in SaltsUtils root CMakeLists.txt')
              text = text.replace(anchor, anchor + 'add_subdirectory(parser)\n', 1)
          root.write_text(text)
          PY

          if grep -R -n --include='CMakeLists.txt' 'EXPORT SaltsTargets' dst/parser; then
            echo 'moved parser still exports through SaltsTargets' >&2
            exit 1
          fi
          if grep -R -n --include='CMakeLists.txt' 'add_subdirectory(uri_parser)' dst/parser; then
            echo 'destination parser still builds UriParser' >&2
            exit 1
          fi
          if grep -R -n --include='CMakeLists.txt' 'uri_parser/include' dst/parser; then
            echo 'destination parser still installs UriParser headers' >&2
            exit 1
          fi
          test ! -e dst/parser/uri_parser
          grep -q '^add_subdirectory(parser)$' dst/CMakeLists.txt

          cd dst
          git diff --check
          git rm .github/workflows/migrate-parser-capabilities.yml
          git add CMakeLists.txt parser
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: move parser capability ownership to salts-utils'
          git push origin HEAD:migration/move-parser-capabilities
