name: Jinja root environment policy verification

on:
  push:
    branches:
      - fix/jinja-root-autoescape-selector
      - fix/jinja-root-environment-policies-green
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salts-utils-jinja-root-policy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  SALTS_SHA: c4197712261a563ed7e238152b34cb50a2ef98a9
  VCPKG_SHA: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01

jobs:
  red-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact SaltsUtils head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=2 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Checkout exact Salts and vcpkg
        shell: bash
        run: |
          set -euxo pipefail
          git init salts
          git -C salts remote add origin https://github.com/qigao/salts.git
          git -C salts fetch --depth=1 origin "${SALTS_SHA}"
          git -C salts checkout --detach FETCH_HEAD
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout --detach "${VCPKG_SHA}"

      - name: Restore vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: jinja-root-policy-vcpkg-x64-linux-b1b19307-v1

      - name: Set up Go for BoringSSL
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Prepare toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm curl xz-utils
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          sudo mkdir -p /opt/salts
          sudo ln -sfn "${GITHUB_WORKSPACE}/vcpkg" /opt/vcpkg
          bash cmake/ci/install-re2c.sh

      - name: Build and expose exact Salts
        shell: bash
        working-directory: salts
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF
          cmake --build build/linux-gcc-debug --target install -j2
          sudo ln -sfn "${RUNNER_TEMP}/salts-project/external/pkgs/salts/debug" /opt/salts/debug

      - name: Build standalone host Lemon
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S tools/lemon -B build/host-lemon -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host-lemon --target lemon -j2

      - name: Configure exact SaltsUtils head
        shell: bash
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="${GITHUB_WORKSPACE}/build/host-lemon/lemon"

      - name: Build focused Jinja environment test
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug --target test_jinja_environment -j2

      - name: Run focused Jinja environment test
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug -R '^test_jinja_environment$' --output-on-failure

      - name: Verify exact head and clean tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain --untracked-files=no)"
