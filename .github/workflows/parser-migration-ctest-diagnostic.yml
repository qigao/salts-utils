name: Parser migration CTest diagnostic
# GREEN rerun after the minimal JSONPath builder ownership fix.

on:
  push:
    branches:
      - migration/move-parser-capabilities
    paths:
      - .github/workflows/parser-migration-ctest-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SALTS_CUTOVER_SHA: 801202e58c2d86b35202414d4812e79a2fd25bae
      ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=2:halt_on_error=1
    steps:
      - name: Checkout exact SaltsUtils head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact SaltsUtils head
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --check

      - name: Checkout exact Salts cutover
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: 801202e58c2d86b35202414d4812e79a2fd25bae
          path: salts
          persist-credentials: false

      - name: Verify exact Salts source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C salts rev-parse HEAD)" = "$SALTS_CUTOVER_SHA"
          test -d salts/uri
          test ! -e salts/parser
          test ! -e salts/tinytest/junit_to_html
          test ! -e salts/tinytest/test/junit_to_html_test.cmake

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
          path: vcpkg
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm curl xz-utils
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          sudo mkdir -p /opt/salts
          sudo ln -sfn "$GITHUB_WORKSPACE/vcpkg" /opt/vcpkg
          bash cmake/ci/install-re2c.sh

      - name: Build and install exact Salts cutover
        shell: bash
        working-directory: salts
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF
          cmake --build build/linux-gcc-debug --target install -j2

      - name: Wire installed Salts cutover
        shell: bash
        run: |
          set -euxo pipefail
          package="$RUNNER_TEMP/salts-project/external/pkgs/salts/debug"
          test -f "$package/lib/cmake/Salts/SaltsTargets.cmake"
          sudo ln -sfn "$package" /opt/salts/debug

      - name: Build standalone host Lemon
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S tools/lemon -B build/host-lemon -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host-lemon --target lemon -j2

      - name: Configure SaltsUtils against exact cutover
        shell: bash
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="$GITHUB_WORKSPACE/build/host-lemon/lemon"

      - name: Build full SaltsUtils graph
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build --preset linux-dev-user -j2

      - name: Run full SaltsUtils CTest graph and capture diagnostics
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ctest --test-dir build/linux-gcc-debug --no-tests=error --output-on-failure 2>&1 | tee "$RUNNER_TEMP/ctest-full.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/ctest-status"
          exit 0

      - name: Upload CTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-migration-ctest-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/ctest-full.log
            ${{ runner.temp }}/ctest-status
            build/linux-gcc-debug/Testing/Temporary/LastTest.log
            build/linux-gcc-debug/Testing/Temporary/LastTestsFailed.log

      - name: Preserve CTest result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat "$RUNNER_TEMP/ctest-status")"
          test "$status" -eq 0

      - name: Verify exact head and clean tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain --untracked-files=no)"
