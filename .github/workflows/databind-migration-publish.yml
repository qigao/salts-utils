name: Publish verified direct parser migration
on:
  push:
    branches: [work/databind-migration-publish]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fe8b1be76626bbb4c3d6e6288e6d6da35b94c411
          path: source
      - name: Preserve native XML empty fields and prepare CI blobs
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          test -z "$(git status --porcelain)"
          test "$(git ls-remote --heads origin refs/heads/refactor/databind-direct-salts-parsers | cut -f1)" = fe8b1be76626bbb4c3d6e6288e6d6da35b94c411
          python3 ../transport/.github/prepare-native-ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: databind-native-ci-${{ github.run_id }}
          retention-days: 7
          path: evidence/
