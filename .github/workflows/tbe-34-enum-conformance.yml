name: TBE enum conformance

on:
  push:
    branches: [master, fix/tbe-34-enum-conformance]
    paths: ['databind/**', 'cmake/**', '.github/workflows/tbe-34-enum-conformance.yml']
  pull_request:
    branches: [master]
    paths: ['databind/**', 'cmake/**', '.github/workflows/tbe-34-enum-conformance.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: tbe-enums-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  enum-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=2:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/enum-evidence"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD > "$RUNNER_TEMP/enum-evidence/head.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/enum-evidence/source.tar.gz"
      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read


      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare versioned SDK toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          sudo ln -sfn "$VCPKG_ROOT" /opt/vcpkg

      - name: Restore Salts 1.2.0 and re2c 4.6.3
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-versioned-native-sdk.sh linux-x64 linux-x64

      - name: Expose versioned Salts SDK
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$SALTS_ROOT/lib/cmake/Salts/SaltsConfig.cmake"
          sudo mkdir -p /opt/salts
          sudo ln -sfn "$SALTS_ROOT" /opt/salts/debug

      - name: Build the standalone host parser generator
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S tools/lemon -B build/host-lemon -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host-lemon --target lemon -j2

      - name: Build production compiler and complete TBE tests
        shell: bash
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user -DENABLE_SANITIZER_UNDEFINED=ON \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="$GITHUB_WORKSPACE/build/host-lemon/lemon" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            2>&1 | tee "$RUNNER_TEMP/enum-evidence/configure.log"
          cmake --build build/linux-gcc-debug --target tbe/all -j2 \
            2>&1 | tee "$RUNNER_TEMP/enum-evidence/tbe-build.log"
          cp build/linux-gcc-debug/compile_commands.json "$RUNNER_TEMP/enum-evidence/"
          tar -czf "$RUNNER_TEMP/enum-evidence/parser-tools.tar.gz" \
            build/linux-gcc-debug/databind/schema/schema_lexer_gen.c \
            build/linux-gcc-debug/databind/schema/schema_grammar_gen.h
      - name: Run complete TBE suite
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug/tbe --no-tests=error --output-on-failure \
            --output-junit "$RUNNER_TEMP/enum-evidence/tbe.xml"
      - name: Compile and execute generated enum consumers
        shell: bash
        run: |
          set -euxo pipefail
          python3 databind/compiler/test/enum_conformance.py \
            --compiler build/linux-gcc-debug/bin/databindc \
            --source "$GITHUB_WORKSPACE" --salts-include /opt/salts/debug/include \
            2>&1 | tee "$RUNNER_TEMP/enum-evidence/enum-conformance.log"
      - name: Verify unchanged source
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tbe-enums-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/enum-evidence/
            build/linux-gcc-debug/tbe/Testing/Temporary/
