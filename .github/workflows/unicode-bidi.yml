name: Unicode bidi conformance

on:
  push:
    branches:
      - feature/unicode-bidi
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salts-utils-unicode-bidi-${{ github.ref_name }}
  cancel-in-progress: true

env:
  SALTS_SHA: ce9b57bc166bf86bd311fe6f86b7619dd64673e1
  VCPKG_SHA: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01

jobs:
  bidi-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact SaltsUtils head
        uses: actions/checkout@v4

      - name: Checkout exact Salts and vcpkg
        shell: bash
        run: |
          set -euxo pipefail
          git init salts
          git -C salts remote add origin https://github.com/qigao/salts.git
          git -C salts fetch --depth=1 origin "${SALTS_SHA}"
          git -C salts checkout --detach FETCH_HEAD
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout --detach "${VCPKG_SHA}"

      - name: Restore vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: unicode-bidi-vcpkg-x64-linux-b1b19307-v1

      - name: Set up Go for BoringSSL
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Prepare toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm curl xz-utils
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          sudo mkdir -p /opt/salts
          sudo ln -sfn "${GITHUB_WORKSPACE}/vcpkg" /opt/vcpkg
          bash cmake/ci/install-re2c.sh

      - name: Build and expose exact Salts
        shell: bash
        working-directory: salts
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF
          cmake --build build/linux-gcc-debug --target install -j2
          sudo ln -sfn "${RUNNER_TEMP}/salts-project/external/pkgs/salts/debug" /opt/salts/debug

      - name: Build standalone host Lemon
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S tools/lemon -B build/host-lemon -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host-lemon --target lemon -j2

      - name: Configure exact SaltsUtils head
        shell: bash
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="${GITHUB_WORKSPACE}/build/host-lemon/lemon"

      - name: Verify deterministic Unicode 17 bidi table generation
        shell: bash
        run: |
          set -euxo pipefail
          python3 unicode/tools/generate_bidi_data.py \
            --derived-bidi-class unicode/data/17.0.0/DerivedBidiClass.txt \
            --output "${RUNNER_TEMP}/unicode_bidi_data.h"
          cmp "${RUNNER_TEMP}/unicode_bidi_data.h" unicode/src/unicode_bidi_data.h

      - name: Build focused bidi tests
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug \
            --target test_salts_unicode_bidi test_salts_unicode_bidi_conformance -j2

      - name: Run Unicode 17 bidi tests
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug \
            -R '^test_salts_unicode_bidi(_conformance)?

      - name: Install exact SaltsUtils head
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug --target install -j2

      - name: Verify C and C++ install-tree bidi consumers
        shell: bash
        env:
          SALTS_ROOT: /opt/salts/debug
        run: |
          set -euxo pipefail
          consumer="${RUNNER_TEMP}/unicode-bidi-consumer"
          mkdir -p "${consumer}"

          cat > "${consumer}/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.27)
          project(SaltsUnicodeInstallConsumer LANGUAGES C CXX)
          find_package(SaltsUtils CONFIG REQUIRED)
          add_executable(unicode_consumer_c main.c)
          add_executable(unicode_consumer_cpp main.cpp)
          target_link_libraries(unicode_consumer_c PRIVATE Salts::Unicode)
          target_link_libraries(unicode_consumer_cpp PRIVATE Salts::Unicode)
          EOF

          cat > "${consumer}/main.c" <<'EOF'
          #include <salts_unicode.h>
          int main(void) {
            salts_unicode_bidi_class value = SALTS_UNICODE_BIDI_ON;
            return salts_unicode_bidi_class_of(0x05D0u, &value) == SALTS_UNICODE_OK &&
                           value == SALTS_UNICODE_BIDI_R
                       ? 0
                       : 1;
          }
          EOF

          cat > "${consumer}/main.cpp" <<'EOF'
          #include <salts_unicode.h>
          int main() {
            const char text[] = "A";
            uint8_t level = 9u;
            return salts_unicode_bidi_paragraph_level(
                       vstr_from_buf(text, sizeof(text) - 1u), &level) == SALTS_UNICODE_OK &&
                           level == 0u
                       ? 0
                       : 1;
          }
          EOF

          cmake -S "${consumer}" -B "${consumer}/build" -G Ninja             -DCMAKE_PREFIX_PATH="/opt/salts-utils/debug;${GITHUB_WORKSPACE}/vcpkg_installed/x64-linux/debug"
          cmake --build "${consumer}/build" -j2
          "${consumer}/build/unicode_consumer_c"
          "${consumer}/build/unicode_consumer_cpp"

      - name: Verify exact head
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
 --output-on-failure

      - name: Install exact SaltsUtils head
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug --target install -j2

      - name: Verify C and C++ install-tree Unicode consumers
        shell: bash
        env:
          SALTS_ROOT: /opt/salts/debug
        run: |
          set -euxo pipefail
          consumer="${RUNNER_TEMP}/unicode-bidi-consumer"
          mkdir -p "${consumer}"

          cat > "${consumer}/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.27)
          project(SaltsUnicodeInstallConsumer LANGUAGES C CXX)
          find_package(SaltsUtils CONFIG REQUIRED)
          add_executable(unicode_consumer_c main.c)
          add_executable(unicode_consumer_cpp main.cpp)
          target_link_libraries(unicode_consumer_c PRIVATE Salts::Unicode)
          target_link_libraries(unicode_consumer_cpp PRIVATE Salts::Unicode)
          EOF

          cat > "${consumer}/main.c" <<'EOF'
          #include <salts_unicode.h>
          int main(void) {
            salts_unicode_line_break value = SALTS_UNICODE_LINE_BREAK_XX;
            return salts_unicode_line_break_class(0x2010u, &value) == SALTS_UNICODE_OK &&
                           value == SALTS_UNICODE_LINE_BREAK_HH
                       ? 0
                       : 1;
          }
          EOF

          cat > "${consumer}/main.cpp" <<'EOF'
          #include <salts_unicode.h>
          int main() {
            salts_unicode_line_break value = SALTS_UNICODE_LINE_BREAK_XX;
            return salts_unicode_line_break_class(0x2060u, &value) == SALTS_UNICODE_OK &&
                           value == SALTS_UNICODE_LINE_BREAK_WJ
                       ? 0
                       : 1;
          }
          EOF

          cmake -S "${consumer}" -B "${consumer}/build" -G Ninja             -DCMAKE_PREFIX_PATH="/opt/salts-utils/debug;${GITHUB_WORKSPACE}/vcpkg_installed/x64-linux/debug"
          cmake --build "${consumer}/build" -j2
          "${consumer}/build/unicode_consumer_c"
          "${consumer}/build/unicode_consumer_cpp"

      - name: Verify exact head
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
