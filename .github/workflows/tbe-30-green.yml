name: TBE #30 green verification

on:
  push:
    branches:
      - fix/tbe-30-descriptor-layout-validation
    paths:
      - '.github/scripts/tbe30_apply_green.py'
      - '.github/workflows/tbe-30-green.yml'

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout salts-utils fix tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped production patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/scripts/tbe30_apply_green.py
          git diff --check
          git diff -- tbe/data_bind/tbe_typed.c tbe/data_bind/tbe_typed.h

      - name: Checkout pinned Salts
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: 9678f606ef5deea5161fb7ed11bbe6e1af2d1c2f
          path: salts

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 0

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: tbe-30-vcpkg-x64-linux-b1b19307-v1

      - name: Prepare toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm re2c
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          sudo mkdir -p /opt/salts
          sudo ln -sfn "$GITHUB_WORKSPACE/vcpkg" /opt/vcpkg

      - name: Build and install Salts debug profile
        shell: bash
        working-directory: salts
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user
          cmake --build build/linux-gcc-debug --target install -j2
          sudo ln -sfn "${PROJECT_ROOT}/external/pkgs/salts/debug" /opt/salts/debug

      - name: Configure salts-utils developer profile
        shell: bash
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user

      - name: Build focused descriptor safety target
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug --target test_tbe_typed_descriptor_safety -j2

      - name: Run focused descriptor safety test
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug -R '^test_tbe_typed_descriptor_safety$' --output-on-failure

      - name: Build and run typed regression
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug --target test_tbe_typed -j2
          ctest --test-dir build/linux-gcc-debug -R '^test_tbe_typed$' --output-on-failure

      - name: Commit verified production patch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tbe/data_bind/tbe_typed.c tbe/data_bind/tbe_typed.h
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix(tbe): validate typed descriptor layouts'
          git push origin HEAD:fix/tbe-30-descriptor-layout-validation
