name: TBE descriptor safety

on:
  push:
    branches: [master, fix/tbe-30-descriptor-layout-validation]
    paths:
      - 'tbe/**'
      - 'tests/databind_direct_parsers/**'
      - 'tests/package_config/**'
      - 'tools/lemon/CMakeLists.txt'
      - 'cmake/**'
      - 'presets/**'
      - 'CMake*.txt'
      - 'CMake*.cmake'
      - 'CMake*Presets.json'
      - 'vcpkg.json'
      - '.github/workflows/tbe-30-green.yml'
  pull_request:
    branches: [master]
    paths:
      - 'tbe/**'
      - 'tests/databind_direct_parsers/**'
      - 'tests/package_config/**'
      - 'tools/lemon/CMakeLists.txt'
      - 'cmake/**'
      - 'presets/**'
      - 'CMake*.txt'
      - 'CMake*.cmake'
      - 'CMake*Presets.json'
      - 'vcpkg.json'
      - '.github/workflows/tbe-30-green.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tbe-descriptor-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  descriptor-safety:
    name: Exact-head ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=2:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout the exact committed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record and verify source identity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/tbe30-evidence"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD | tee "$RUNNER_TEMP/tbe30-evidence/head.txt"
          git diff --exit-code

      - name: Checkout pinned Salts
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: c4197712261a563ed7e238152b34cb50a2ef98a9
          path: salts
          persist-credentials: false

      - name: Record native parser dependency revision
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C salts rev-parse HEAD)" = c4197712261a563ed7e238152b34cb50a2ef98a9
          git -C salts rev-parse HEAD | tee "$RUNNER_TEMP/tbe30-evidence/salts-head.txt"

      - name: Checkout vcpkg at the manifest baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
          path: vcpkg
          fetch-depth: 0
          persist-credentials: false

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: tbe-30-vcpkg-x64-linux-b1b19307-v1

      - name: Prepare toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm curl xz-utils
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          sudo mkdir -p /opt/salts
          sudo ln -sfn "$GITHUB_WORKSPACE/vcpkg" /opt/vcpkg

      - name: Record Salts cache toolchain
        id: salts-toolchain
        shell: bash
        run: echo "key=gcc-$(gcc -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"

      - name: Restore pinned Salts debug package
        id: salts-package-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/salts-project/external/pkgs/salts/debug
          key: salts-pkg-v2-descriptor-nosan-${{ runner.os }}-${{ runner.arch }}-${{ steps.salts-toolchain.outputs.key }}-debug-c4197712261a563ed7e238152b34cb50a2ef98a9-vcpkg-b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01

      - name: Install pinned re2c 4.6 and Unicode data
        shell: bash
        run: bash cmake/ci/install-re2c.sh

      - name: Build the standalone host parser generator
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S tools/lemon -B build/host-lemon -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host-lemon --target lemon -j2

      - name: Build and install pinned Salts debug profile
        if: steps.salts-package-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: salts
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          # Salts is a pinned dependency here, not the sanitizer target. Its build
          # runs host-side Lemon during generation, so keep that host tool outside
          # ASan/UBSan and sanitize the salts-utils targets in the next step.
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF
          cmake --build build/linux-gcc-debug --target install -j2

      - name: Save pinned Salts debug package
        if: steps.salts-package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/salts-project/external/pkgs/salts/debug
          key: salts-pkg-v2-descriptor-nosan-${{ runner.os }}-${{ runner.arch }}-${{ steps.salts-toolchain.outputs.key }}-debug-c4197712261a563ed7e238152b34cb50a2ef98a9-vcpkg-b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01

      - name: Use pinned Salts debug package
        shell: bash
        run: |
          set -euxo pipefail
          package="$RUNNER_TEMP/salts-project/external/pkgs/salts/debug"
          test -d "$package/include"
          test -d "$package/lib"
          sudo ln -sfn "$package" /opt/salts/debug

      - name: Configure developer preset with both sanitizers
        shell: bash
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user -DENABLE_SANITIZER_UNDEFINED=ON \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="$GITHUB_WORKSPACE/build/host-lemon/lemon" \
            -DDATABIND_HOST_LEMON_EXECUTABLE="$GITHUB_WORKSPACE/build/host-lemon/lemon" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee "$RUNNER_TEMP/tbe30-evidence/configure.log"
          python3 - <<'PY'
          import json
          from pathlib import Path
          commands = json.loads(Path('build/linux-gcc-debug/compile_commands.json').read_text())
          required = {'data_bind.c', 'test_data_bind_public_api.c', 'tbe_typed.c', 'test_tbe_typed_descriptor_safety.c',
                      'test_tbe_typed_descriptor_boundary.c', 'test_tbe_typed_generated.c',
                      'test_tbe_typed_optional_binary.c',
                      'test_data_bind.c', 'test_tbe_compiler.c', 'schema_parser_dsl.c',
                      'test_schema_boundaries.c', 'test_schema_boundary.c',
                      'data_bind_cmeta.c', 'data_bind_cflow.c',
                      'test_data_bind_cmeta.c', 'test_data_bind_cflow.c'}
          found = set()
          for entry in commands:
              name = Path(entry['file']).name
              if name in required:
                  command = entry.get('command', ' '.join(entry.get('arguments', [])))
                  assert '-fsanitize=address' in command, command
                  assert '-fsanitize=undefined' in command, command
                  found.add(name)
          assert found == required, (found, required)
          PY

      - name: Build focused tests and generated consumer
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug --target test_tbe_typed_descriptor_safety \
            test_tbe_typed_descriptor_boundary test_tbe_typed_generated \
            test_tbe_typed_optional_binary test_tbe_typed -j2 \
            2>&1 | tee "$RUNNER_TEMP/tbe30-evidence/focused-build.log"

      - name: Run focused ASan and UBSan tests
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug --no-tests=error \
            -R '^(test_tbe_typed_descriptor_safety|test_tbe_typed_descriptor_boundary|test_tbe_typed_generated|test_tbe_typed_optional_binary|test_tbe_typed)$' \
            --output-on-failure --output-junit "$RUNNER_TEMP/tbe30-evidence/focused.xml" \
            2>&1 | tee "$RUNNER_TEMP/tbe30-evidence/focused.log"

      - name: Build all TBE and DataBind targets
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug --target tbe/all -j2 \
            2>&1 | tee "$RUNNER_TEMP/tbe30-evidence/tbe-build.log"

      - name: Verify DataBind and SaltsUtils install partition
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug --parallel 2
          install_root="$RUNNER_TEMP/databind-install-component"
          salts_utils_root="$install_root/salts-utils"
          databind_root="$install_root/databind"
          rm -rf "$install_root"
          cmake --install build/linux-gcc-debug --prefix "$salts_utils_root" --component Unspecified
          cmake --install build/linux-gcc-debug --prefix "$databind_root" --component DataBind
          test -f "$salts_utils_root/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test ! -e "$salts_utils_root/lib/cmake/DataBind/DataBindConfig.cmake"
          test -f "$databind_root/lib/cmake/DataBind/DataBindConfig.cmake"
          test ! -e "$databind_root/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -f "$databind_root/include/data_bind.h"
          test -f "$databind_root/include/schema_parser_dsl.h"
          test -x "$databind_root/bin/tbe_compiler"
          test -d "$databind_root/bin/templates"
          test "$(realpath "$salts_utils_root")" != "$(realpath "$databind_root")"

      - name: Run DataBind package ownership contracts
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug --no-tests=error -R "^(databind_package_config_repeated_find|databind_package_config_adapters|databind_parent_ownership_transition)$" --output-on-failure --output-junit "$RUNNER_TEMP/tbe30-evidence/databind-package.xml" 2>&1 | tee "$RUNNER_TEMP/tbe30-evidence/databind-package.log"
      - name: Configure and build standalone DataBind preset
        shell: bash
        working-directory: tbe
        run: |
          set -euxo pipefail
          rm -rf build/linux-ci-debug
          export SALTS_ROOT=/opt/salts/debug
          export SALTS_UTILS_ROOT="$GITHUB_WORKSPACE/build/linux-gcc-debug"
          export VCPKG_ROOT="$GITHUB_WORKSPACE/vcpkg"
          export DATABIND_RE2C_EXECUTABLE="$RE2C_ROOT/bin/re2c"
          export DATABIND_LEMPAR="$GITHUB_WORKSPACE/tools/lemon/lempar.c"
          export DATABIND_HOST_LEMON_EXECUTABLE="$GITHUB_WORKSPACE/build/host-lemon/lemon"
          cmake --preset linux-ci-debug
          cmake --build --preset linux-ci-debug
          test -f build/linux-ci-debug/DataBindConfig.cmake
          test -f build/linux-ci-debug/DataBindTargets.cmake
          test -f build/linux-ci-debug/DataBindAdapterTargets.cmake

      - name: Run blocking schema-order and legacy fixture regressions
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug --no-tests=error \
            -R '^(test_data_bind|test_tbe_compiler|test_schema_boundaries|test_tbe_compiler_schema_boundary)$' \
            --output-on-failure --output-junit "$RUNNER_TEMP/tbe30-evidence/schema-order.xml" \
            2>&1 | tee "$RUNNER_TEMP/tbe30-evidence/schema-order.log"

      # The pinned Core fixes salts#252; CMeta/CFlow and every other TBE target
      # must now pass. Keep ODR and leak detection enabled and do not allow failure.
      - name: Run blocking full TBE and DataBind runtime suite
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug/tbe --no-tests=error \
            --output-on-failure --output-junit "$RUNNER_TEMP/tbe30-evidence/tbe.xml" \
            2>&1 | tee "$RUNNER_TEMP/tbe30-evidence/tbe.log"

      - name: Verify direct parser dependencies
        shell: bash
        run: python3 tests/databind_direct_parsers/check_boundary.py -v

      - name: Run complete Jinja regressions with the allocator-bound SDK
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug --target jinja/all -j2 \
            2>&1 | tee "$RUNNER_TEMP/tbe30-evidence/jinja-build.log"
          ctest --test-dir build/linux-gcc-debug/jinja --no-tests=error --output-on-failure \
            --output-junit "$RUNNER_TEMP/tbe30-evidence/jinja.xml" \
            2>&1 | tee "$RUNNER_TEMP/tbe30-evidence/jinja.log"

      - name: Verify committed source was not modified
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code

      - name: Upload exact-head verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tbe-descriptor-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/tbe30-evidence/
            build/linux-gcc-debug/compile_commands.json
            build/linux-gcc-debug/CMakeCache.txt
            build/linux-gcc-debug/Testing/Temporary/
            build/linux-gcc-debug/tbe/Testing/Temporary/
            build/linux-gcc-debug/jinja/Testing/Temporary/
