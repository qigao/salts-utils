name: Native CI dependencies with curl
description: Pinned vcpkg contract and GitHub package downloads without Mono, NuGet or .NET.
inputs:
  contract-ref:
    description: Immutable qigao/vcpkg-cache contract commit.
    required: false
    default: dbf6f762bc2b0c50779713902ada5c213069bac6
  re2c:
    description: Restore the host re2c package in this job.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Checkout immutable shared cache contract
      uses: actions/checkout@v4
      with:
        repository: qigao/vcpkg-cache
        ref: ${{ inputs.contract-ref }}
        path: build/ci-vcpkg-contract
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Bootstrap canonical vcpkg and read-only curl cache
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python cmake/ci/setup_native_ci.py build/ci-vcpkg-contract
    - name: Download re2c host package with curl
      if: inputs.re2c == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        packages="${QIGAO_NUGET_PACKAGES:-$GITHUB_WORKSPACE/build/native-sdk/packages}"
        python cmake/ci/github_packages.py re2c --packages "$packages"
