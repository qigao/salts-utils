name: Prepare SaltsUtils build host
description: Install native build prerequisites and select Visual Studio.
runs:
  using: composite
  steps:
  - name: Prepare Linux dependencies
    if: runner.os == 'Linux'
    shell: bash
    run: |
      set -euo pipefail
      sudo apt-get update
      sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm libudev-dev libpipewire-0.3-dev libx11-dev libxext-dev
  - name: Prepare macOS dependencies
    if: runner.os == 'macOS'
    shell: bash
    run: |
      set -euo pipefail
      brew install ninja nasm autoconf automake autoconf-archive libtool gcc@15
      echo "$(brew --prefix gcc@15)/bin" >> "$GITHUB_PATH"
      apple_clang="$(xcrun --find clang)"
      echo "QIGAO_APPLE_CLANG=$apple_clang" >> "$GITHUB_ENV"
  - name: Prepare Windows dependencies
    if: runner.os == 'Windows'
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"
      choco install nasm ninja -y --no-progress
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
      $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
      if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vsInstall)) { throw "Visual Studio x64 C++ toolchain not found" }
      "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
