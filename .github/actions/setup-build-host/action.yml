name: Prepare SaltsUtils build host
description: Install native build prerequisites, compiler cache, and select Visual Studio.
runs:
  using: composite
  steps:
  - name: Restore compiler cache
    uses: actions/cache@v4
    with:
      path: ${{ env.CCACHE_DIR }}
      key: ${{ env.SALTS_UTILS_COMPILER_CACHE_NAMESPACE }}-${{ hashFiles('CMakeUserPresets.json', '.github/actions/setup-build-host/action.yml') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      restore-keys: |
        ${{ env.SALTS_UTILS_COMPILER_CACHE_NAMESPACE }}-${{ hashFiles('CMakeUserPresets.json', '.github/actions/setup-build-host/action.yml') }}-
  - name: Prepare Linux dependencies
    if: runner.os == 'Linux'
    shell: bash
    run: |
      set -euo pipefail
      sudo apt-get update
      sudo apt-get install -y --no-install-recommends ccache ninja-build pkg-config nasm libudev-dev libpipewire-0.3-dev libx11-dev libxext-dev
  - name: Prepare macOS dependencies
    if: runner.os == 'macOS'
    shell: bash
    run: |
      set -euo pipefail
      # Published macOS Salts::TinyTest uses AppleClang native TLS.
      # Homebrew GCC's emulated TLS ABI is incompatible (___emutls_v.*
      # undefined at link). Keep every native installed SDK consumer on
      # one canonical AppleClang toolchain, not a mixed compiler/linker graph.
      brew install ccache ninja nasm autoconf automake autoconf-archive libtool
      apple_clang="$(xcrun --find clang)"
      apple_clangxx="$(xcrun --find clang++)"
      test -x "$apple_clang"
      test -x "$apple_clangxx"
      echo "QIGAO_APPLE_CLANG=$apple_clang" >> "$GITHUB_ENV"
      echo "QIGAO_APPLE_CLANGXX=$apple_clangxx" >> "$GITHUB_ENV"
  - name: Prepare Windows dependencies
    if: runner.os == 'Windows'
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"
      choco install ccache nasm ninja -y --no-progress
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
      $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
      if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vsInstall)) { throw "Visual Studio x64 C++ toolchain not found" }
      "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
      if (-not (Get-Command ccache -ErrorAction SilentlyContinue)) { throw "ccache not found on Windows PATH" }
