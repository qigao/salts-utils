name: Prepare SaltsUtils build host
description: Install native build prerequisites and compiler cache.
outputs:
  cache-key:
    description: Compiler cache save key for this resolved SDK and source commit.
    value: ${{ steps.compiler-cache.outputs.cache-primary-key }}
  cache-hit:
    description: Exact compiler cache hit.
    value: ${{ steps.compiler-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
  - uses: qigao/vcpkg-cache/.github/actions/setup-ccache@v0.1.1
    id: ccache
  - name: Prepare Linux dependencies
    if: runner.os == 'Linux'
    shell: bash
    run: |
      set -euo pipefail
      sudo apt-get update
      sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm libudev-dev libpipewire-0.3-dev libx11-dev libxext-dev
  - name: Prepare macOS dependencies
    if: runner.os == 'macOS'
    shell: bash
    run: |
      set -euo pipefail
      brew install ninja nasm autoconf automake autoconf-archive libtool gcc@15
      echo "$(brew --prefix gcc@15)/bin" >> "$GITHUB_PATH"
      apple_clang="$(xcrun --find clang)"
      apple_clangxx="$(xcrun --find clang++)"
      test -x "$apple_clang"
      test -x "$apple_clangxx"
      echo "QIGAO_APPLE_CLANG=$apple_clang" >> "$GITHUB_ENV"
      echo "QIGAO_APPLE_CLANGXX=$apple_clangxx" >> "$GITHUB_ENV"
  - name: Prepare Windows dependencies
    if: runner.os == 'Windows'
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"
      choco install nasm ninja -y --no-progress
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  - name: Identify compiler cache environment
    id: identity
    shell: pwsh
    run: |
      "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT
  - name: Restore compiler cache
    id: compiler-cache
    uses: actions/cache/restore@v4
    with:
      path: ${{ env.CCACHE_DIR }}
      key: ${{ env.SALTS_UTILS_COMPILER_CACHE_NAMESPACE }}-${{ steps.ccache.outputs.version }}-${{ env.VCPKG_CACHE_REVISION }}-${{ steps.identity.outputs.image }}-${{ hashFiles('CMake*Presets.json', 'presets/**', 'vcpkg*.json', 'cmake/vcpkg-ports/**', '.github/actions/**', '.github/workflows/native-build.yml') }}-${{ env.SALTSCORE_VERSION }}-${{ env.CMETA_VERSION }}-${{ github.event.pull_request.head.sha || github.sha }}
      restore-keys: |
        ${{ env.SALTS_UTILS_COMPILER_CACHE_NAMESPACE }}-${{ steps.ccache.outputs.version }}-${{ env.VCPKG_CACHE_REVISION }}-${{ steps.identity.outputs.image }}-${{ hashFiles('CMake*Presets.json', 'presets/**', 'vcpkg*.json', 'cmake/vcpkg-ports/**', '.github/actions/**', '.github/workflows/native-build.yml') }}-
  - name: Start compiler cache statistics
    shell: bash
    run: |
      ccache --version
      ccache --zero-stats
